- id: less-risky
  question: Is NVIDIA really no riskier than the average chip company?
  ask: [less risky, riskier than average, no riskier, why is your discount rate lower, discount rate lower than, is nvidia risky, how risky]
  slide:
    layout: statement
    title: Strong finances, but the market does treat it as riskier
    bullets:
      - "Operating margin {{peers_operating_margin | Operating margin | NVIDIA}} against {{peers_operating_margin | Operating margin | AMD}} for AMD, with more cash than debt"
      - "But its beta is {{research_market | Beta | value}}: its share price moves more than the market, and Google Finance uses {{research_market | WACC, Google Finance | value}}"
      - "Two direct customers were {{research_policy | Largest direct customer, share of FY26 revenue | value}} and {{research_policy | Second direct customer, share of FY26 revenue | value}} of FY26 revenue"
      - That is why we show the higher rates next to ours, and why we size the position at three percent
    sources: ["Bloomberg FA, 20 Nov 2026; Google Finance, NVDA, 24 Nov 2026; NVIDIA Form 10-K FY26"]

