# Prepared answers. Used instantly, free, when a question contains one of the `ask` phrases
# (all the words, close together). Otherwise the question goes to Claude.
# Figures follow the same rule as the script: {{dataset | series | x}}, never typed.

- id: wasteful
  question: You used AI for a slideshow. Isn't that wasteful?
  ask: [ai for a slideshow, ai slideshow, wasteful, waste of energy, used ai slides, environmental disaster]
  slide:
    layout: split
    title: "Fair challenge: AI's footprint is real, and rising"
    bullets:
      - "NVIDIA's supply chain emissions: {{nvda_emissions | Scope 3 | FY25}} in FY25, {{nvda_emissions | Scope 3 | FY26}} in FY26"
      - We don't have a measured energy figure for this presentation
      - The test is whether the work AI does is worth the energy it uses
    chart: { type: line, datasetKey: nvda_emissions, series: [Scope 3], highlight: FY26 }

- id: energy
  question: How much energy does NVIDIA use?
  ask: [energy does nvidia, electricity does nvidia, power does nvidia, nvidia energy use, nvidia energy consumption, nvidia power consumption, company energy use, energy does the company]
  slide:
    layout: split
    title: NVIDIA's own energy use is rising, and now renewable
    bullets:
      - "{{nvda_energy | Total energy | FY24}} in FY24; {{nvda_energy | Total energy | FY26}} in FY26"
      - "Renewable share of that: {{nvda_renewable_share | Renewable | FY26}}"
      - This is NVIDIA's own use. Customers' data centres are not in it.
    chart: { type: line, datasetKey: nvda_energy, series: [Total energy, Renewable energy], highlight: FY26 }

- id: scope3
  question: What about Scope 3 and supply chain emissions?
  ask: [scope three, scope 3, supply chain emissions, nvidia carbon footprint, nvidia carbon emissions, nvidia greenhouse gas, company carbon footprint, their carbon footprint]
  slide:
    layout: split
    title: Scope 3 is the weak point, and it is growing
    bullets:
      - "{{nvda_emissions | Scope 3 | FY24}} in FY24; {{nvda_emissions | Scope 3 | FY26}} in FY26"
      - Most of it comes from making the chips, at partners like TSMC
      - "Own operations are far smaller: {{nvda_emissions | Scope 1 | FY26}} direct in FY26"
    chart: { type: line, datasetKey: nvda_emissions, series: [Scope 3], highlight: FY26 }

- id: water
  question: How much water does NVIDIA use?
  ask: [water does nvidia, nvidia water use, nvidia water usage, nvidia water consumption, water does the company]
  slide:
    layout: statement
    title: Water use is rising, and we won't quote a figure we haven't confirmed.
    bullets:
      - Bloomberg shows water withdrawal rising each year since FY24, but we have not confirmed its units, so we will not quote a figure
      - It falls mainly on chip factories and on customers' data centres
      - It is a question we would put to the company before investing

- id: cleaner-than-peers
  question: How does NVIDIA compare with peers on emissions?
  ask: [emissions peers, emissions compare, emissions competitors, cleaner than]
  slide:
    layout: split
    title: Lowest of the five, with a catch
    bullets:
      - NVIDIA owns no chip factories; TSMC and Intel do
      - NVIDIA's manufacturing emissions sit in Scope 3, not in this chart
    chart: { type: bar, datasetKey: peers_emissions_intensity, series: [Emissions intensity], highlight: NVIDIA }

- id: social-score
  question: Bloomberg gives NVIDIA a weak social score. Why?
  ask: [social score, social rating, social pillar, bloomberg social, social side, the s in esg]
  slide:
    layout: split
    title: The social score fell as NVIDIA reported less social data
    bullets:
      - "Bloomberg's social disclosure score fell from {{nvda_esg_scores | Social disclosure score | FY22}} to {{nvda_esg_scores | Social disclosure score | FY25}}, out of a hundred"
      - "What NVIDIA does report is strong: staff turnover of {{research_people | Staff turnover, FY26 | value}} and no workplace deaths"
      - Our ask as shareholders is simple. Publish the social data again
    chart: { type: line, datasetKey: nvda_esg_scores, series: [Social, Environmental, Governance], highlight: FY25 }
    sources: ["Bloomberg FA (ESG Social, Health & Safety), NVDA annual, 20 Nov 2026"]

- id: governance
  question: What about governance, since the CEO resigned?
  ask: [ceo resigned, jensen resigned, new ceo, interim ceo, governance, who runs nvidia, without jensen, jensen huang leaving]
  slide:
    layout: statement
    title: Governance is the biggest open risk, but the founder is back.
    bullets:
      - Jensen Huang resigned as CEO on 12 November 2026, and the board reinstated him days later
      - The board set up an independent national security and export-control oversight committee
      - SEC and California investigations have been reported and are not yet closed
      - This risk is still open, which is one reason we size the position at three percent
    sources: ["CNBC, 12 Nov 2026; NBC News, Nov 2026; NVIDIA Q3 FY27 earnings call, 17 Nov 2026"]

- id: taiwan
  question: What if something happens to Taiwan or TSMC?
  ask: [taiwan, depend on tsmc, reliance on tsmc, tsmc risk]
  slide:
    layout: split
    title: Taiwan is a real concentration risk
    bullets:
      - "TSMC makes about {{research_facts | TSMC share of leading-edge chips | value}} of the most advanced chips"
      - The same risk hits AMD, Broadcom and most rivals
      - We have not priced a Taiwan conflict into the model
    chart: { type: bar, datasetKey: research_cowos_share, series: [Share of CoWoS], highlight: NVIDIA }

- id: bubble
  question: Isn't this an AI bubble?
  ask: [ai bubble, a bubble, dot com, overvalued, too expensive, bubble burst]
  slide:
    layout: split
    title: Even if AI ended for good, a share is still worth something
    bullets:
      - "Price today: {{model_valuation | Value per share | Share price today}}. Our bear case, where rivals take share: {{model_valuation | Value per share | Bear case}}. If AI ended for good: {{model_valuation | Value per share | If AI ended for good}}"
      - "Forward P/E is {{peers_pe | Forward P/E | NVIDIA}}; Cisco in 2000 was {{research_facts | Cisco forward P/E, March 2000 | value}}"
      - If it pops, the price falls, but NVIDIA owns the hardware and the CUDA software, so it keeps its lead
    chart: { type: bar, datasetKey: model_valuation, series: [Value per share], highlight: If AI ended for good }
    sources: ["Team valuation model; Google Finance, 24 Nov 2026"]

- id: discount-rate
  question: Why that discount rate? Why not Bloomberg's?
  ask: [discount rate, your wacc, cost of capital, bloomberg wacc, bloomberg rate, why not google finance, fourteen percent, fifteen percent, ten and a half percent, why that rate]
  slide:
    layout: split
    title: We didn't invent a discount rate, and we show all three
    bullets:
      - "Ours is {{model_dcf_inputs | WACC, US semiconductor industry average | value}}, the US chip-industry average (Damodaran, NYU, January 2026)"
      - "Checked against NVIDIA's own rates: {{model_dcf_inputs | WACC, Google Finance | value}} at Google Finance, {{model_dcf_inputs | WACC, Bloomberg | value}} at Bloomberg"
      - "Base case at the three: {{model_sensitivity | Terminal growth 3% | 10.55%}}, {{model_sensitivity | Terminal growth 3% | 14.45%}} and {{model_sensitivity | Terminal growth 3% | 15.4%}}, all above today's {{model_dcf_inputs | Share price | value}}"
    chart: { type: waterfall, datasetKey: model_dcf_bridge, series: ["10.55%"], totals: [Enterprise value, Equity value], highlight: Equity value }
    sources: ["Damodaran (NYU), January 2026; Google Finance, NVDA, 24 Nov 2026; Bloomberg WACC, Q3 2026"]

- id: concentration
  question: Isn't it too dependent on data centres?
  ask: [customer concentration, few customers, dependent on data centers, reliant on data centers, one product, diversified]
  slide:
    layout: split
    title: Yes. Data Center is almost the whole company
    bullets:
      - "Data Center: {{nvda_segments_annual | Data Center | FY26}} of {{nvda_revenue_annual | Revenue | FY26}} in FY26"
      - Our data doesn't break revenue down by customer
    chart: { type: stackedBar, datasetKey: nvda_segments_annual, series: [Data Center, Gaming, Pro Visualization, Automotive], highlight: FY26 }

# ---- Added 24 Nov 2026 (Q&A prep). Full spoken answers live in docs/qa-bank/QA_PREP.md ----

- id: democrats-datacentres
  question: Democrats now control Congress and want to stop data-centre building. What happens to NVIDIA?
  ask: [democrats data centers, democrats data centres, data center moratorium, data centre moratorium, stop data centers, stop data centres, pause data centers, ban data centers, congress data centers, stop the build out]
  slide:
    layout: split
    title: A moratorium is the real risk, and it is more likely a delay than a stop
    bullets:
      - Federal law needs the President's signature, and he has said he would veto. The pressure is local and about electricity bills.
      - "Blocked or delayed in Q1 2026: {{research_policy | US data-centre projects blocked or delayed, Q1 2026 | value}} US projects, worth {{research_policy | Value of those projects | value}} billion dollars"
      - "{{research_policy | Revenue from customers outside the US, FY26 | value}} of NVIDIA's FY26 revenue came from customers outside the US"
      - "Our bear case, where rivals take share: {{model_valuation | Value per share | Bear case}} a share. If AI ended for good: {{model_valuation | Value per share | If AI ended for good}}"
    chart: { type: bar, datasetKey: model_valuation, series: [Value per share], highlight: If AI ended for good }
    sources: ["Data Center Watch via Network World, 2026; NVIDIA Form 10-K FY26; NVIDIA Q3 FY27 earnings call, 17 Nov 2026"]

- id: china-export
  question: What about export controls and China?
  ask: [export controls, china export, sell to china, china revenue, h20, h200, chinese market]
  slide:
    layout: statement
    title: China is already mostly out of the numbers
    bullets:
      - "China was {{research_policy | China share of FY26 revenue | value}} of FY26 revenue, down from about a fifth in earlier years"
      - "Licensed Hopper sales to China were {{research_q3_call | Licensed Hopper sales to China, Q3 FY27 | value}} in the October quarter; NVIDIA says they have stopped and its outlook includes none"
      - The risk is a rival that grows up there, not a loss we have not yet priced
    sources: ["NVIDIA Form 10-K FY26, as reported in research notes; NVIDIA Q3 FY27 earnings call, 17 Nov 2026"]

- id: customers
  question: Who are NVIDIA's biggest customers, and what if one stops buying?
  ask: [biggest customers, largest customers, top customers, hyperscalers, microsoft amazon, one customer stops, customer pulls back]
  slide:
    layout: split
    title: A few buyers are a large share of sales
    bullets:
      - "Two direct customers were {{research_policy | Largest direct customer, share of FY26 revenue | value}} and {{research_policy | Second direct customer, share of FY26 revenue | value}} of FY26 revenue"
      - They are usually the contract manufacturers and distributors, not the end users, so this understates the cloud giants
      - "Hyperscaler spending plans for 2026 add up to {{research_policy | Hyperscaler capex, 2026 guidance | value}} billion dollars"
      - A pause by two or three of them is close to our bear case, where spending pauses for a year
    chart: { type: bar, datasetKey: model_valuation, series: [Value per share], highlight: If AI ended for good }
    sources: ["NVIDIA Form 10-K FY26; company guidance via Yahoo Finance, 2026"]

- id: circular
  question: Isn't this circular, with NVIDIA investing in its own customers?
  ask: [circular financing, circular, vendor financing, invests in its customers, openai investment, round trip, propping up demand, guarantees, neocloud]
  slide:
    layout: statement
    title: This is the Lucent worry. The exposure is real, and NVIDIA says it is conditional
    bullets:
      - Lucent lent to customers in 1999 who then could not pay
      - "NVIDIA reports {{research_q3_call | Guarantees | value}} of guarantees, {{research_q3_call | Purchase commitments | value}} of purchase commitments and {{research_q3_call | Neocloud commitments | value}} of neocloud commitments"
      - On the earnings call, management said a guarantee only starts once the customer has raised the money to build
      - We have not yet read the full quarterly filing, and it is the first thing we would check before buying
    sources: ["NVIDIA Q3 FY27 earnings call, 17 Nov 2026"]

- id: depreciation
  question: GPUs wear out quickly. Is the spending sustainable?
  ask: [gpus wear out, depreciation, useful life, obsolete, short lived chips, how long do gpus last, gpu lifespan]
  slide:
    layout: split
    title: Chips last years, not decades, so demand must keep renewing
    bullets:
      - "Economic life of an AI chip: {{research_policy | GPU economic life, low | value}} to {{research_policy | GPU economic life, high | value}} years, against decades for fibre"
      - "That cuts both ways: an overbuild cannot sit and wait, and customers must keep buying newer chips"
      - "If AI ended for good, our harshest case, is exactly this: spending stalls and falls"
    chart: { type: bar, datasetKey: model_valuation, series: [Value per share], highlight: If AI ended for good }

- id: competition
  question: Isn't Google, Amazon or Broadcom going to take the business with custom chips?
  ask: [custom chips, tpu, trainium, google chips, asics, broadcom, losing share, competition]
  slide:
    layout: statement
    title: Share is slipping at the margin, and the biggest buyers are building their own
    bullets:
      - "In announced post-2026 frontier deals, NVIDIA is {{research_policy | NVIDIA share of GPU power in announced post-2026 frontier deals | value}} of the power, the rest split across rivals"
      - Custom chips suit known jobs; frontier training still runs mostly on NVIDIA and CUDA
      - We named Google ourselves as the one to watch
      - "Gross margin is guided to bottom at {{research_q3_call | Gross margin guide, Q4 FY27, low | value}} to {{research_q3_call | Gross margin guide, Q4 FY27, high | value}} next quarter, before improving"
    sources: ["JPMorgan (Cembalest), as reported in research notes; NVIDIA Q3 FY27 earnings call, 17 Nov 2026"]

- id: recommendation
  question: So what are you actually recommending, and what would make you sell?
  ask: [your recommendation, recommending, would you buy, what would make you sell, price target, how much would you invest, position size]
  slide:
    layout: statement
    title: "Our recommendation: Buy."
    bullets:
      - Start with three percent of the portfolio for three to five years, well inside our ten percent limit on any one stock
      - "Base case above today's {{model_dcf_inputs | Share price | value}} at all three rates: {{model_sensitivity | Terminal growth 3% | 10.55%}}, {{model_sensitivity | Terminal growth 3% | 14.45%}} and {{model_sensitivity | Terminal growth 3% | 15.4%}}"
      - "Our bear case, where rivals take share, costs the portfolio {{model_downside | Cost to the portfolio | Bear case}}; if AI ended for good, {{model_downside | Cost to the portfolio | If AI ended for good}}"
      - We would add only if cloud spending plans rise again and the CEO investigation closes, and sell if they are cut

