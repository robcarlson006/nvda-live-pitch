- id: buybacks
  question: Is NVIDIA just buying back shares because it has nothing better to spend on?
  ask: [buybacks, buy back, buying back shares, buying back stock, share repurchases, capital allocation, return cash, dividends, what do they do with the cash]
  slide:
    layout: statement
    title: Buybacks come after the business has been funded, not instead of it
    bullets:
      - "{{research_q3_call | Cash returned to shareholders, Q3 FY27 | value}} returned in the October quarter, {{research_q3_call | Share of free cash flow returned, year to date | value}} of this year's free cash flow so far"
      - "{{research_q3_call | Buyback authorization remaining | value}} of authorization remains, to be used by the end of fiscal 2028"
      - Management says its first call on cash is helping suppliers add capacity, then customer financing
      - Our model does not count buybacks, so the share count stays flat
    sources: ["NVIDIA Q3 FY27 earnings call, 17 Nov 2026"]

- id: analyst-targets
  question: Why should we trust your numbers over Wall Street's?
  ask: [wall street, the street, analyst targets, analysts say, trust your numbers, trust your model, your model versus analysts, what do analysts think]
  slide:
    layout: split
    title: Our base case is above every analyst target, and that is the discount rate
    bullets:
      - "Average analyst target {{research_market | Analyst target, average | value}}, highest {{research_market | Analyst target, highest | value}}; our base case {{model_valuation | Value per share | Base case}}"
      - "The gap is our rate. At Google Finance's {{research_market | WACC, Google Finance | value}} the base case is {{model_sensitivity | Terminal growth 3% | 14.45%}}, close to the average"
