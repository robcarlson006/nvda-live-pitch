  slide:
    layout: split
    title: Margins are guided to dip next quarter, then recover
    bullets:
      - "Gross margin was {{research_q3_call | Gross margin, Q3 FY27 | value}} in the October quarter"
      - "Guided to bottom at {{research_q3_call | Gross margin guide, Q4 FY27, low | value}} to {{research_q3_call | Gross margin guide, Q4 FY27, high | value}} next quarter"
      - "Then {{research_q3_call | Gross margin outlook, FY28, low | value}} to {{research_q3_call | Gross margin outlook, FY28, high | value}} the year after. It was {{nvda_margins_annual | Gross margin | FY23}} in FY23, when demand paused"
