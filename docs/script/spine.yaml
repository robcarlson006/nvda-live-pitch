  say: "In 1999 they launched the GeForce 256 and gave it a new name: the GPU. In 2000 Microsoft picked NVIDIA for the first Xbox and paid two hundred million dollars up front. By 2007, Forbes named NVIDIA company of the year. A successful gaming company. They could have stopped there."
  sources: [GeForce 256 launch, 1999; Forbes, 3 January 2008]

# Beat 4. What CUDA is (the cores: a handful light one by one, then thousands at once)
- id: cuda
  speaker: Rob
  effect: cpu-gpu
  cues: [announced cuda, announced cooda, announced kuda, november 2006, november two thousand and six]
  layout: statement
  title: "2006: CUDA."
  bullets:
    - text: "A normal processor: a handful of fast workers, one job after another"
      cue: one job after another
    - text: "A graphics chip: thousands of workers, all at the same time"
      cue: at the same time
    - text: CUDA lets anyone put those workers to work
      cue: let anyone
    - text: Given away free, and built into every gaming card
      cue: away for free
  say: "Instead, in November 2006, they announced CUDA. Here's the idea. A normal processor is a handful of very fast workers doing one job after another. A graphics chip is thousands of smaller workers all doing the same job at the same time, in parallel. The screen behind me is exactly that: thousands of cores firing together. CUDA let anyone, not just graphics programmers, put those thousands of workers to work. It grew out of a Stanford PhD project by Ian Buck, who NVIDIA hired in 2004. And here's the part that matters: they gave it away for free, and they built it into every gaming card they sold."
  sources: [NVIDIA, SC06, November 2006; Ian Buck, Brook for GPUs (Stanford)]

