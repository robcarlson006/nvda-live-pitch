  say: "Two: software. Think iPhone versus Android. NVIDIA builds the hardware and the software together, so it just works. More than six million developers use CUDA. It has over a thousand libraries, refined for nearly twenty years, and it's free. AMD's answer, ROCm, launched in 2016, nine years behind. When a new AI breakthrough comes out, it's written for CUDA on day one. Everyone else gets it months later, if at all."

# Beat 11. Connections (the cores: clusters merge into one block)
- id: connections
  speaker: Rob
  effect: merge72
  cues: [three connections, 3 connections, connections nvidia, nvlink wires, nv link wires]
  layout: statement
  title: "Three: connections."
  bullets:
    - text: "NVLink: {{research_facts | GPUs per NVL72 rack | value}} chips in a rack act as one giant chip"
