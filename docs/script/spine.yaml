  say: "We didn't invent a discount rate; we tested three. At the US chip-industry rate, a share is worth **{{model_three_rates | Value per share | 10.55% industry (Damodaran)}}**. At Google Finance's rate, {{model_three_rates | Value per share | 14.45% Google Finance}}. At Bloomberg's, {{model_three_rates | Value per share | 15.4% Bloomberg}}. All three are above our dated reference price."

# Every DCF output on one page, drawn by the DcfSummary scene: one tile per point, in this order. Keep four points.
# Avoid "price assumes" / "turn it around" here: they are the next slide's cues.
- id: dcf-summary
  speaker: "Mi'kael"
  cues: [one page, whole dcf, dcf on one]
  layout: statement
  title: The DCF on one page.
  bullets:
    - text: "The assumptions"
      cue: assumptions
    - text: "The cash flows, in today's money"
      cue: worth today
    - text: "From enterprise value to one share"
      cue: one share
    - text: "The answer: {{model_dcf_summary | Upside | value}} above today's price"
      cue: the answer
  # Short on purpose: the dashboard carries the numbers, and the bridge has just said most of them.
  say: "So here is the whole DCF **on one page**: the assumptions, the cash flows worth today, and from enterprise value to one share. The answer: {{model_dcf_summary | Implied share price | value}} against {{model_dcf_summary | Share price | value}}, {{model_dcf_summary | Upside | value}} upside."
  sources: ["Team valuation model on Bloomberg FA, DES and consensus data; Google Finance; Damodaran (NYU)"]

- id: reverse-dcf
  speaker: "Mi'kael"
  cues: [turn it around, price assume, todays price assume, what does todays price]
  layout: split
  title: "Today's price assumes {{model_implied_growth | Growth per year | Priced in today}} growth a year"
  chartFirst: true
  bullets:
    - { zoom: Priced in today, cue: assume }
    - { zoom: "Base case (consensus, then slowing)", cue: consensus }
    - text: The market is pricing in far less growth than analysts expect
      cue: market prices
    - { zoom: all }
  chart: { type: bar, datasetKey: model_implied_growth, series: [Growth per year], highlight: Priced in today }
  say: "Now turn it around: what does today's price assume? Revenue growth of only {{model_implied_growth | Growth per year | Priced in today}} a year for five years. Our base case, on consensus, is {{model_implied_growth | Growth per year | Base case (consensus, then slowing)}}. The market prices in far less growth than analysts expect. That gap is our margin of safety. Panshul."

