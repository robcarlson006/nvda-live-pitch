  say: "Now we add it up. The next five years of cash, discounted at the industry rate, are worth {{model_dcf_summary | PV of FCFs | value}} today. Everything after 2032, the terminal value, is worth {{model_dcf_summary | PV of terminal value | value}}: about three quarters of the total. Together that is the enterprise value, {{model_dcf_summary | Enterprise value | value}}. NVIDIA has no net debt: it holds more cash than debt, {{model_dcf_inputs | Net cash | value}}, so that is added, for {{model_dcf_summary | Equity value | value}} of equity. Then we divide by the {{model_dcf_inputs | Diluted shares | value}} diluted shares, and get {{model_three_rates | Value per share | 10.55% industry (Damodaran)}} a share, against a share price of {{model_dcf_inputs | Share price | value}}."

