# The scripted spine: the slides in order, and the phrases that trigger them.
# Speakers (25 Nov, three equal parts): Rob, the story (founding → supply); Mi'kael, the numbers (catch-up → reverse DCF); Panshul, the downside cases, the future, responsibility, the recommendation and the close. Each part of the deck opens with a title card (Effects.tsx SECTIONS).
# See docs/script/TIMING.md for the current speaking-time estimate.
# A timed room rehearsal is still required before claiming a sub-nine-minute run.
#
# How it works on the day
#   - When the mic hears any phrase in `cues`, that slide starts building.
#   - Bullets and charts build one after another. A bullet or chart with its own `cue` waits until
#     that phrase is heard, so it lands exactly as you say it. Pressing Next does the same thing.
#   - Only the next element and the next two slides are listened for, so a stray phrase can't jump the deck.
#   - `optional: true` slides can be switched off on the operator panel; the deck then skips them.
#
# Zooming into a chart
#   - An item `{ zoom: <x value>, cue: ... }` in `bullets` zooms the chart onto that bar or point when the cue is
#     heard, and makes it the highlight. `{ zoom: all }` zooms back out. A zoom without a cue happens together
#     with the item before it.
#   - The chart builds right after the last text bullet, or straight after the title with `chartFirst: true`
#     (use that when you talk about the chart before the points). Zooms must come after the chart.
#
# Writing good cues
#   - 2–5 distinctive words you will definitely say, e.g. "announced cuda". Avoid common words alone.
#   - Give 3+ alternatives per slide: speech-to-text writes "CUDA" as "cooda", "1993" as digits, etc.
#   - Numbers: write them as words AND digits ("nineteen ninety three", "1993"); speech-to-text varies.
#   - Avoid apostrophes in cues ("dennys" as well as "denny's").
#
# Data rules
#   - Charts and big numbers name a dataset in data/clean/. The numbers are always looked up, never typed.
#   - A figure inside a title or bullet is written {{dataset | series | x}} and looked up too. The server refuses
#     any other digits in slide text, except years, dates, FY/Q labels, Scope 1/2/3 and product names.
#   - `say` is the script for the operator screen. It supports *italics*, **bold**, and the same data references.

# ---------------- Rob: the why ----------------

- id: founding
  speaker: Rob
  cues: ["1993", nineteen ninety three, three engineers, dennys, denny, booth, san jose]
  layout: statement
  title: "1993. A booth at Denny's."
  bullets:
    - text: Workstation 3D graphics, on every PC
      cue: their idea
    - text: Paid for by video games
      cue: paid
  say: "In 1993, three engineers sat down in a booth at a Denny's in San Jose. Their idea: bring workstation 3D graphics to every PC, and have it paid for by video games. People told them nobody starts a serious company to play games."
  sources: [NVIDIA company history (Wikipedia; Sequoia Capital)]

- id: first-gpu
  speaker: Rob
  cues: [six years later, "1999", nineteen ninety nine, geforce, g force, first gpu]
  layout: statement
  title: "1999: the world's first GPU."
  bullets:
    - text: A successful gaming company. They could have stopped there.
      cue: they could
  say: "Six years later, in 1999, they launched the GeForce 256 and called it the world's first GPU. A successful gaming company. They could have stopped there."
  sources: [GeForce 256 launch, 1999; Forbes, 3 January 2008]

# The cores: a handful light one by one, then thousands at once
- id: cuda
  speaker: Rob
  effect: cpu-gpu
  cues: [instead, announced cuda, cuda, cooda, november 2006, "2006", two thousand and six]
  layout: statement
  title: "2006: CUDA."
  bullets:
    - text: "A normal processor: a handful of fast workers, one job after another"
      cue: normal
    - text: "A graphics chip: thousands of workers, all at the same time"
      cue: graphics
    - text: CUDA lets anyone put those workers to work
      cue: cuda let
    - text: Given away free, and built into every gaming card
      cue: gave
  say: "Instead, in November 2006, they announced CUDA. A normal processor is a handful of very fast workers, doing one job after another. A graphics chip is thousands of smaller workers, all working at once. CUDA let anyone put those workers to work. And NVIDIA gave it away free, built into every gaming card."
  sources: [NVIDIA, SC06, November 2006; Ian Buck, Brook for GPUs (Stanford)]

- id: wall-street
  speaker: Rob
  cues: [wall street, hated it, street hated]
  layout: split
  title: Wall Street hated it.
  bullets:
    - text: The stock more than halved in 2008
      cue: more than halved
    - text: NVIDIA held on anyway.
      cue: held on
  chart: { type: bar, datasetKey: nvda_revenue_annual, series: [Revenue], range: [FY05, FY13], highlight: FY13 }
  say: "Wall Street hated it. The stock more than halved in 2008. NVIDIA held on anyway."
  sources: [NVIDIA Bloomberg FA annual FY05–FY13; 2008 historical share price, research notes]

- id: alexnet
  speaker: Rob
  cues: ["2012", twenty twelve, two thousand and twelve, toronto, imagenet, image net, alexnet, alex net, student team]
  layout: split
  title: Then AI found CUDA.
  bullets:
    - text: "2012: AlexNet, trained on NVIDIA gaming cards, wins ImageNet by a mile"
      cue: toronto
  chart: { type: bar, datasetKey: research_alexnet, series: [Top-5 error], highlight: "AlexNet, on NVIDIA GPUs" }
  chartCue: gaming
  say: "Then, in 2012, a student team from Toronto entered ImageNet, the biggest image-recognition contest, with AlexNet, trained on two NVIDIA gaming cards. It won by a mile: about 15 percent error, against 26 for the next best. AI had found CUDA."

- id: revenue-long
  speaker: Rob
  optional: true
  cues: [that bet, what the bet did, twenty seven years, "27 years", years of revenue]
  layout: chart
  title: What the bet did.
  chart: { type: bar, datasetKey: nvda_revenue_annual, series: [Revenue], highlight: FY26 }
  say: "Here's what that bet did: twenty-seven years of revenue. Flat for more than a decade, while NVIDIA kept paying for CUDA. And then this."

- id: four-layers
  speaker: Rob
  cues: [gold standard, four layers, why is nvidia]
  layout: statement
  title: Why NVIDIA is the gold standard.
  bullets:
    - text: Chips. Software. Connections. Supply.
      cue: four layers
    - text: A competitor has to beat all of them, at once.
      cue: rival
  say: "So why is NVIDIA the gold standard? It leads in four layers: chips, software, connections and supply. A rival has to beat all of them, at once."

- id: chips
  speaker: Rob
  cues: [one chips, first chips, tensor cores, tensor, "2017"]
  layout: split
  title: "One: chips. Built for AI, not just fast."
  bullets:
    - text: "Tensor Cores, added in 2017, are circuits built for the maths of AI"
      cue: tensor
    - text: A new chip generation every year, so rivals are always aiming at last year's chip
      cue: generation
    - text: "In data centres, NVIDIA makes {{peers_datacenter_revenue | Multiple of AMD | NVIDIA}} what AMD makes"
      cue: amd makes
  chart: { type: bar, datasetKey: peers_datacenter_revenue, series: [Data centre revenue], highlight: NVIDIA }
  chartCue: dollars a year
  say: "One: chips. In 2017 NVIDIA added Tensor Cores: circuits built for the maths of AI. It brings out a new chip generation every year, so rivals are always aiming at last year's chip. In data centres, NVIDIA makes {{peers_datacenter_revenue | Multiple of AMD | NVIDIA}} what AMD makes, measured in billions of dollars a year."

# The cores: one core lights, a ripple spreads across the block, then it locks in
- id: software
  speaker: Rob
  effect: spread
  cues: [two software, second software, six million, developers, hard to beat]
  layout: statement
  title: "Two: software. Why CUDA is so hard to beat."
  bullets:
    - text: "{{research_facts | CUDA developers | value}} developers write code for CUDA"
      cue: six million
    - text: "More than {{research_facts | CUDA-X libraries | value}} free libraries, refined since 2007"
      cue: thousand
    - text: To switch, a company must rewrite its code and retrain its engineers
      cue: switching
    - text: "AMD's answer, ROCm, arrived in 2016: nine years behind"
      cue: answer
  say: "Two: software, and why CUDA is so hard to beat. About six million developers write code for CUDA, using more than a thousand free libraries. Switching to a rival means rewriting that code and retraining engineers. AMD's answer, ROCm, arrived in 2016: nine years behind. A rival can copy a chip. It can't copy twenty years of software."

# The cores: clusters merge into one block
- id: connections
  speaker: Rob
  effect: merge72
  cues: [three connections, third connections, nvlink, nv link, mellanox]
  layout: statement
  title: "Three: connections."
  bullets:
    - text: "NVLink: {{research_facts | GPUs per NVL72 rack | value}} chips in a rack act as one giant chip"
      cue: joins
    - text: "2019: NVIDIA agrees to buy Mellanox for about {{research_facts | Mellanox price | value}}"
      cue: agreed
  say: "Three: connections. NVLink joins {{research_facts | GPUs per NVL72 rack | value}} chips in one rack, so they act as one giant chip. In 2019, NVIDIA agreed to buy Mellanox, which links whole racks together, for about {{research_facts | Mellanox price | value}}."

- id: supply
  speaker: Rob
  cues: [four supply, for supply, fourth supply, tsmc, taiwan, designs the chips]
  layout: split
  title: "Four: supply."
  bullets:
    - text: "NVIDIA designs the chips; TSMC in Taiwan manufactures them, and makes about {{research_facts | TSMC share of leading-edge chips | value}} of the world's most advanced chips"
      cue: designs the chips
    - text: The bottleneck is packaging, and NVIDIA has booked most of it
      cue: booked
  chart: { type: bar, datasetKey: research_cowos_share, series: [Share of CoWoS], highlight: NVIDIA }
  say: "Four: supply. NVIDIA designs the chips; TSMC in Taiwan makes them, and TSMC makes about {{research_facts | TSMC share of leading-edge chips | value}} of the world's most advanced chips. The real bottleneck is packaging, and NVIDIA has booked around {{research_cowos_share | Share of CoWoS | NVIDIA}} of it. So even a rival with a better design still needs a factory that is already full. Mi'kael."

- id: catch-up
  speaker: "Mi'kael"
  cues: [caught up, catch up, has anyone, google came closest, came closest]
  layout: statement
  title: Has anyone caught up?
  bullets:
    - text: Google came closest, with its own chips since 2015 and tens of billions spent
      cue: google
    - text: Amazon, Microsoft and Meta are trying too, and still buy NVIDIA
      cue: amazon
  say: "Has anyone caught up? Google came closest: it has built its own chips since 2015 and spent tens of billions. Amazon, Microsoft and Meta are trying too, and they all still buy NVIDIA."

- id: handoff
  speaker: "Mi'kael"
  cues: [all four layers, leads in all four, do the numbers, numbers agree]
  layout: statement
  title: The best chips, software, connections and supply.
  bullets:
    - text: Do the numbers agree?
      cue: numbers agree
  say: "So NVIDIA leads in all four layers. Do the numbers agree?"

