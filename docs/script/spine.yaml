      cue: their idea
    - text: Paid for by video games
      cue: paid
  say: "In 1993, three engineers sat down in a booth at a Denny's in San Jose. Their idea: bring workstation 3D graphics to every PC, and have it paid for by video games. People told them nobody starts a serious company to play games."
  sources: [NVIDIA company history (Wikipedia; Sequoia Capital)]

- id: first-gpu
  speaker: Rob
  cues: ["1999", nineteen ninety nine, geforce 256, geforce, g force]
  layout: statement
  title: "1999: the world's first GPU."
  bullets:
