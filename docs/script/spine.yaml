  chart:
    type: bar
    display: table
    datasetKey: model_dcf_detail
    series: [FY28, FY29, FY30, FY31, FY32]
    highlight: Present value of cash flow
  say: "Here is the five-year DCF worksheet: each year's revenue, times NVIDIA's cash margin, gives free cash flow. A dollar in 2032 is worth less than a dollar today, so we discount it. The bottom row is what each year's cash is worth now."

