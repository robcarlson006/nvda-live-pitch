  speaker: Rob
  effect: merge72
  cues: [three connections, 3 connections, connections nvidia, nvlink wires, nv link wires]
  layout: statement
  title: "Three: connections."
  bullets:
    - text: "NVLink: {{research_facts | GPUs per NVL72 rack | value}} chips in a rack act as one giant chip"
      cue: joins
    - text: "2019: NVIDIA agrees to buy Mellanox for about {{research_facts | Mellanox price | value}}"
      cue: agreed
    - text: "Last year that networking business made {{research_facts_unverified | Networking revenue FY26 | value}}. In one year."
      cue: networking
  say: "Three: connections. NVLink joins {{research_facts | GPUs per NVL72 rack | value}} chips in one rack, so they act as one giant chip. In 2019, NVIDIA agreed to buy Mellanox, which links whole racks together, for about {{research_facts | Mellanox price | value}}. Last year that networking business made {{research_facts_unverified | Networking revenue FY26 | value}}. In one year."

- id: supply
  speaker: Rob
  cues: [four supply, 4 supply, for supply]
  layout: split
  title: "Four: supply."
  bullets:
    - text: "NVIDIA designs the chips; TSMC in Taiwan manufactures them, and makes about {{research_facts | TSMC share of leading-edge chips | value}} of the world's most advanced chips"
      cue: designs the chips
    - text: The bottleneck is packaging, and NVIDIA has booked most of it
      cue: booked
  chart: { type: bar, datasetKey: research_cowos_share, series: [Share of CoWoS], highlight: NVIDIA }
  say: "Four: supply. NVIDIA designs the chips; it doesn't make them. TSMC in Taiwan manufactures them, and TSMC makes about {{research_facts | TSMC share of leading-edge chips | value}} of the world's most advanced chips. The real bottleneck is packaging, joining each chip to its memory, and NVIDIA has booked around {{research_cowos_share | Share of CoWoS | NVIDIA}} of it. So even a rival with a better design still needs a factory that is already full."

