# Beat 9. Chips
- id: chips
  speaker: Rob
  cues: [one chips, 1 chips, on paper amd, amds latest chip]
  layout: split
  title: "One: chips. Built for AI, not just fast."
  bullets:
    - text: "Tensor Cores, added in 2017, are circuits built for the maths of AI, and they get faster every generation"
      cue: tensor cores
    - text: A new chip generation every year, so rivals are always aiming at last year's chip
      cue: every year
    - text: "On paper AMD wins: {{research_facts | AMD MI355X memory | value}} of memory against {{research_facts | NVIDIA B200 memory | value}}. But NVIDIA sells the whole rack: chips, links and network designed as one"
      cue: gigabytes
    - text: "In data centres, NVIDIA makes {{peers_datacenter_revenue | Multiple of AMD | NVIDIA}} what AMD makes"
      cue: every dollar
  chart: { type: bar, datasetKey: peers_datacenter_revenue, series: [Data centre revenue], highlight: NVIDIA }
  chartCue: billion against
  say: "One: chips. So what makes NVIDIA's chips the best? Three things. First, they are built for AI. Since 2017 NVIDIA has put Tensor Cores on its chips, circuits designed for exactly the maths that AI uses, and each generation makes them faster. Second, the pace. NVIDIA now brings out a new generation every year, so a rival is always aiming at last year's chip. Third, NVIDIA doesn't sell a chip, it sells the whole machine: the processors, the wires between them and the network, designed together as one system. Which is why, on paper, AMD's latest chip beats NVIDIA's main one, with 288 gigabytes of memory against 192, and it's cheaper. Yet for every dollar AMD makes from data centres, NVIDIA makes about twelve. Last year that was about 194 billion dollars against 17. A chip is only as good as the software that runs on it."

# Beat 10. Software (the cores: one core lights, a ripple spreads across the block, then it locks in)
- id: software
  speaker: Rob
  effect: spread
  cues: [two software, 2 software, iphone versus android, iphone vs android]
  layout: statement
  title: "Two: software. Why CUDA is so hard to beat."
  bullets:
    - text: "{{research_facts | CUDA developers | value}} developers write code for CUDA, and the big AI tools are built for it first"
      cue: developers
    - text: "More than {{research_facts | CUDA-X libraries | value}} free libraries, refined since 2007, so the hard work is already done"
      cue: libraries
    - text: To switch, a company must rewrite its code, retrain its engineers and trust a newer tool
      cue: to switch
    - text: "AMD's answer, ROCm, arrived in 2016: nine years behind"
      cue: years behind
  say: "Two: software. This is the real moat. Think iPhone versus Android: NVIDIA builds the hardware and the software together, so it just works. More than six million developers write code for CUDA, and the major AI tools are built for it first. It comes with over a thousand free libraries, refined for nearly twenty years, so a company doesn't start from zero, it starts from everything already built. That's why it's so hard to catch up. To switch, a company has to rewrite its code, retrain its engineers and trust a newer, less tested tool, while its rivals keep moving. AMD's answer, ROCm, launched in 2016, nine years behind. A rival can copy a chip. It is much harder to copy twenty years of other people's work."

# Beat 11. Connections (the cores: clusters merge into one block)
- id: connections
  speaker: Rob
  effect: merge72
  cues: [three connections, 3 connections, connections nvidia, nvlink wires, nv link wires]
  layout: statement
  title: "Three: connections."
  bullets:
    - text: "NVLink: {{research_facts | GPUs per NVL72 rack | value}} chips in a rack act as one giant chip"
      cue: single rack
    - text: "2019: NVIDIA buys Mellanox for about {{research_facts | Mellanox price | value}}"
      cue: agreed to buy
    - text: "Last year that networking business made {{research_facts_unverified | Networking revenue FY26 | value}}. In one year."
