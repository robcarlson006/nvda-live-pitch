# The scripted spine, script v4 (23 Nov 2026): 22 slides, each drawn by a hand-built scene in app/src/stage/scenes.
# Order: Rob (the why) → Panshul (the numbers) → Mi'kael (why spending won't stop, ESG, the close).
# Source of truth for wording and order: docs/script/pitch-script-v4.md. `say` is the spoken text, verbatim.
#
# How it works on the day
#   - When the mic hears any phrase in `cues`, that slide starts building.
#   - A slide's beats are its title (beat 1), then one beat per bullet. A bullet with its own `cue` waits until that phrase
#     is heard; a bullet without one builds straight after the one before. Space / → builds the next beat. Backspace / ← un-builds one.
#   - On a `scene` slide the bullets are the labels of its beats (or its text, for text slides). The picture is drawn by the scene,
#     from data/clean, never from the words here.
#   - Only the next element and the next two slides are listened for, so a stray phrase can't jump the deck.
#
# Writing good cues: 2–5 distinctive words you will definitely say. Numbers as words AND digits (speech-to-text varies).
# Data rules: figures in text are written {{dataset | series | x}} and looked up. The server refuses any other digits
# except years, dates, FY/Q labels, Scope 1/2/3 and product names. `scene` slides draw their numbers from data/clean.

# ---------------- Rob: the why ----------------

- id: hook
  speaker: Rob
  scene: hook
  layout: statement
  cues: [here is our answer first, answer first nvidia, hardest position in ai to copy]
  title: "NVIDIA: the hardest position in AI to copy."
  say: "Here is our answer first. NVIDIA holds the hardest position in AI to copy, and today's share price sits at the low end of what we think it is worth. We'll show you how low, and what could prove us wrong. One thing: watch the screen. We'll explain it at the end."

- id: founding
  speaker: Rob
  scene: founding
  layout: statement
  cues: [it starts in 1993, in a denny's in san jose, denny's in san jose, dennys in san jose]
  title: "1993. A Denny's in San Jose."
  bullets:
    - text: Graphics on every PC. Video games pay for it.
      cue: video games would pay
  say: "It starts in 1993, in a Denny's in San Jose. Jensen Huang, Chris Malachowsky and Curtis Priem wanted to put workstation graphics in every PC, and video games would pay for it. People told them nobody starts a company to play games."

- id: first-gpu
  speaker: Rob
  scene: first-chip
  layout: statement
  cues: [their first chip failed, first chip failed, two hundred and fifty thousand made]
  title: Their first chip failed.
  bullets:
    - text: "1999|NVIDIA called it the world's first GPU."
      cue: six years later
  say: "Their first chip failed. Of two hundred and fifty thousand made, two hundred and forty-nine thousand came back. Six years later, in 1999, they launched the GeForce 256 and called it the world's first GPU. They had invented the graphics processing unit."
  sources: [GeForce 256 launched 11 October 1999; NVIDIA's own marketing called it the world's first GPU]

- id: cuda
  speaker: Rob
  scene: revenue-line
  layout: statement
  cues: [in november 2006, november 2006 they made a bet, november two thousand and six]
  title: November 2006. CUDA.
  bullets:
    - text: Revenue line draws, FY07 to FY16
      cue: the year cuda launched
  say: "Then, in November 2006, they made a bet that looked like a mistake. A normal processor is a few fast workers doing one job after another. A graphics chip is thousands of slower workers doing the same job at once. CUDA, NVIDIA's software, let anyone program those thousands of workers. NVIDIA gave it away inside every card, which made every chip dearer for gamers who never asked for it. The year CUDA launched, revenue was three billion dollars. Nine years later it was five."

- id: alexnet
  speaker: Rob
  scene: revenue-line
  layout: statement
  cues: [in 2012 a student in toronto, a student in toronto, twenty twelve a student]
  title: "2012: the image-recognition contest."
  bullets:
    - text: Contest error rates appear
      cue: his error rate
    - text: Revenue line continues to FY26
      cue: revenue went from five billion
  say: "In 2012 a student in Toronto trained a neural network on two NVIDIA gaming cards and entered an image-recognition contest. His error rate was fifteen percent. The runner-up's was twenty-six. Anyone who wanted to copy him needed CUDA. Revenue went from five billion dollars in 2016 to two hundred and sixteen billion last year."

- id: twenty-years
  speaker: Rob
  scene: twenty-years
  layout: statement
  cues: [that is the moat, the moat and it is twenty years deep, twenty years deep]
  title: years of CUDA
  bullets:
    - text: Libraries and developers
      cue: over a thousand libraries
  say: "That is the moat, and it is twenty years deep. CUDA is twenty years old this month. It has over a thousand libraries built on it and six million developers writing for it. A rival can copy a chip. It cannot copy twenty years of software."

- id: four-layers
  speaker: Rob
  scene: four-layers
  layout: statement
  cues: [and the software sits, the software sits on]
  title: A rival has to match all of it at once.
  bullets:
    - text: Software
      cue: best of everything else
    - text: Chips
      cue: data centre sales twelve times
    - text: Networking
      cue: seventy two chips wired
    - text: Supply
      cue: sixty percent of tsmc
  say: "And the software sits on the best of everything else: data-centre sales twelve times AMD's, seventy-two chips wired into one machine, and about sixty percent of TSMC's advanced packaging booked. A rival has to match all of it at once."

- id: chip-share
  speaker: Rob
  scene: chip-share
  layout: statement
  cues: [only one company has come close, one company has come close google]
  title: Share of AI chip supply, Q4 2025
  bullets:
    - text: Google
      cue: has nineteen percent
    - text: NVIDIA
      cue: nvidia has sixty eight
  say: "Only one company has come close: Google. It started building its own AI chip in 2015, over a decade ago, with all of Google's cash. Even so, Google has nineteen percent of AI chip supply and NVIDIA has sixty-eight. Almost nobody has the cash or the years."

- id: do-numbers-agree
  speaker: Rob
  scene: question
  layout: statement
  cues: [that's the why, thats the why, show you whether the numbers agree]
  title: Do the numbers agree?
  say: "That's the why. Panshul will show you whether the numbers agree, and what you'd pay for it."

# ---------------- Panshul: the numbers ----------------

- id: revenue
  speaker: Panshul
  scene: revenue-recent
  layout: statement
  cues: [four years ago nvidia sold, twenty seven billion dollars, eight times as much]
  title: Revenue, FY22 to FY26
  bullets:
    - text: Data Center shaded
      cue: ninety percent of that is data center
  say: "Do the numbers agree? Yes. Four years ago NVIDIA sold twenty-seven billion dollars. Last year it sold two hundred and sixteen: eight times as much. Ninety percent of that is Data Center. In the latest quarter alone, Data Center sold a hundred and eight billion dollars, four times the whole company's sales in 2023."

- id: margins
  speaker: Panshul
  scene: margins
  layout: statement
  cues: [nvidia keeps sixty cents, sixty cents of profit]
  title: What each company keeps from a dollar of sales
  bullets:
    - text: Operating margin bars
    - text: Free cash flow
      cue: ninety seven billion dollars of free cash
  say: "NVIDIA keeps sixty cents of profit from every dollar of sales. Analysts expect AMD to keep twenty-nine and Intel fifteen. Last year that left NVIDIA with ninety-seven billion dollars of free cash."

- id: forecast
  speaker: Panshul
  scene: forecast
  layout: statement
  cues: [analysts expect sales of four hundred and twenty two billion, four hundred and twenty two billion this year]
  title: What analysts expect
  bullets:
    - text: FY27 consensus revenue
    - text: FY28 consensus revenue
      cue: seven hundred and twenty nine billion
    - text: Last quarter, against forecast
      cue: last quarter nvidia reported
  say: "Analysts expect sales of four hundred and twenty-two billion this year, up ninety-six percent, and seven hundred and twenty-nine billion next year, up seventy-three. Last quarter NVIDIA reported a hundred and sixteen billion against a hundred and nine forecast."

- id: worth
  speaker: Panshul
  scene: worth
  layout: statement
  cues: [what is one share worth, one share worth]
  title: What is one share worth?
  bullets:
    - text: Bloomberg's rate
      cue: bloomberg's is nineteen percent
    - text: US semiconductor average
      cue: average for american semiconductor
  say: "So what is one share worth? We built a discounted cash flow. We forecast the cash NVIDIA will make over five years, add everything after that, and shrink it all back into today's money at the return investors demand. We show two rates. Bloomberg's is nineteen percent, a very high bar. The second is the average for American semiconductor companies, which is ten and a half."

- id: value-bars
  speaker: Panshul
  scene: value-bars
  layout: statement
  cues: [at bloomberg's rate our base case, our base case is a hundred and sixty seven]
  title: What one share is worth
  bullets:
    - text: Base case
    - text: Today's price
      cue: today's price is a hundred and sixty four
    - text: Base case at the industry rate
      cue: at the industry rate the same cash
    - text: Bull case
      cue: low end of our range
    - text: Bear case
  say: "At Bloomberg's rate our base case is a hundred and sixty-seven dollars fifty. Today's price is a hundred and sixty-four. At the industry rate the same cash is worth three hundred and ninety-one dollars, more than double. So today's price is the low end of our range. It only looks fair if you demand Bloomberg's very high return."

- id: implied
  speaker: Panshul
  scene: implied
  layout: statement
  cues: [turn it around, at bloomberg's rate today's price already assumes]
  title: What today's price already assumes
  bullets:
    - text: Sales by 2032
      cue: that is about two trillion
  say: "Turn it around. At Bloomberg's rate, today's price already assumes sales grow thirty-eight percent a year for five years. That is about two trillion dollars of sales in 2032."

- id: bear-bars
  speaker: Panshul
  scene: bear
  layout: statement
  cues: [now the risk from us first, the risk from us first]
  title: The risk, from us first.
  bullets:
    - text: Bear case at Bloomberg's rate
      cue: our bear case is thirty one dollars
    - text: Bear case at the industry rate
      cue: sixty four dollars at the industry rate
  say: "Now the risk, from us first. Everything here depends on AI spending continuing. If it pauses, our bear case is thirty-one dollars at Bloomberg's rate, eighty-one percent below today, and sixty-four dollars at the industry rate, sixty-one percent below. That is the downside, and we are showing it to you. Mi'kael will tell you why we think it is very unlikely."

# ---------------- Mi'kael: why spending won't stop, ESG, the close ----------------

- id: bear-alone
  speaker: "Mi'kael"
  scene: bear
  layout: statement
  cues: [as panshul said, if ai spending slows, a share is worth thirty one dollars]
  title: If AI spending slows
  bullets:
    - text: The one number
      cue: so the question is whether it slows
  say: "As Panshul said, if AI spending slows, a share is worth thirty-one dollars. So the question is whether it slows. We think it is very unlikely, for two reasons."

- id: discovering
  speaker: "Mi'kael"
  scene: discovering
  layout: statement
  cues: [the first reason is what the spending buys, what the spending buys, reason one]
  title: "Reason one: it is discovering things."
  bullets:
    - text: Gold-medal level at the International Mathematical Olympiad, 2025
      cue: international mathematical olympiad
    - text: "AlphaEvolve: {{research_discoveries | AlphaEvolve open problems tried | value}} open maths problems. Best known answer matched on {{research_discoveries | AlphaEvolve matched best known | value}}, beaten on {{research_discoveries | AlphaEvolve improved on best known | value}}."
      cue: alphaevolve was given
    - text: "{{research_discoveries | Protein structures known before | value}} protein structures known. Then {{research_discoveries | Protein structures predicted by AI | value}}, and the 2024 Nobel Prize in Chemistry."
      cue: protein structures
    - text: "A new antibiotic found in {{research_discoveries | New antibiotic found in days | value}}, for drug-resistant bacteria"
      cue: found a new antibiotic
    - text: "Swedish breast screening: +{{research_facts | Sweden: more cancers found | value}} cancers found, {{research_facts | Sweden: less reading work | value}} less reading work"
      cue: in sweden
  say: "The first reason is what the spending buys. Start with maths, the purest test of thinking there is. In 2025, AI systems from Google DeepMind and OpenAI reached gold-medal level at the International Mathematical Olympiad. Google's AlphaEvolve was given fifty open maths problems. It matched the best known answer on three-quarters of them, and beat it on one in five. It reaches past maths. For sixty years, scientists mapped about a hundred and seventy thousand protein structures. In 2022, AI predicted around two hundred million, nearly every known protein, and won the 2024 Nobel Prize in Chemistry. In 2019, AI found a new antibiotic that works on drug-resistant bacteria in three days. In Sweden, AI breast screening found at least twenty percent more cancers and cut doctors' reading work by forty-four percent."
  sources: [All figures on this slide are marked VERIFY in script v4 and are not yet checked against primary sources]

- id: ai-race
  speaker: "Mi'kael"
  scene: race
  layout: statement
  cues: [the second reason is that no government can afford to stop, no government can afford to stop, reason two]
  title: "Reason two: the AI race."
  bullets:
    - text: "United States|“To remain the leading economic and military power, the United States must win the AI race.” David Sacks, White House AI adviser, July 2025"
      cue: white house published its ai action plan
    - text: "China|President Xi told the Politburo in April 2025 that China must be self-reliant in AI and close the gap with the United States."
      cue: president xi told china's politburo
    - text: "Neither can stop.|Whoever stops loses."
      cue: neither can stop
  say: "The second reason is that no government can afford to stop. In July 2025 the White House published its AI Action Plan. Its own AI adviser wrote that to remain the leading economic and military power, the United States must win the AI race. In April 2025 President Xi told China's Politburo that China must be self-reliant in AI and close the gap with the United States. And Vladimir Putin has said that whoever leads in AI will become the ruler of the world. Each side thinks the winner gets the economy and the military. So neither can stop, because whoever stops loses. And the chips they are racing on are NVIDIA's."
  sources: [White House, AI Action Plan press release, 23 July 2025 (David Sacks); Xi Jinping, Politburo study session, 25 April 2025 (Reuters, CSET). Quote and paraphrase marked VERIFY in script v4]

