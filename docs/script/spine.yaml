# The cores: one core lights, a ripple spreads across the block, then it locks in
- id: software
  speaker: Rob
  effect: spread
  cues: [two software, 2 software, iphone versus android, iphone vs android]
  layout: statement
  title: "Two: software. Why CUDA is so hard to beat."
  bullets:
    - text: "{{research_facts | CUDA developers | value}} developers write code for CUDA"
      cue: six million
    - text: "More than {{research_facts | CUDA-X libraries | value}} free libraries, refined since 2007"
      cue: thousand
    - text: To switch, a company must rewrite its code and retrain its engineers
      cue: switching
    - text: "AMD's answer, ROCm, arrived in 2016: nine years behind"
      cue: answer
  say: "Two: software, and why CUDA is so hard to beat. About six million developers write code for CUDA. They use more than a thousand free libraries, refined since 2007. Switching to a rival means rewriting that code and retraining your engineers. AMD's answer, ROCm, arrived in 2016: nine years behind. A rival can copy a chip. It can't copy twenty years of software."

# The cores: clusters merge into one block
