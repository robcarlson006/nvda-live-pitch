# ---- The DCF, one step at a time (v2, 24 Nov 2026). Every figure is from data/clean/model_*.json. ----
# The credibility moment: every input, grouped by where it comes from. Each input lights green as it is said.
- id: dcf-inputs
  speaker: "Mi'kael"
  cues: [share worth, one share worth, every input, inputs, where our numbers]
  layout: inputs
  title: What goes into our valuation?
  groups:
    - tag: Bloomberg
      items:
        - text: "FY26 revenue: {{model_dcf_inputs | FY26 revenue | value}}"
          cue: bloomberg
        - text: "Analyst consensus: {{model_dcf_inputs | FY27 revenue, analyst consensus | value}} in FY27, {{model_dcf_inputs | FY28 revenue, analyst consensus | value}} in FY28"
        - text: "Free-cash-flow margin: {{model_dcf_inputs | Free-cash-flow margin, FY24–26 average | value}}, the FY24 to FY26 average"
        - text: "Diluted shares: {{model_dcf_inputs | Diluted shares | value}}. Net cash: {{model_dcf_inputs | Net cash | value}}"
        - text: "WACC, Q3 2026: {{model_dcf_inputs | WACC, Bloomberg | value}}"
    - tag: Google Finance
      items:
        - text: "Reference price: {{model_dcf_inputs | Share price | value}}; quote date in summary"
          cue: google
        - text: "WACC: {{model_dcf_inputs | WACC, Google Finance | value}}"
    - tag: Damodaran (NYU)
      items:
        - text: "US chip-industry average WACC, January 2026: {{model_dcf_inputs | WACC, US semiconductor industry average | value}}"
          cue: damodaran
    - tag: Our two choices
      items:
        - text: "Long-run growth after FY32: {{model_dcf_inputs | Terminal growth (our choice) | value}} a year"
          cue: our two
        - text: "Growth fades in a straight line to {{model_dcf_inputs | Terminal growth (our choice) | value}} by FY32"
          cue: fading
  say: "So what is one share worth? Every input on this slide comes from Bloomberg, Google Finance or Damodaran at NYU. Our two choices: {{model_dcf_inputs | Terminal growth (our choice) | value}} long-run growth after 2032, and growth fading to it in a straight line."

