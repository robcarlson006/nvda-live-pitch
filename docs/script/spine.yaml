# Beat 16b. If it is a bubble, and it pops
- id: if-it-pops
  speaker: Rob
  cues: [if the bubble pops, the bubble pops, even if it pops, what if it pops]
  layout: statement
  title: And if the bubble does pop, NVIDIA is built to survive it.
  bullets:
    - text: The dot-com crash wiped out companies built on ideas. The ones selling something people truly needed survived.
      cue: wiped out
    - text: NVIDIA owns both halves of AI, the hardware and the CUDA software every AI developer already builds on
      cue: both halves
    - text: When money gets tight, the weakest bets are cut first. The best platform is the last to lose customers.
      cue: cut first
    - text: "The share price would still fall. Our stress case, where AI spending stops, is {{model_valuation | Value per share | Stress case}}"
      cue: stress case
  say: "And what if it is a bubble, and it pops? Be honest: the share price would fall. But look at who survived 2000. The dot-com crash wiped out companies that were built on an idea. The ones selling something people truly needed, like Amazon, came through. NVIDIA owns both halves of what AI is built on: the hardware, and CUDA, the software every AI developer already writes for. If money gets tight, the weakest bets get cut first, and the best platform is the last to lose customers. Our stress case, where AI spending actually stops, is sixty-four dollars a share, a big fall. But that is still a company with the best chips, the best software and a lot of cash, not a company that disappears."

