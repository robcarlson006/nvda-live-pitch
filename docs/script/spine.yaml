          cue: fading
  say: "So what is one share worth? None of these figures are ours unless we say so. From Bloomberg: last year's revenue, the analyst consensus for the next two years, NVIDIA's cash margin averaged over three years, the diluted share count and net cash, and its own discount rate for Q3. From Google Finance: the reference share price, and a second discount rate. From Damodaran at NYU: the US chip-industry average rate. And our two choices: {{model_dcf_inputs | Terminal growth (our choice) | value}} long-run growth after 2032, with growth fading to it in a straight line."

