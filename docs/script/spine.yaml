# The scripted spine: the slides in order, and the phrases that trigger them.
# Running order: Rob (why) → Panshul (financials) → Mi'kael (ESG) → Rob (close).
#
# How it works on the day
#   - When the mic hears any phrase in `cues`, that slide starts building.
#   - Bullets and charts build one after another. A bullet or chart with its own `cue` waits until
#     that phrase is heard, so it lands exactly as you say it. Pressing Next does the same thing.
#   - Only the next element and the next two slides are listened for, so a stray phrase can't jump the deck.
#   - `optional: true` slides (the ✂ beats) can be switched off on the operator panel; the deck then skips them.
#
# Writing good cues
#   - 2–5 distinctive words you will definitely say, e.g. "announced cuda". Avoid common words alone.
#   - Give 3+ alternatives per slide: speech-to-text writes "CUDA" as "cooda", "1993" as digits, etc.
#   - Numbers: write them as words AND digits ("nineteen ninety three", "1993"); speech-to-text varies.
#   - Avoid apostrophes in cues ("dennys" as well as "denny's").
#
# Data rules
#   - Charts and big numbers name a dataset in data/clean/. The numbers are always looked up, never typed.
#   - A figure inside a title or bullet is written {{dataset | series | x}} and looked up too. The server refuses
#     any other digits in slide text, except years, dates, FY/Q labels, Scope 1/2/3 and product names.
#   - `say` is the script for the operator screen. It is never shown to the board.
#
# Rob's section (beats 1–21, 22–23): from docs/script/rob-why-script.md, draft 1, 21 Nov 2026. `say` is verbatim.

# ---------------- Rob: the why ----------------

# Beat 1. Cold open
- id: founding
  speaker: Rob
  cues: ["1993", nineteen ninety three, three engineers, booth at a denny's, booth at a dennys]
  layout: statement
  title: "1993. A booth at Denny's."
  bullets:
    - text: Workstation 3D graphics, on every PC
      cue: every pc
    - text: Paid for by video games
      cue: video games
  say: "In 1993, three engineers, Jensen Huang, Chris Malachowsky and Curtis Priem, sat in a booth at a Denny's in San Jose and drank a lot of coffee. Their idea was simple. The 3D graphics that lived on expensive workstations should be on every PC. And the way to pay for it was video games. People told them nobody starts a company to play games."
  sources: [NVIDIA company history (Wikipedia; Sequoia Capital)]

# Beat 2. Nearly going bust ✂
- id: near-bust
  speaker: Rob
  optional: true
  cues: [first chip the nv1, nv1, nv one, n v one, wrong technology]
  layout: number
  title: The NV1 bet on the wrong technology.
  stat: { datasetKey: research_facts, series: NV1 chips returned, x: value, label: "of {{research_facts | NV1 chips made | value}} NV1 chips came back" }
  bullets:
    - text: "Sega invested {{research_facts | Sega investment | value}} anyway"
      cue: sega invested
    - text: "RIVA 128, August 1997: {{research_facts | RIVA 128 sold in four months | value}} sold in four months"
      cue: bet the company
  say: "Their first chip, the NV1, bet on the wrong technology. Of 250,000 made, about 249,000 came back. NVIDIA had less than six months of cash. Their next chip, for Sega, was heading the same way, so they told Sega's CEO the truth. Sega invested five million dollars anyway. With about one month of payroll left, they bet the company on the RIVA 128. It launched in August 1997 and sold a million units in four months."

# Beat 3. The first GPU
- id: first-gpu
  speaker: Rob
  cues: ["1999", nineteen ninety nine, geforce 256, geforce, g force]
  layout: statement
  title: "1999: the world's first GPU."
  bullets:
