# Beat 6. The payoff
- id: alexnet
  speaker: Rob
  cues: [2009 a stanford team, stanford team, andrew ng, led by andrew]
  layout: split
  title: Then AI found CUDA.
  bullets:
    - text: "2009: Stanford trains neural networks up to {{research_facts | Stanford speed-up | value}} faster on CUDA"
      cue: times faster
    - text: "2012: AlexNet, trained on NVIDIA gaming cards, wins ImageNet by a mile"
      cue: university of toronto
  chart: { type: bar, datasetKey: research_alexnet, series: [Top-5 error], highlight: "AlexNet, on NVIDIA GPUs" }
  chartCue: error rate
  say: "In 2009, a Stanford team led by Andrew Ng showed that CUDA graphics cards could train neural networks up to 70 times faster. Then in 2012, a student at the University of Toronto, Alex Krizhevsky, entered an image-recognition contest with a neural network trained on two NVIDIA gaming cards. He won by more than ten points: an error rate of 15 percent against 26. Anyone who wanted to copy him needed CUDA. In 2016 NVIDIA declared the AI revolution, and Jensen personally delivered its first AI supercomputer to a small lab called OpenAI. By the time ChatGPT launched in 2022, CUDA had fifteen years of tools built on it. Modern AI was built on NVIDIA."

