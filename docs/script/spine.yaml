      cue: microsoft
    - text: "2007: Forbes company of the year"
      cue: forbes
    - text: A successful gaming company. They could have stopped there.
      cue: they could
  say: "Six years later, in 1999, they launched the GeForce 256 and called it the world's first GPU. In 2000, Microsoft chose NVIDIA for the first Xbox and paid {{research_facts | Xbox advance | value}} up front. In 2007, Forbes named it company of the year. A successful gaming company. They could have stopped there."
  sources: [GeForce 256 launch, 1999; Forbes, 3 January 2008]

# The cores: a handful light one by one, then thousands at once
- id: cuda
  speaker: Rob
  effect: cpu-gpu
  cues: [instead, announced cuda, announced cooda, announced kuda, november 2006, november two thousand and six]
  layout: statement
  title: "2006: CUDA."
  bullets:
    - text: "A normal processor: a handful of fast workers, one job after another"
      cue: normal
    - text: "A graphics chip: thousands of workers, all at the same time"
      cue: graphics
    - text: CUDA lets anyone put those workers to work
      cue: cuda let
    - text: Given away free, and built into every gaming card
      cue: gave
  say: "Instead, in November 2006, they announced CUDA. Think of a normal processor as a handful of very fast workers, doing one job after another. A graphics chip is thousands of smaller workers, all working at the same time. CUDA let anyone put those workers to work, not just game designers. And NVIDIA gave it away free, built into every gaming card it sold."
  sources: [NVIDIA, SC06, November 2006; Ian Buck, Brook for GPUs (Stanford)]

