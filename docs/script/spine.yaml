  say: "In 1993, three engineers sat in a booth at a Denny's in San Jose. Their idea: 3D graphics on every PC, paid for by video games. People told them nobody starts a company to play games."
  sources: [NVIDIA company history (Wikipedia; Sequoia Capital)]

- id: first-gpu
  speaker: Rob
  cues: ["1999", nineteen ninety nine, geforce 256, geforce, g force]
  layout: statement
  title: "1999: the world's first GPU."
  bullets:
