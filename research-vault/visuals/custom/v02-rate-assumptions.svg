<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">The base discount rate is a sector average</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Cost of capital used to discount NVIDIA cash flows · November 2026 model</text>
<text x="80" y="224" fill="#b3b9ad" font-size="21" font-weight="720" text-anchor="start">DISCOUNT RATE</text>
<text x="405" y="224" fill="#b3b9ad" font-size="21" font-weight="720" text-anchor="start">BASIS FOR THE RATE</text>
<text x="1013" y="224" fill="#b3b9ad" font-size="21" font-weight="720" text-anchor="start">HOW THE MODEL USES IT</text>
<rect x="80" y="250" width="1440" height="146" rx="12" fill="#192413" stroke="#76b900" stroke-width="2"/>
<text x="111" y="340" fill="#b7f04a" font-size="57" font-weight="800" text-anchor="start">10.55%</text>
<text x="405" y="310" fill="#f4f6f1" font-size="27" font-weight="700" text-anchor="start">US semiconductor industry average</text>
<text x="405" y="353" fill="#b3b9ad" font-size="23" font-weight="500" text-anchor="start">Damodaran · Jan 2026</text>
<text x="1013" y="310" fill="#f4f6f1" font-size="24" font-weight="550" text-anchor="start">Values NVIDIA using a sector-wide</text>
<text x="1013" y="346" fill="#f4f6f1" font-size="24" font-weight="550" text-anchor="start">cost of capital.</text>
<rect x="80" y="416" width="1440" height="146" rx="12" fill="#11160e" stroke="#303b2a" stroke-width="2"/>
<text x="111" y="506" fill="#f4f6f1" font-size="57" font-weight="800" text-anchor="start">14.45%</text>
<text x="405" y="476" fill="#f4f6f1" font-size="27" font-weight="700" text-anchor="start">NVIDIA input attributed to Google Finance</text>
<text x="405" y="519" fill="#b3b9ad" font-size="23" font-weight="500" text-anchor="start">Team model export · Nov 2026</text>
<text x="1013" y="476" fill="#f4f6f1" font-size="24" font-weight="550" text-anchor="start">Tests a higher company-specific rate</text>
<text x="1013" y="512" fill="#f4f6f1" font-size="24" font-weight="550" text-anchor="start">with the same operating assumptions.</text>
<rect x="80" y="582" width="1440" height="146" rx="12" fill="#11160e" stroke="#303b2a" stroke-width="2"/>
<text x="111" y="672" fill="#e8b04a" font-size="57" font-weight="800" text-anchor="start">15.4%</text>
<text x="405" y="642" fill="#f4f6f1" font-size="27" font-weight="700" text-anchor="start">Team sensitivity</text>
<text x="405" y="685" fill="#e8b04a" font-size="23" font-weight="500" text-anchor="start">Bloomberg attribution disputed</text>
<text x="1013" y="642" fill="#f4f6f1" font-size="24" font-weight="550" text-anchor="start">Applies the highest rate in this grid</text>
<text x="1013" y="678" fill="#f4f6f1" font-size="24" font-weight="550" text-anchor="start">to give future cash flows less weight.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Damodaran, Jan 2026 · Team DCF and input reconciliation, Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
