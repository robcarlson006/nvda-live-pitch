<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title subtitle" font-family="'Archivo', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="title">NVIDIA now includes stock pay in adjusted results</title><desc id="subtitle">Treatment of stock-based compensation and Q3 FY27 expense · USD millions</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/><rect width="10" height="900" fill="#76b900"/>
<text x="80" y="96" font-size="54" fill="#f4f6f1" font-weight="800" text-anchor="start">NVIDIA now includes stock pay in adjusted results</text>
<text x="80" y="151" font-size="28" fill="#aab2a5" font-weight="500" text-anchor="start">Treatment of stock-based compensation and Q3 FY27 expense · USD millions</text>
<rect x="80" y="244" width="670" height="406" rx="12" fill="#10150c" stroke="#34412c" stroke-width="2"/><rect x="782" y="244" width="738" height="406" rx="12" fill="#10150c" stroke="#34412c" stroke-width="2"/><text x="114" y="332" font-size="29" fill="#f4f6f1" font-weight="750" text-anchor="start">Q3 FY27 stock compensation expense</text><text x="114" y="472" font-size="104" fill="#b7f04a" font-weight="800" text-anchor="start">$2,088m</text><text x="114" y="555" font-size="26" fill="#aab2a5" font-weight="500" text-anchor="start">Reported quarterly expense</text><text x="818" y="332" font-size="29" fill="#f4f6f1" font-weight="750" text-anchor="start">What changed in adjusted results</text><text x="818" y="421" font-size="42" fill="#76b900" font-weight="800" text-anchor="start">From Q1 FY27</text><text x="818" y="493" font-size="31" fill="#f4f6f1" font-weight="500" text-anchor="start">Stock-based pay is included in</text><text x="818" y="535" font-size="31" fill="#f4f6f1" font-weight="500" text-anchor="start">non-GAAP measures.</text><text x="818" y="601" font-size="25" fill="#aab2a5" font-weight="500" text-anchor="start">NVIDIA updated the historical figures shown.</text><rect x="80" y="706" width="1440" height="76" rx="12" fill="#19190f" stroke="#413620" stroke-width="2"/><text x="112" y="755" font-size="25" fill="#e8b04a" font-weight="600" text-anchor="start">The accounting change leaves the potential for shareholder dilution.</text>
<line x1="80" y1="824" x2="1520" y2="824" stroke="#34412c" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="863" font-size="20" fill="#aab2a5" font-weight="500" text-anchor="start">NVIDIA earnings release, Nov 2026</text>
<text x="1520" y="863" font-size="18" fill="#aab2a5" font-weight="700" text-anchor="end">NVDA · RESEARCH VAULT</text>
</svg>
