<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>Grid bottlenecks could delay data centres</title><desc>Project delay risk and US clustering · share of projects · IEA 2025 assessment</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Grid bottlenecks could delay data centres</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Project delay risk and US clustering · share of projects · IEA 2025 assessment</text>
<rect x="80" y="233" width="700" height="315" rx="16" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="108" y="263" width="40" height="4" rx="2" fill="#e8b04a"/><text x="108" y="307" fill="#9aa094" font-size="26" font-weight="700" text-anchor="start">PROJECTS AT RISK OF DELAY</text><text x="106" y="396" fill="#e8b04a" font-size="71" font-weight="800" text-anchor="start">Around 20%</text><text x="108" y="454" fill="#f4f6f1" font-size="28" font-weight="500" text-anchor="start">Share of planned data-centre projects</text><text x="108" y="491" fill="#f4f6f1" font-size="28" font-weight="500" text-anchor="start">if grid risks go unaddressed</text><rect x="820" y="233" width="700" height="315" rx="16" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="848" y="263" width="40" height="4" rx="2" fill="#c9cdc4"/><text x="848" y="307" fill="#9aa094" font-size="26" font-weight="700" text-anchor="start">CLUSTERING IN THE US</text><text x="846" y="396" fill="#c9cdc4" font-size="71" font-weight="800" text-anchor="start">50%</text><text x="848" y="454" fill="#f4f6f1" font-size="28" font-weight="500" text-anchor="start">Share of US data centres under development</text><text x="848" y="491" fill="#f4f6f1" font-size="28" font-weight="500" text-anchor="start">in existing large clusters</text><rect x="80" y="633" width="1440" height="108" rx="12" fill="#17170e" stroke="#3e3821" stroke-width="2"/><text x="106" y="678" fill="#e8b04a" font-size="23" font-weight="750" text-anchor="start">WHY TIMING MATTERS</text><text x="385" y="678" fill="#f4f6f1" font-size="27" font-weight="500" text-anchor="start">New transmission lines can take four to eight years</text><text x="385" y="714" fill="#f4f6f1" font-size="27" font-weight="500" text-anchor="start">to build in advanced economies.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: IEA, Energy and AI · Apr 2025</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
