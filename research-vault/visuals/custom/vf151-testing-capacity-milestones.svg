<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>NVIDIA targets more chip testing in early 2027</title><desc>High-volume semiconductor testing targets · calendar 2027 · advance in USD billions</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">NVIDIA targets more chip testing in early 2027</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">High-volume semiconductor testing targets · calendar 2027 · advance in USD billions</text>
<rect x="80" y="236" width="690" height="320" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="108" y="262" width="42" height="4" rx="2" fill="#e8b04a"/><text x="108" y="311" font-size="23" fill="#9aa094" font-weight="700">SINGAPORE TARGET</text><text x="108" y="397" font-size="57" fill="#e8b04a" font-weight="780">February 2027</text><text x="108" y="454" font-size="28" fill="#f4f6f1" font-weight="500">Expanded testing operations</text><text x="108" y="491" font-size="28" fill="#f4f6f1" font-weight="500">target high-volume production.</text><rect x="802" y="236" width="718" height="320" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="830" y="262" width="42" height="4" rx="2" fill="#b7f04a"/><text x="830" y="311" font-size="23" fill="#9aa094" font-weight="700">UNITED STATES TARGET</text><text x="830" y="397" font-size="57" fill="#b7f04a" font-weight="780">April 2027</text><text x="830" y="454" font-size="28" fill="#f4f6f1" font-weight="500">KYEC testing facilities and equipment</text><text x="830" y="491" font-size="28" fill="#f4f6f1" font-weight="500">supported by a $1.1bn reservation advance.</text><rect x="80" y="624" width="1440" height="139" rx="14" fill="#10150c" stroke="#65502d" stroke-width="2"/><text x="108" y="667" font-size="22" fill="#e8b04a" font-weight="750">CAPACITY OUTLOOK</text><text x="108" y="709" font-size="26" fill="#f4f6f1" font-weight="500">NVIDIA expects total testing capacity to double from calendar 2026 to 2027.</text><text x="108" y="743" font-size="26" fill="#f4f6f1" font-weight="500">Both start dates are company targets and depend on the buildouts.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Newsroom · Oct 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
