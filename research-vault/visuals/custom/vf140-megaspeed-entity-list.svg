<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">BIS puts listed entities under tighter chip controls</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">US Entity List · public-inspection final rule · November 2026</text>
<rect x="80" y="235" width="530" height="350" rx="12" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="249" width="5" height="322" rx="2" fill="#76b900" stroke="none" stroke-width="2"/>
<rect x="650" y="235" width="870" height="350" rx="12" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="650" y="249" width="5" height="322" rx="2" fill="#e8b04a" stroke="none" stroke-width="2"/>
<text x="119" y="299" fill="#b7f04a" font-size="24" font-weight="750" text-anchor="start">ENTITY LIST ADDITIONS</text>
<text x="112" y="439" fill="#b7f04a" font-size="87" font-weight="800" text-anchor="start">7 entities</text>
<text x="120" y="520" fill="#f4f6f1" font-size="27" font-weight="550" text-anchor="start">Malaysia, Singapore and Thailand</text>
<text x="689" y="299" fill="#e8b04a" font-size="24" font-weight="750" text-anchor="start">EFFECT FOR LISTED ENTITIES</text>
<text x="686" y="401" fill="#f4f6f1" font-size="58" font-weight="800" text-anchor="start">Licence required</text>
<text x="689" y="468" fill="#f4f6f1" font-size="30" font-weight="550" text-anchor="start">Applications face a presumption of denial.</text>
<text x="689" y="520" fill="#9aa094" font-size="25" font-weight="550" text-anchor="start">Applies to items subject to US export regulations.</text>
<rect x="80" y="631" width="1440" height="147" rx="12" fill="#10150c" stroke="#39452f" stroke-width="2"/>
<text x="119" y="685" fill="#f4f6f1" font-size="32" font-weight="750" text-anchor="start">BIS cited the risk of chip diversion through the listed entities</text>
<text x="119" y="735" fill="#f4f6f1" font-size="26" font-weight="550" text-anchor="start">NVIDIA said it would continue cooperating with government investigations and inquiries.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: US Bureau of Industry and Security, November 2026 · NVIDIA, November 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
