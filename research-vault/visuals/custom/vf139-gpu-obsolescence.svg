<svg role="img" aria-labelledby="chart-title" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="chart-title">New GPUs can erode the value of older ones</title>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">New GPUs can erode the value of older ones</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Economic depreciation risk · published thesis and vendor workload claim</text>
<rect x="80" y="225" width="707" height="448" rx="14" fill="#10150c" stroke="#39452f"/><rect x="80" y="240" width="5" height="418" rx="2" fill="#76b900"/><text x="114" y="293" fill="#b7f04a" font-size="23" font-weight="750">TECHNOLOGY CHANGE</text><text x="114" y="397" fill="#b7f04a" font-size="51" font-weight="800">Up to 10×</text><text x="114" y="469" fill="#c9cdc4" font-size="27" font-weight="550">NVIDIA’s claim for Rubin throughput per</text><text x="114" y="511" fill="#c9cdc4" font-size="27" font-weight="550">megawatt versus Blackwell on one model</text><text x="114" y="553" fill="#c9cdc4" font-size="27" font-weight="550">at comparable interactivity.</text><rect x="813" y="225" width="707" height="448" rx="14" fill="#10150c" stroke="#39452f"/><rect x="813" y="240" width="5" height="418" rx="2" fill="#39452f"/><text x="847" y="293" fill="#9aa094" font-size="23" font-weight="750">INVESTMENT RISK</text><text x="847" y="397" fill="#f4f6f1" font-size="51" font-weight="800">Returns could fall</text><text x="847" y="469" fill="#c9cdc4" font-size="27" font-weight="550">Sequoia argues older chips can lose economic</text><text x="847" y="511" fill="#c9cdc4" font-size="27" font-weight="550">value faster as newer chips improve. Buyers</text><text x="847" y="553" fill="#c9cdc4" font-size="27" font-weight="550">could delay or reduce future orders.</text><rect x="80" y="724" width="1440" height="78" rx="14" fill="#1b190e" stroke="#39452f"/><rect x="80" y="739" width="5" height="48" rx="2" fill="#e8b04a"/><text x="112" y="772" fill="#e7ddc4" font-size="26" font-weight="550">This workload comparison cannot establish GPU resale values or accounting useful lives.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Sequoia Capital · June 2024 | NVIDIA product claim · January 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
