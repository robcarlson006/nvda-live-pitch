<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Supplier audits uncovered labour problems</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Share of strategic suppliers covered by reviewed onsite audits · FY25–FY26</text>
<text x="100" y="254" fill="#f4f6f1" font-size="30" font-weight="700" text-anchor="start">Reviewed onsite audits</text><text x="100" y="345" fill="#b7f04a" font-size="84" font-weight="800" text-anchor="start">93%</text><rect x="100" y="383" width="1360" height="52" fill="#313b2a" rx="8"/><rect x="100" y="383" width="1264.8" height="52" fill="#76b900" rx="8"/><line x1="1460" y1="362" x2="1460" y2="455" stroke="#e8b04a" stroke-width="3"/><text x="1460" y="488" fill="#e8b04a" font-size="26" font-weight="700" text-anchor="end">100% audit goal</text><rect x="80" y="535" width="1440" height="104" fill="#10150c" rx="12" stroke="#313b2a" stroke-width="2"/><rect x="80" y="535" width="5" height="104" fill="#e8b04a" rx="2"/><text x="110" y="573" fill="#e8b04a" font-size="23" font-weight="750" text-anchor="start">Findings included recruitment fees and passport retention</text><text x="110" y="612" fill="#f4f6f1" font-size="27" font-weight="500" text-anchor="start">NVIDIA says it worked with suppliers on fee returns and changes to document handling.</text><text x="110" y="706" fill="#e8b04a" font-size="25" font-weight="750" text-anchor="start">The worker outcome remains open</text><text x="110" y="750" fill="#f4f6f1" font-size="28" font-weight="500" text-anchor="start">The statement gives no independently verified count of workers reimbursed.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA forced labour statement, May 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
