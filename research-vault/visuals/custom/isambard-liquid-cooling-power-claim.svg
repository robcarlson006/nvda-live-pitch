<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Bristol’s cooling claim covers one part of the site</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Isambard-AI direct liquid cooling · claimed maximum reduction in cooling power</text>
<rect x="80" y="258" width="596" height="377" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="258" width="6" height="377" rx="3" fill="#76b900"/><text x="116" y="337" font-size="24" fill="#9aa094" font-weight="800">UP TO</text><text x="112" y="483" font-size="132" fill="#b7f04a" font-weight="800">90%</text><text x="116" y="558" font-size="39" fill="#f4f6f1" font-weight="700">less cooling power</text><rect x="708" y="258" width="812" height="377" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="708" y="258" width="6" height="377" rx="3" fill="#e8b04a"/><text x="742" y="348" font-size="35" fill="#f4f6f1" font-weight="750">The claim covers the cooling system</text><text x="742" y="424" font-size="29" fill="#9aa094" font-weight="500">Bristol describes fanless direct liquid cooling.</text><text x="742" y="475" font-size="29" fill="#9aa094" font-weight="500">Annual facility electricity savings require</text><text x="742" y="520" font-size="29" fill="#9aa094" font-weight="500">metering against a comparable baseline.</text><line x1="80" x2="1520" y1="691" y2="691" stroke="#39452f" stroke-width="2"/><text x="80" y="739" font-size="26" fill="#9aa094" font-weight="500">Bristol’s launch announcement gives a technology upper bound.</text>
