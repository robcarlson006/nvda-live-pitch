<svg role="img" aria-labelledby="chart-title chart-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="chart-title">The emissions total leaves out product use</title>
<desc id="chart-desc">NVIDIA FY26 Scope 3 inventory · metric tonnes CO₂e</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">The emissions total leaves out product use</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">NVIDIA FY26 Scope 3 inventory · metric tonnes CO₂e</text>
<rect x="80" y="220" width="598" height="350" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="108" y="248" width="42" height="4" rx="2" fill="#b7f04a"/><text x="108" y="292" fill="#9aa094" font-size="22" font-weight="730">REPORTED SCOPE 3</text><text x="108" y="371" fill="#b7f04a" font-size="70" font-weight="800">10,700,940</text><text x="108" y="428" fill="#f4f6f1" font-size="29" font-weight="500">Metric tonnes CO₂e across the</text><text x="108" y="466" fill="#f4f6f1" font-size="29" font-weight="500">categories in NVIDIA’s FY26 table.</text><rect x="708" y="220" width="812" height="350" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="736" y="248" width="42" height="4" rx="2" fill="#e8b04a"/><text x="736" y="292" fill="#9aa094" font-size="22" font-weight="730">USE OF SOLD PRODUCTS</text><text x="736" y="371" fill="#e8b04a" font-size="62" font-weight="800">Lifetime emissions</text><text x="736" y="428" fill="#f4f6f1" font-size="29" font-weight="500">The GHG Protocol requires direct use-phase emissions</text><text x="736" y="466" fill="#f4f6f1" font-size="29" font-weight="500">from relevant products sold during the reporting year.</text><rect x="80" y="640" width="1440" height="142" rx="14" fill="#10150c" stroke="#65502d" stroke-width="2"/><text x="110" y="682" fill="#e8b04a" font-size="22" font-weight="750">WHAT TO ASK NVIDIA TO PUBLISH</text><text x="110" y="725" fill="#f4f6f1" font-size="26" font-weight="500">The product-use total and the assumptions behind it, including customer usage and equipment lifetimes.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA FY26 sustainability report · GHG Protocol guidance, accessed Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
