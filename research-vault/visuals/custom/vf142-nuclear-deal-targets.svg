<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Nuclear deals take years to deliver power</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Original online targets for U.S. nuclear projects · announced in 2024</text>
<rect x="80" y="247" width="700" height="365" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="114" y="284" width="54" height="5" rx="6" fill="#76b900" stroke="none" stroke-width="2"/><text x="114" y="336" fill="#f4f6f1" font-size="30" font-weight="700" text-anchor="start">Microsoft and Constellation</text><text x="114" y="454" fill="#b7f04a" font-size="92" font-weight="800" text-anchor="start">2028</text><text x="114" y="512" fill="#f4f6f1" font-size="28" font-weight="650" text-anchor="start">Crane plant restart target</text><text x="114" y="559" fill="#9aa094" font-size="23" font-weight="500" text-anchor="start">Original plan depended on regulatory approvals.</text><rect x="820" y="247" width="700" height="365" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="854" y="284" width="54" height="5" rx="6" fill="#76b900" stroke="none" stroke-width="2"/><text x="854" y="336" fill="#f4f6f1" font-size="30" font-weight="700" text-anchor="start">Google and Kairos Power</text><text x="854" y="454" fill="#b7f04a" font-size="92" font-weight="800" text-anchor="start">2030</text><text x="854" y="512" fill="#f4f6f1" font-size="28" font-weight="650" text-anchor="start">First reactor target</text><text x="854" y="559" fill="#9aa094" font-size="23" font-weight="500" text-anchor="start">Up to 500 MW planned across reactor deployments.</text><rect x="80" y="683" width="1440" height="91" rx="12" fill="#19190f" stroke="#413620" stroke-width="2"/><text x="110" y="740" fill="#e8b04a" font-size="25" font-weight="650" text-anchor="start">IEA base case: coal and gas meet over 40% of added global data-centre electricity demand through 2030.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Constellation · Sep 2024 / Google · Oct 2024 / IEA · Apr 2025</text>
