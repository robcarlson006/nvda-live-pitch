<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">NVIDIA’s water disclosure covers its own operations</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Withdrawal, discharge and consumption · cubic metres · FY26</text>
<rect x="80" y="215" width="1440" height="473" rx="16" fill="#10150c" stroke="#39452f" stroke-width="2" stroke-dasharray=""/><text x="113" y="300" fill="#9aa094" font-size="25" font-weight="750" text-anchor="start">WATER WITHDRAWN</text><text x="110" y="410" fill="#f4f6f1" font-size="91" font-weight="800" text-anchor="start">451,297 m³</text><rect x="114" y="467" width="1047" height="68" rx="8" fill="#526347" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="1169" y="467" width="317" height="68" rx="8" fill="#76b900" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="114" y="596" fill="#f4f6f1" font-size="43" font-weight="750" text-anchor="start">345,766 m³</text><text x="114" y="640" fill="#9aa094" font-size="28" font-weight="600" text-anchor="start">Discharged</text><text x="1169" y="596" fill="#b7f04a" font-size="43" font-weight="750" text-anchor="start">105,531 m³</text><text x="1169" y="640" fill="#9aa094" font-size="28" font-weight="600" text-anchor="start">Consumed</text><rect x="80" y="706" width="1440" height="88" rx="8" fill="#10150c" stroke="#39452f" stroke-width="2" stroke-dasharray=""/><text x="105" y="748" fill="#f4f6f1" font-size="25" font-weight="600" text-anchor="start">Foundries and customer sites need separate water data.</text><text x="105" y="780" fill="#e8b04a" font-size="25" font-weight="600" text-anchor="start">NVIDIA changed how it collects water data, so earlier years aren’t comparable.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA FY26 Sustainability Report · fiscal year ended Jan 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
