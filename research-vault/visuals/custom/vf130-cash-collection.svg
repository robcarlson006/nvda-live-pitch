<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Selected investment-grade customers  ·  First-half FY27 filing</text>
<rect x="80" y="217" width="1440" height="238" rx="16" fill="#10150e" stroke="#39452f" stroke-width="2"/><text x="116" y="270" fill="#9aa094" font-size="23" font-weight="700" text-anchor="start">TERMS OFFERED ON SOME LARGE DATA-CENTRE BUILDS</text><text x="118" y="375" fill="#b7f04a" font-size="82" font-weight="800" text-anchor="start">90 days to one year</text><rect x="80" y="506" width="448" height="170" rx="16" fill="#10150e" stroke="#39452f" stroke-width="2"/><text x="108" y="557" fill="#b7f04a" font-size="29" font-weight="750" text-anchor="start">Control transfers</text><text x="108" y="600" fill="#f4f6f1" font-size="24" font-weight="500" text-anchor="start">NVIDIA generally recognises</text><text x="108" y="632" fill="#f4f6f1" font-size="24" font-weight="500" text-anchor="start">product revenue.</text><rect x="576" y="506" width="448" height="170" rx="16" fill="#10150e" stroke="#39452f" stroke-width="2"/><text x="604" y="557" fill="#b7f04a" font-size="29" font-weight="750" text-anchor="start">Receivables rise</text><text x="604" y="600" fill="#f4f6f1" font-size="24" font-weight="500" text-anchor="start">Longer terms tied up more</text><text x="604" y="632" fill="#f4f6f1" font-size="24" font-weight="500" text-anchor="start">cash in receivables.</text><rect x="1072" y="506" width="448" height="170" rx="16" fill="#10150e" stroke="#39452f" stroke-width="2"/><text x="1100" y="557" fill="#e8b04a" font-size="29" font-weight="750" text-anchor="start">Cash arrives later</text><text x="1100" y="600" fill="#f4f6f1" font-size="24" font-weight="500" text-anchor="start">The timing affects</text><text x="1100" y="632" fill="#f4f6f1" font-size="24" font-weight="500" text-anchor="start">operating cash flow.</text><rect x="80" y="730" width="1440" height="76" rx="16" fill="#201a0e" stroke="#66502a" stroke-width="2"/><text x="110" y="777" fill="#e8b04a" font-size="23" font-weight="600" text-anchor="start">NVIDIA says these extended terms can apply to certain investment-grade customers.</text>
