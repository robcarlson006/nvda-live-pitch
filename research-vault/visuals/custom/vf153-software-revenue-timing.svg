<svg role="img" aria-labelledby="chart-title chart-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="chart-title">Software licences and support book at different times</title>
<desc id="chart-desc">Revenue recognition and remaining contract obligations · FY24 policy and July 2026 balance</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Software licences and support book at different times</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Revenue recognition and remaining contract obligations · FY24 policy and July 2026 balance</text>
<rect x="80" y="221" width="700" height="348" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="108" y="249" width="42" height="4" rx="2" fill="#b7f04a"/><text x="108" y="293" fill="#9aa094" font-size="22" font-weight="730">LICENCE REVENUE</text><text x="108" y="372" fill="#b7f04a" font-size="63" font-weight="800">Upfront</text><text x="108" y="429" fill="#f4f6f1" font-size="29" font-weight="500">NVIDIA’s FY24 filing says it recognised licence</text><text x="108" y="467" fill="#f4f6f1" font-size="29" font-weight="500">revenue when software became available.</text><rect x="812" y="221" width="708" height="348" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="840" y="249" width="42" height="4" rx="2" fill="#f4f6f1"/><text x="840" y="293" fill="#9aa094" font-size="22" font-weight="730">SOFTWARE SUPPORT</text><text x="840" y="372" fill="#f4f6f1" font-size="63" font-weight="800">Over time</text><text x="840" y="429" fill="#f4f6f1" font-size="29" font-weight="500">NVIDIA recognised support over the service</text><text x="840" y="467" fill="#f4f6f1" font-size="29" font-weight="500">period or as it performed the services.</text><rect x="80" y="640" width="1440" height="142" rx="14" fill="#10150c" stroke="#65502d" stroke-width="2"/><text x="110" y="682" fill="#e8b04a" font-size="22" font-weight="750">THE $3.2BN CONTRACT BALANCE COVERS MULTIPLE OFFERINGS</text><text x="110" y="725" fill="#f4f6f1" font-size="26" font-weight="500">The July 2026 figure covers remaining obligations on contracts longer than one year.</text><text x="110" y="759" fill="#f4f6f1" font-size="26" font-weight="500">It gives no standalone AI Enterprise revenue or recurring software run rate.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA FY24 10-K and Q2 FY27 10-Q, Feb 2024 and Aug 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
