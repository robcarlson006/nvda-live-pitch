<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Reopening a fab is only one step to recovery</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Historical supply lead times (months) and production dependencies · FY26 filing</text>
<rect x="80" y="216" width="585" height="445" fill="#10150c" stroke="#39452f" rx="14"/><rect x="695" y="216" width="825" height="445" fill="#10150c" stroke="#39452f" rx="14"/><text x="110" y="273" font-size="22" fill="#9aa094" font-weight="750">HISTORICAL SUPPLY LEAD TIME</text><text x="105" y="418" font-size="86" fill="#e8b04a" font-weight="800">&gt;12 months</text><text x="110" y="512" font-size="34" fill="#f4f6f1" font-weight="680">NVIDIA’s reported experience</text><text x="110" y="559" font-size="28" fill="#9aa094" font-weight="600">NVIDIA says this could recur.</text><text x="724" y="273" font-size="22" fill="#9aa094" font-weight="750">STAGES NEEDED TO SHIP</text><rect x="724" y="311" width="765" height="72" fill="#243019" stroke="#39452f" rx="9"/><text x="747" y="359" font-size="32" fill="#f4f6f1" font-weight="700">Foundry fabrication</text><path d="M1106 383 L1106 412" stroke="#76b900" stroke-width="3"/><rect x="724" y="413" width="765" height="72" fill="#243019" stroke="#39452f" rx="9"/><text x="747" y="461" font-size="32" fill="#f4f6f1" font-weight="700">Advanced packaging</text><path d="M1106 485 L1106 514" stroke="#76b900" stroke-width="3"/><rect x="724" y="515" width="765" height="72" fill="#243019" stroke="#39452f" rx="9"/><text x="747" y="563" font-size="32" fill="#f4f6f1" font-weight="700">Assembly and testing</text><rect x="80" y="704" width="1440" height="108" fill="#16160e" stroke="#4a3c25" rx="14"/><rect x="80" y="704" width="5" height="108" fill="#e8b04a" stroke="none" rx="2"/><text x="108" y="743" font-size="28" fill="#e8b04a" font-weight="750">Recovery after a Taiwan disruption has no verified timetable</text><text x="108" y="783" font-size="27" fill="#f4f6f1" font-weight="550">Replacement suppliers must qualify before they can supply at volume.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Form 10-K · Feb 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
