<text x="80" y="96" fill="#f4f6f1" font-size="46" font-weight="800" letter-spacing="-0.5">H20 restrictions triggered charges and blocked shipments</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">NVIDIA H20 export-control disclosures · USD · Q1 and Q2 FY26</text>
<text x="106" y="250" fill="#9aa094" font-size="24" font-weight="700" text-anchor="start">Period</text><text x="322" y="250" fill="#9aa094" font-size="24" font-weight="700" text-anchor="start">Disclosure</text><text x="934" y="250" fill="#9aa094" font-size="24" font-weight="700" text-anchor="start">Basis</text><text x="1487" y="250" fill="#9aa094" font-size="24" font-weight="700" text-anchor="end">USD</text><rect x="80" y="280" width="1440" height="88" rx="10" fill="#10150c" stroke="#39452f" stroke-width="2"/><text x="106" y="335" fill="#9aa094" font-size="28" font-weight="600" text-anchor="start">Q1 FY26</text><text x="322" y="335" fill="#f4f6f1" font-size="30" font-weight="650" text-anchor="start">Inventory and purchase obligations</text><text x="934" y="335" fill="#e5484d" font-size="26" font-weight="650" text-anchor="start">Booked charge</text><text x="1487" y="337" fill="#f4f6f1" font-size="42" font-weight="800" text-anchor="end">$4.5bn</text><rect x="80" y="386" width="1440" height="88" rx="10" fill="#0e110c" stroke="#39452f" stroke-width="2"/><text x="106" y="441" fill="#9aa094" font-size="28" font-weight="600" text-anchor="start">Q1 FY26</text><text x="322" y="441" fill="#f4f6f1" font-size="30" font-weight="650" text-anchor="start">H20 shipments NVIDIA could not make</text><text x="934" y="441" fill="#e8b04a" font-size="26" font-weight="650" text-anchor="start">Unshipped revenue</text><text x="1487" y="443" fill="#f4f6f1" font-size="42" font-weight="800" text-anchor="end">$2.5bn</text><rect x="80" y="492" width="1440" height="88" rx="10" fill="#10150c" stroke="#39452f" stroke-width="2"/><text x="106" y="547" fill="#9aa094" font-size="28" font-weight="600" text-anchor="start">Q2 FY26</text><text x="322" y="547" fill="#f4f6f1" font-size="30" font-weight="650" text-anchor="start">Lost H20 sales in the May outlook</text><text x="934" y="547" fill="#e8b04a" font-size="26" font-weight="650" text-anchor="start">Forecast</text><text x="1487" y="549" fill="#f4f6f1" font-size="42" font-weight="800" text-anchor="end">≈$8.0bn</text><rect x="80" y="598" width="1440" height="88" rx="10" fill="#0e110c" stroke="#39452f" stroke-width="2"/><text x="106" y="653" fill="#9aa094" font-size="28" font-weight="600" text-anchor="start">Q2 FY26</text><text x="322" y="653" fill="#f4f6f1" font-size="30" font-weight="650" text-anchor="start">H20 inventory reserves released</text><text x="934" y="653" fill="#b7f04a" font-size="26" font-weight="650" text-anchor="start">Booked release</text><text x="1487" y="655" fill="#f4f6f1" font-size="42" font-weight="800" text-anchor="end">$180m</text><text x="80" y="782" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start">The disclosures leave the final net cost unresolved.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Q1 and Q2 FY26 results · May and Aug 2025</text>
