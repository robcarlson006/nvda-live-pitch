<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Triton supports several GPU platforms</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Documented software requirements · November 2026 snapshot</text>
<rect x="80" y="214" width="1440" height="451" fill="#10150c" stroke="#39452f" rx="14"/><text x="111" y="269" font-size="22" fill="#9aa094" font-weight="750">HARDWARE</text><text x="490" y="269" font-size="22" fill="#9aa094" font-weight="750">TRITON SUPPORT</text><text x="963" y="269" font-size="22" fill="#9aa094" font-weight="750">DOCUMENTED REQUIREMENT</text><path d="M110 305 L1485 305" stroke="#39452f" stroke-width="2"/><text x="110" y="358" font-size="40" fill="#b7f04a" font-weight="750">NVIDIA</text><text x="490" y="358" font-size="33" fill="#f4f6f1" font-weight="600">Upstream</text><text x="963" y="358" font-size="31" fill="#9aa094" font-weight="600">Compute capability 8.0+</text><path d="M110 418 L1485 418" stroke="#39452f" stroke-width="2"/><text x="110" y="471" font-size="40" fill="#f4f6f1" font-weight="750">AMD</text><text x="490" y="471" font-size="33" fill="#f4f6f1" font-weight="600">Upstream</text><text x="963" y="471" font-size="31" fill="#9aa094" font-weight="600">ROCm 6.2+</text><path d="M110 531 L1485 531" stroke="#39452f" stroke-width="2"/><text x="110" y="584" font-size="40" fill="#f4f6f1" font-weight="750">Intel</text><text x="490" y="584" font-size="33" fill="#f4f6f1" font-weight="600">Separate XPU backend</text><text x="963" y="584" font-size="31" fill="#9aa094" font-weight="600">Check XPU stack compatibility</text><rect x="80" y="704" width="1440" height="108" fill="#16160e" stroke="#4a3c25" rx="14"/><rect x="80" y="704" width="5" height="108" fill="#e8b04a" stroke="none" rx="2"/><text x="108" y="743" font-size="28" fill="#e8b04a" font-weight="750">Migration effort and speed depend on the application</text><text x="108" y="783" font-size="27" fill="#f4f6f1" font-weight="550">Intel provides modified tutorials and recommends profiling the full application and individual kernels.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Triton project &amp; Intel XPU backend · Nov 2026</text>
