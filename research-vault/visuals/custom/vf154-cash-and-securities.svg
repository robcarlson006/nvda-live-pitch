<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>Marketable equities now exceed cash</title><desc>By October, NVIDIA held more in marketable equities than in cash and cash equivalents, and those investments carry market price risk.</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Marketable equities now exceed cash</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Selected NVIDIA current assets · USD millions · January and October 2026</text>
<rect x="80" y="188" width="22" height="22" rx="6" fill="#64725a" stroke="none" stroke-width="2"/><text x="114" y="208" fill="#9aa094" font-size="22" font-weight="500" text-anchor="start">25 Jan 2026</text><rect x="292" y="188" width="22" height="22" rx="6" fill="#76b900" stroke="none" stroke-width="2"/><text x="326" y="208" fill="#9aa094" font-size="22" font-weight="500" text-anchor="start">25 Oct 2026</text><line x1="515" y1="248" x2="515" y2="746" stroke="#39452f" stroke-width="2" stroke-dasharray=""/><text x="80" y="323" fill="#9aa094" font-size="31" font-weight="530" text-anchor="start">Cash and equivalents</text><rect x="515" y="267" width="194.74" height="37" rx="6" fill="#64725a" stroke="none" stroke-width="2"/><text x="726.74" y="296" fill="#f4f6f1" font-size="27" font-weight="700" text-anchor="start">$10,605m</text><rect x="515" y="320" width="534.17" height="37" rx="6" fill="#76b900" stroke="none" stroke-width="2"/><text x="1066.17" y="349" fill="#f4f6f1" font-size="27" font-weight="700" text-anchor="start">$29,089m</text><line x1="80" y1="390" x2="1520" y2="390" stroke="#263022" stroke-width="2" stroke-dasharray=""/><text x="80" y="481" fill="#9aa094" font-size="31" font-weight="530" text-anchor="start">Marketable debt securities</text><rect x="515" y="425" width="717.36" height="37" rx="6" fill="#64725a" stroke="none" stroke-width="2"/><text x="1249.3600000000001" y="454" fill="#f4f6f1" font-size="27" font-weight="700" text-anchor="start">$39,065m</text><rect x="515" y="478" width="448.48" height="37" rx="6" fill="#76b900" stroke="none" stroke-width="2"/><text x="980.48" y="507" fill="#f4f6f1" font-size="27" font-weight="700" text-anchor="start">$24,423m</text><line x1="80" y1="548" x2="1520" y2="548" stroke="#263022" stroke-width="2" stroke-dasharray=""/><text x="80" y="639" fill="#f4f6f1" font-size="31" font-weight="700" text-anchor="start">Marketable equity securities</text><rect x="515" y="583" width="236.63" height="37" rx="6" fill="#64725a" stroke="none" stroke-width="2"/><text x="768.63" y="612" fill="#f4f6f1" font-size="27" font-weight="700" text-anchor="start">$12,886m</text><rect x="515" y="636" width="812.0" height="37" rx="6" fill="#76b900" stroke="none" stroke-width="2"/><text x="1344.0" y="665" fill="#b7f04a" font-size="27" font-weight="700" text-anchor="start">$44,219m</text><text x="80" y="793" fill="#9aa094" font-size="27" font-weight="500" text-anchor="start">Equity securities carry market price risk.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Q3 FY27 earnings release · Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
