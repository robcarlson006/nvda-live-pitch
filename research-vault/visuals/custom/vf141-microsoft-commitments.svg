<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="51" font-weight="800" letter-spacing="-0.5">Microsoft has substantial future data-centre commitments</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Outstanding commitments · USD billions · 30 June 2026</text>
<rect x="80" y="267" width="690" height="353" rx="16" fill="#10150c" stroke="#39452f"/><rect x="80" y="267" width="6" height="353" rx="3" fill="#39452f" stroke="none"/><text x="120" y="404" fill="#f4f6f1" font-size="86" font-weight="800" text-anchor="start">$34.6bn</text><text x="120" y="499" fill="#f4f6f1" font-size="34" font-weight="700" text-anchor="start">Construction commitments</text><text x="120" y="545" fill="#9aa094" font-size="27" font-weight="500" text-anchor="start">Primarily for data centres</text><rect x="810" y="267" width="690" height="353" rx="16" fill="#10150c" stroke="#39452f"/><rect x="810" y="267" width="6" height="353" rx="3" fill="#76b900" stroke="none"/><text x="850" y="404" fill="#b7f04a" font-size="86" font-weight="800" text-anchor="start">$329.1bn</text><text x="850" y="499" fill="#f4f6f1" font-size="34" font-weight="700" text-anchor="start">Leases yet to begin</text><text x="850" y="545" fill="#9aa094" font-size="27" font-weight="500" text-anchor="start">Primarily for data centres</text><text x="80" y="736" fill="#9aa094" font-size="27" font-weight="500" text-anchor="start">Some leases are conditional. The figures give no annual GPU spending amount.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Microsoft FY26 Annual Report · 30 Jun 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
