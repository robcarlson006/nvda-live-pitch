<text x="112" y="225" fill="#9aa094" font-size="21" font-weight="750">ROLE START</text><text x="502" y="225" fill="#9aa094" font-size="21" font-weight="750">FINANCE AND OPERATING EXPERIENCE</text><rect x="80" y="250" width="1440" height="83" rx="14" fill="#10150c" stroke="#39452f"/><rect x="80" y="265" width="5" height="53" rx="2" fill="#39452f"/><text x="112" y="302" fill="#f4f6f1" font-size="30" font-weight="750">Microsoft · 2006</text><text x="502" y="302" fill="#f4f6f1" font-size="29" font-weight="550">CFO of Server and Tools</text><rect x="80" y="353" width="1440" height="83" rx="14" fill="#10150c" stroke="#39452f"/><rect x="80" y="368" width="5" height="53" rx="2" fill="#39452f"/><text x="112" y="405" fill="#f4f6f1" font-size="30" font-weight="750">Cisco · 2010</text><text x="502" y="405" fill="#f4f6f1" font-size="29" font-weight="550">CFO of Business Technology and Operations Finance</text><rect x="80" y="456" width="1440" height="83" rx="14" fill="#10150c" stroke="#39452f"/><rect x="80" y="471" width="5" height="53" rx="2" fill="#76b900"/><text x="112" y="508" fill="#b7f04a" font-size="30" font-weight="750">NVIDIA · 2013</text><text x="502" y="508" fill="#f4f6f1" font-size="29" font-weight="550">NVIDIA CFO, with interim CEO service in November 2026</text><rect x="80" y="559" width="1440" height="83" rx="14" fill="#10150c" stroke="#39452f"/><rect x="80" y="574" width="5" height="53" rx="2" fill="#39452f"/><text x="112" y="611" fill="#f4f6f1" font-size="30" font-weight="750">Operating experience</text><text x="502" y="611" fill="#f4f6f1" font-size="29" font-weight="550">Ajay Puri in field operations and Debora Shoquist in operations</text><rect x="80" y="724" width="1440" height="78" rx="14" fill="#1b190e" stroke="#39452f"/><rect x="80" y="739" width="5" height="48" rx="2" fill="#e8b04a"/><text x="112" y="772" fill="#e7ddc4" font-size="26" font-weight="550">Huang returned as CEO after the interim appointment. Permanent succession remains a board question.</tex