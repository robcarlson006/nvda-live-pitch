<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">CUDA can be ported to AMD with rework</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Library footprint in NVIDIA’s 2024 review · AMD porting guidance accessed November 2026</text>
<rect x="80" y="233" width="474" height="378" rx="14" fill="#10150c" stroke="#39452f"/><rect x="81" y="253" width="4" height="338" rx="2" fill="#76b900" stroke="none"/><text x="112" y="294" font-size="23" fill="#b7f04a" font-weight="740">NVIDIA’S CUDA ECOSYSTEM</text><text x="110" y="418" font-size="94" fill="#f4f6f1" font-weight="800">300+</text><text x="114" y="485" font-size="30" fill="#9aa094" font-weight="550">Libraries NVIDIA listed</text>
<text x="114" y="528" font-size="30" fill="#9aa094" font-weight="550">in its 2024 annual review.</text><rect x="580" y="233" width="940" height="378" rx="14" fill="#10150c" stroke="#39452f"/><text x="615" y="294" font-size="23" fill="#9aa094" font-weight="740">WHAT A PORT TO AMD INVOLVES</text><text x="615" y="363" font-size="34" fill="#f4f6f1" font-weight="770">Translate</text><text x="828" y="363" font-size="29" fill="#9aa094" font-weight="550">Use HIPIFY to convert supported code.</text><rect x="615" y="387" width="866" height="1" rx="0" fill="#39452f" stroke="none"/><text x="615" y="448" font-size="34" fill="#f4f6f1" font-weight="770">Test</text><text x="828" y="448" font-size="29" fill="#9aa094" font-weight="550">Verify each converted section.</text><rect x="615" y="472" width="866" height="1" rx="0" fill="#39452f" stroke="none"/><text x="615" y="533" font-size="34" fill="#f4f6f1" font-weight="770">Rework</text><text x="828" y="533" font-size="29" fill="#9aa094" font-weight="550">Replace missing libraries and retune as needed.</text><rect x="80" y="685" width="1440" height="122" rx="14" fill="#17160e" stroke="#4a3c25"/>
<rect x="81" y="699" width="4" height="94" rx="2" fill="#e8b04a" stroke="none"/>
<text x="112" y="730" font-size="30" fill="#e8b04a" font-weight="750">Switching costs depend on the application</text>
<text x="112" y="775" font-size="27" fill="#f4f6f1" font-weight="550">The work depends on which libraries the application uses and how heavily its code is tuned for NVIDIA GPUs.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA annual review, 2024 · AMD ROCm and HIPIFY documentation, accessed Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
