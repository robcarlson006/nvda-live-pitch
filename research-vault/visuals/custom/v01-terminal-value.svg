-weight="500" text-anchor="start">Team sensitivity</text><rect x="365" y="573" width="236.32468419255719" height="74" rx="5" fill="#5c841d" stroke="none"/><rect x="604.3246841925572" y="573" width="409.2328439740526" height="74" rx="5" fill="#aa8139" stroke="none"/><text x="483.1623420962786" y="619" fill="#f4f6f1" font-size="25" font-weight="800" text-anchor="middle">$1.98tn</text><text x="807.4411061795836" y="619" fill="#0b0d0a" font-size="25" font-weight="800" text-anchor="middle">$3.45tn</text><text x="80" y="763" fill="#e8b04a" font-size="22" font-weight="550" text-anchor="start">Terminal value is 75.56% of base-case enterprise value.</text><text x="80" y="801" fill="#9aa094" font-size="22" font-weight="550" text-anchor="start">Grow final-year cash flow by the perpetual rate, divide by WACC less that rate, then discount to the model date.</text>
