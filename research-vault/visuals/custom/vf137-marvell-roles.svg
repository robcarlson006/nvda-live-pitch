<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Marvell can build around a customer’s chip design</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Custom accelerator roles and reported Data Center sales, Q2 FY27</text>
<rect x="80" y="232" width="704" height="350" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="232" width="704" height="5" rx="14" fill="#76b900" stroke="none" stroke-width="2"/><text x="112" y="290" fill="#b7f04a" font-size="22" font-weight="750" text-anchor="start">HYPERSCALER</text><text x="112" y="375" fill="#f4f6f1" font-size="54" font-weight="800" text-anchor="start">Compute design</text><text x="112" y="443" fill="#c9cdc4" font-size="28" font-weight="500" text-anchor="start">The customer can retain control over the</text><text x="112" y="485" fill="#c9cdc4" font-size="28" font-weight="500" text-anchor="start">compute architecture at the heart of the chip.</text><rect x="816" y="232" width="704" height="350" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="816" y="232" width="704" height="5" rx="14" fill="#76b900" stroke="none" stroke-width="2"/><text x="848" y="290" fill="#b7f04a" font-size="22" font-weight="750" text-anchor="start">MARVELL</text><text x="848" y="375" fill="#f4f6f1" font-size="54" font-weight="800" text-anchor="start">Chip integration</text><text x="848" y="443" fill="#c9cdc4" font-size="28" font-weight="500" text-anchor="start">Chiplets, design IP, packaging and production</text><text x="848" y="485" fill="#c9cdc4" font-size="28" font-weight="500" text-anchor="start">support via co-development or design-to-spec.</text><rect x="80" y="692" width="1440" height="107" rx="14" fill="#191a10" stroke="#54452a" stroke-width="2"/><text x="109" y="734" fill="#e8b04a" font-size="24" font-weight="750" text-anchor="start">WHAT MARVELL REPORTS</text><text x="109" y="771" fill="#c9cdc4" font-size="27" font-weight="500" text-anchor="start">Q2 FY27 Data Center sales were $2,171.5m across the segment. Custom-chip sales are undisclosed here.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Marvell product disclosure, accessed Nov 2026, and results, Aug 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
