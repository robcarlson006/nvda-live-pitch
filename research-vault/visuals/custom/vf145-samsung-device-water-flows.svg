<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="46" font-weight="800" letter-spacing="-0.5">Samsung’s device sites discharged most water they withdrew</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Samsung Device eXperience division · Thousand tonnes of water · Calendar 2025</text>
<text x="80" y="308" fill="#f4f6f1" font-size="32" font-weight="750" text-anchor="start">Water withdrawn</text>
<text x="1520" y="308" fill="#f4f6f1" font-size="50" font-weight="800" text-anchor="end">18,710</text>
<rect x="80" y="379" width="1169.7017637626936" height="110" fill="#39452f" rx="0" stroke="none"/>
<rect x="1249.7017637626936" y="379" width="270.29823623730636" height="110" fill="#76b900" rx="0" stroke="none"/>
<text x="110" y="446" fill="#f4f6f1" font-size="43" font-weight="800" text-anchor="start">15,198</text>
