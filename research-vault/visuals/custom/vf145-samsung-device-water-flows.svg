<text x="80" y="716" fill="#9aa094" font-size="27" font-weight="500" text-anchor="start">These figures cover Samsung’s device division. Fab water use is reported separately.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Samsung Electronics Sustainability Report · June 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
