<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">NVIDIA gives no AI Enterprise revenue figure</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Contract obligations cover agreements longer than one year  ·  USD billions</text>
<rect x="80" y="215" width="844" height="475" rx="16" fill="#10150e" stroke="#39452f" stroke-width="2"/><text x="116" y="268" fill="#9aa094" font-size="23" font-weight="700" text-anchor="start">REMAINING PERFORMANCE OBLIGATIONS</text><text x="116" y="352" fill="#f4f6f1" font-size="27" font-weight="500" text-anchor="start">January 2026</text><text x="884" y="352" fill="#f4f6f1" font-size="43" font-weight="800" text-anchor="end">$2.3bn</text><rect x="116" y="375" width="407.1" height="48" rx="8" fill="#59664e"/><text x="116" y="500" fill="#f4f6f1" font-size="27" font-weight="500" text-anchor="start">July 2026</text><text x="884" y="500" fill="#b7f04a" font-size="43" font-weight="800" text-anchor="end">$3.2bn</text><rect x="116" y="523" width="566.4" height="48" rx="8" fill="#76b900"/><rect x="970" y="215" width="550" height="475" rx="16" fill="#10150e" stroke="#39452f" stroke-width="2"/><text x="1006" y="268" fill="#9aa094" font-size="23" font-weight="700" text-anchor="start">AI ENTERPRISE</text><text x="1006" y="361" fill="#b7f04a" font-size="40" font-weight="800" text-anchor="start">Paid licences</text><text x="1006" y="407" fill="#f4f6f1" font-size="26" font-weight="500" text-anchor="start">NVIDIA sells them separately.</text><line x1="1006" y1="456" x2="1484" y2="456" stroke="#39452f" stroke-width="2"/><text x="1006" y="531" fill="#e8b04a" font-size="35" font-weight="750" text-anchor="start">Revenue undisclosed</text><text x="1006" y="579" fill="#f4f6f1" font-size="25" font-weight="500" text-anchor="start">The filings give no separate total.</text><rect x="80" y="730" width="1440" height="76" rx="16" fill="#201a0e" stroke="#66502a" stroke-width="2"/><text x="110" y="777" fill="#e8b04a" font-size="23" font-weight="600" text-anchor="start">Unearned revenue includes hardware and software support, along with cloud services.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA annual and quarterly filings, Feb and Aug 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
