<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">US licences did not ensure China sales</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Selected export-control and company milestones · 2022–2026</text>
<path d="M102 236V741" stroke="#39452f" stroke-width="4"/><circle cx="102" cy="236" r="8" fill="#9aa094"/><text x="129" y="244" fill="#9aa094" font-size="24" font-weight="730" text-anchor="start">Aug 2022</text><text x="410" y="233" fill="#f4f6f1" font-size="34" font-weight="750" text-anchor="start">US announces semiconductor export restrictions</text><text x="410" y="271" fill="#9aa094" font-size="24" font-weight="500" text-anchor="start">The measures target China’s semiconductor and supercomputing industries.</text><circle cx="102" cy="337" r="8" fill="#9aa094"/><text x="129" y="345" fill="#9aa094" font-size="24" font-weight="730" text-anchor="start">Oct 2023</text><text x="410" y="334" fill="#f4f6f1" font-size="34" font-weight="750" text-anchor="start">US broadens licensing</text><text x="410" y="372" fill="#9aa094" font-size="24" font-weight="500" text-anchor="start">Updated requirements cover chips above specified performance thresholds.</text><circle cx="102" cy="438" r="8" fill="#9aa094"/><text x="129" y="446" fill="#9aa094" font-size="24" font-weight="730" text-anchor="start">Apr 2025</text><text x="410" y="435" fill="#f4f6f1" font-size="34" font-weight="750" text-anchor="start">US requires a licence for H20</text><text x="410" y="473" fill="#9aa094" font-size="24" font-weight="500" text-anchor="start">NVIDIA says it was told that H20 exports to China required a US licence.</text><circle cx="102" cy="539" r="8" fill="#e8b04a"/><text x="129" y="547" fill="#e8b04a" font-size="24" font-weight="730" text-anchor="start">Aug 2025</text><text x="410" y="536" fill="#f4f6f1" font-size="34" font-weight="750" text-anchor="start">US grants some H20 licences</text><text x="410" y="574" fill="#9aa094" font-size="24" font-weight="500" text-anchor="start">NVIDIA says Chinese restrictions still prevented it from selling its inventory.</text><circle cx="102" cy="640" r="8" fill="#e8b04a"/><text x="129" y="648" fill="#e8b04a" font-size="24" font-weight="730" text-anchor="start">Feb 2026</text><text x="410" y="637" fill="#f4f6f1" font-size="34" font-weight="750" text-anchor="start">US starts granting limited H200 licences</text><text x="410" y="675" fill="#9aa094" font-size="24" font-weight="500" text-anchor="start">NVIDIA says Chinese restrictions still limited sales to licensed customers.</text><circle cx="102" cy="741" r="8" fill="#76b900"/><text x="129" y="749" fill="#76b900" font-size="24" font-weight="730" text-anchor="start">Nov 2026</text><text x="410" y="738" fill="#f4f6f1" font-size="34" font-weight="750" text-anchor="start">NVIDIA guides without China compute sales</text><text x="410" y="776" fill="#9aa094" font-size="24" font-weight="500" text-anchor="start">The Q4 FY27 outlook assumes no Data Center compute revenue from China.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Q2 FY27 10-Q, August 2026 · Q1 FY26 results, May 2025 · Q3 FY27 results, November 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
