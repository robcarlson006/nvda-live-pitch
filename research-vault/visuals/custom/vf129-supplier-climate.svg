<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">NVIDIA exceeded its supplier engagement goal</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Share of Scope 3 purchased-goods and services emissions · FY25</text>
<text x="90" y="275" fill="#f4f6f1" font-size="29" font-weight="650" text-anchor="start">Share of purchased-goods and services emissions represented by engaged suppliers</text><rect x="90" y="407" width="1410" height="44" fill="#313b2a" rx="8"/><rect x="90" y="407" width="1128.0" height="44" fill="#76b900" rx="8"/><path d="M1217.0 397 L1247.0 429 L1217.0 461 Z" fill="#76b900"/><line x1="1034.7" y1="390" x2="1034.7" y2="468" stroke="#e8b04a" stroke-width="3"/><text x="1022.7" y="510" fill="#e8b04a" font-size="28" font-weight="700" text-anchor="end">At least 67% goal</text><text x="1218.0" y="374" fill="#b7f04a" font-size="56" font-weight="800" text-anchor="middle">Over 80%</text><rect x="80" y="598" width="1440" height="104" fill="#10150c" rx="12" stroke="#313b2a" stroke-width="2"/><rect x="80" y="598" width="5" height="104" fill="#e8b04a" rx="2"/><text x="110" y="636" fill="#e8b04a" font-size="23" font-weight="750" text-anchor="start">Supplier adoption is a separate test</text><text x="110" y="675" fill="#f4f6f1" font-size="27" font-weight="500" text-anchor="start">The reported figure measures engagement with suppliers. It gives no adoption rate or emissions savings.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA FY25 Sustainability Report, Jun 2025</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
