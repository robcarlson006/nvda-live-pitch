<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>The RAG benchmark measures offline throughput</title><desc>MLPerf end-to-end retrieval-augmented generation · submission criteria · August 2026</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">The RAG benchmark measures offline throughput</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">MLPerf end-to-end retrieval-augmented generation · submission criteria · August 2026</text>
<rect x="80" y="226" width="1440" height="370" rx="16" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="117" y="259" width="46" height="4" rx="2" fill="#76b900"/><text x="117" y="321" fill="#9aa094" font-size="27" font-weight="750" text-anchor="start">SUBMISSION QUALITY FLOOR</text><text x="112" y="448" fill="#b7f04a" font-size="98" font-weight="800" text-anchor="start">At least 97%</text><text x="117" y="513" fill="#f4f6f1" font-size="36" font-weight="700" text-anchor="start">of reference answer accuracy</text><line x1="765" y1="271" x2="765" y2="551" stroke="#39452f" stroke-width="2"/><text x="822" y="321" fill="#9aa094" font-size="27" font-weight="750" text-anchor="start">BENCHMARK SCENARIO</text><text x="822" y="420" fill="#f4f6f1" font-size="61" font-weight="800" text-anchor="start">Offline throughput</text><text x="822" y="495" fill="#9aa094" font-size="30" font-weight="500" text-anchor="start">First end-to-end retrieval and</text><text x="822" y="536" fill="#9aa094" font-size="30" font-weight="500" text-anchor="start">answer generation benchmark</text><rect x="80" y="664" width="1440" height="72" rx="12" fill="#17170e" stroke="#3e3821" stroke-width="2"/><text x="106" y="709" fill="#e8b04a" font-size="23" font-weight="750" text-anchor="start">FOR A LIVE Q&amp;A</text><text x="385" y="709" fill="#f4f6f1" font-size="27" font-weight="500" text-anchor="start">Interactive response time and energy use need their own measurements.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: MLCommons · Aug 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
