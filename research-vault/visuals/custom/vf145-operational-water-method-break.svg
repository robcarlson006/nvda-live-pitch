<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">NVIDIA’s reporting change breaks the water trend</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Water withdrawal and consumption at NVIDIA operations · Cubic metres · FY25 and FY26</text>
<rect x="80" y="241" width="660" height="373" fill="#10150c" rx="12" stroke="#39452f"/>
<text x="116" y="313" fill="#f4f6f1" font-size="30" font-weight="750" text-anchor="start">FY25</text>
<line x1="116" x2="704" y1="347" y2="347" stroke="#39452f" stroke-width="2"/>
<text x="116" y="424" fill="#9aa094" font-size="27" font-weight="500" text-anchor="start">Withdrawal</text>
<text x="700" y="428" fill="#f4f6f1" font-size="49" font-weight="780" text-anchor="end">409,814</text>
<text x="116" y="532" fill="#9aa094" font-size="27" font-weight="500" text-anchor="start">Consumption</text>
<text x="700" y="536" fill="#f4f6f1" font-size="49" font-weight="780" text-anchor="end">141,772</text>
<rect x="860" y="241" width="660" height="373" fill="#10150c" rx="12" stroke="#39452f"/>
<text x="896" y="313" fill="#f4f6f1" font-size="30" font-weight="750" text-anchor="start">FY26</text>
<line x1="896" x2="1484" y1="347" y2="347" stroke="#39452f" stroke-width="2"/>
<text x="896" y="424" fill="#9aa094" font-size="27" font-weight="500" text-anchor="start">Withdrawal</text>
<text x="1480" y="428" fill="#b7f04a" font-size="49" font-weight="780" text-anchor="end">451,297</text>
<text x="896" y="532" fill="#9aa094" font-size="27" font-weight="500" text-anchor="start">Consumption</text>
<text x="1480" y="536" fill="#b7f04a" font-size="49" font-weight="780" text-anchor="end">105,531</text>
<line x1="800" x2="800" y1="241" y2="614" stroke="#e8b04a" stroke-width="3" stroke-dasharray="8 10"/>
<text x="800" y="699" fill="#e8b04a" font-size="30" font-weight="750" text-anchor="middle">Change in collection methods</text>
<text x="800" y="750" fill="#9aa094" font-size="26" font-weight="500" text-anchor="middle">NVIDIA says the latest figures cannot be compared with prior years.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Sustainability Reports · FY25 and FY26</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
