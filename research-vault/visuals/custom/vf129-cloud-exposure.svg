<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Cloud commitments and guarantees carry distinct risks</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Disclosed amounts in USD billions · August 2026 filing</text>
<rect x="80" y="236" width="706" height="348" fill="#10150c" rx="14" stroke="#313b2a" stroke-width="2"/><rect x="80" y="236" width="706" height="5" fill="#b7f04a" rx="2"/><text x="116" y="310" fill="#f4f6f1" font-size="30" font-weight="750" text-anchor="start">Cloud service commitments</text><text x="116" y="428" fill="#b7f04a" font-size="88" font-weight="800" text-anchor="start">$36bn</text><text x="116" y="500" fill="#f4f6f1" font-size="26" font-weight="500" text-anchor="start">Capacity NVIDIA committed to buy</text><text x="116" y="544" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start">Balance falls as capacity is used.</text><rect x="814" y="236" width="706" height="348" fill="#10150c" rx="14" stroke="#313b2a" stroke-width="2"/><rect x="814" y="236" width="706" height="5" fill="#e8b04a" rx="2"/><text x="850" y="310" fill="#f4f6f1" font-size="30" font-weight="750" text-anchor="start">OpenAI-related guarantee cap</text><text x="850" y="428" fill="#e8b04a" font-size="88" font-weight="800" text-anchor="start">$105bn</text><text x="850" y="500" fill="#f4f6f1" font-size="26" font-weight="500" text-anchor="start">Conditional backing for lease and power payments</text><text x="850" y="544" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start">Exposure falls as OpenAI pays.</text><rect x="80" y="634" width="1440" height="104" fill="#10150c" rx="12" stroke="#313b2a" stroke-width="2"/><rect x="80" y="634" width="5" height="104" fill="#e8b04a" rx="2"/><text x="110" y="672" fill="#e8b04a" font-size="23" font-weight="750" text-anchor="start">Adding the amounts would overstate what the filing tells us</text><text x="110" y="711" fill="#f4f6f1" font-size="27" font-weight="500" text-anchor="start">The filing gives no combined loss estimate. The guarantee is capped and contingent.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Form 10-Q, Aug 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
