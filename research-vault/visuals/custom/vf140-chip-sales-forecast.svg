<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">A strong chip forecast leaves room for a downturn</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Global semiconductor sales · US dollars · 2026 industry forecast</text>
<rect x="80" y="235" width="1440" height="335" rx="12" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="249" width="5" height="307" rx="2" fill="#76b900" stroke="none" stroke-width="2"/>
<text x="120" y="306" fill="#b7f04a" font-size="25" font-weight="750" text-anchor="start">GLOBAL CHIP SALES FORECAST</text>
<text x="114" y="460" fill="#b7f04a" font-size="105" font-weight="800" text-anchor="start">Above $1.5 trillion</text>
<line x1="119" x2="1480" y1="501" y2="501" stroke="#39452f" stroke-width="2"/>
<text x="120" y="546" fill="#9aa094" font-size="28" font-weight="550" text-anchor="start">SIA forecast for the full industry</text>
<rect x="80" y="628" width="1440" height="145" rx="12" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="642" width="5" height="117" rx="2" fill="#e8b04a" stroke="none" stroke-width="2"/>
<text x="120" y="686" fill="#f4f6f1" font-size="37" font-weight="750" text-anchor="start">NVIDIA still faces company-specific downside</text>
<text x="120" y="734" fill="#f4f6f1" font-size="27" font-weight="550" text-anchor="start">An industry sales forecast cannot establish NVIDIA’s future revenue or share-price returns.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Semiconductor Industry Association, 2026 State of the U.S. Semiconductor Industry</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
