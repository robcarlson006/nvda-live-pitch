<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Gulf AI power plans leave emissions unknown</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Announced capacity (MW or GW) · Saudi and UAE project plans · May 2025</text>
<rect x="80" y="216" width="560" height="448" fill="#10150c" stroke="#39452f" rx="14"/><rect x="670" y="216" width="850" height="448" fill="#12190d" stroke="#496522" rx="14"/><text x="111" y="268" font-size="22" fill="#9aa094" font-weight="750">SAUDI ARABIA · HUMAIN</text><text x="701" y="268" font-size="22" fill="#b7f04a" font-weight="750">ABU DHABI · UAE–U.S. AI CAMPUS</text><text x="110" y="375" font-size="62" fill="#f4f6f1" font-weight="790">Up to 500 MW</text><text x="112" y="427" font-size="29" fill="#9aa094" font-weight="600">Projected across AI factories</text><text x="700" y="375" font-size="62" fill="#b7f04a" font-weight="800">5 GW</text><text x="701" y="427" font-size="29" fill="#9aa094" font-weight="600">Planned campus capacity</text><rect x="701" y="467" width="786" height="155" fill="#1a2313" stroke="#5a7434" rx="14"/><text x="729" y="539" font-size="56" fill="#f4f6f1" font-weight="800">200 MW</text><text x="1010" y="535" font-size="32" fill="#f4f6f1" font-weight="680">First Stargate UAE cluster</text><text x="1010" y="580" font-size="27" fill="#9aa094" font-weight="600">Part of the campus plan</text><rect x="80" y="704" width="1440" height="108" fill="#16160e" stroke="#4a3c25" rx="14"/><rect x="80" y="704" width="5" height="108" fill="#e8b04a" stroke="none" rx="2"/><text x="108" y="743" font-size="28" fill="#e8b04a" font-weight="750">The UAE plan names nuclear, solar and gas</text><text x="108" y="783" font-size="27" fill="#f4f6f1" font-weight="550">The announcements give no shares for that power mix or measured operating emissions.</text>
