<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Isambard-AI’s annual resource use is unverified</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Facility electricity, water and power usage effectiveness in Bristol’s disclosures</text>
<rect x="80" y="218" width="1440" height="146" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="218" width="6" height="146" rx="14" fill="#76b900" stroke="none" stroke-width="2"/><text x="111" y="272" fill="#b7f04a" font-size="23" font-weight="750" text-anchor="start">ELECTRICITY</text><text x="486" y="273" fill="#f4f6f1" font-size="36" font-weight="750" text-anchor="start">Renewable supply reported</text><text x="486" y="324" fill="#c9cdc4" font-size="25" font-weight="500" text-anchor="start">Bristol gives no metered annual electricity total in the disclosures reviewed.</text><rect x="80" y="379" width="1440" height="146" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="379" width="6" height="146" rx="14" fill="#76b900" stroke="none" stroke-width="2"/><text x="111" y="433" fill="#b7f04a" font-size="23" font-weight="750" text-anchor="start">COOLING WATER</text><text x="486" y="434" fill="#f4f6f1" font-size="36" font-weight="750" text-anchor="start">Closed-loop cooling</text><text x="486" y="485" fill="#c9cdc4" font-size="25" font-weight="500" text-anchor="start">The same disclosures give no annual total for water withdrawals or consumption.</text><rect x="80" y="540" width="1440" height="146" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="540" width="6" height="146" rx="14" fill="#e8b04a" stroke="none" stroke-width="2"/><text x="111" y="594" fill="#e8b04a" font-size="23" font-weight="750" text-anchor="start">ENERGY EFFICIENCY</text><text x="486" y="595" fill="#f4f6f1" font-size="36" font-weight="750" text-anchor="start">About 1.08 PUE</text><text x="486" y="646" fill="#c9cdc4" font-size="25" font-weight="500" text-anchor="start">This compares total facility energy to IT equipment energy. The period is unspecified.</text>
<text x="82" y="760" font-size="27" fill="#c9cdc4">A facility profile cannot measure water at chip fabs or lifetime emissions from products in use.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: University of Bristol Isambard-AI disclosures, accessed Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
