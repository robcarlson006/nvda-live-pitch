<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Workstations and physical AI lifted Edge sales</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">NVIDIA Edge Computing revenue and reported growth · Q3 FY27</text>
<rect x="80" y="219" width="630" height="352" rx="14" fill="#10150c" stroke="#39452f"/><rect x="81" y="239" width="4" height="312" rx="2" fill="#76b900" stroke="none"/><text x="111" y="276" font-size="24" fill="#b7f04a" font-weight="740">EDGE COMPUTING REVENUE</text><text x="109" y="402" font-size="102" fill="#f4f6f1" font-weight="800">$8.2bn</text><text x="114" y="504" font-size="28" fill="#9aa094" font-weight="550">Q3 FY27 Edge Computing total</text><rect x="735" y="219" width="382" height="352" rx="14" fill="#10150c" stroke="#39452f"/><text x="766" y="276" font-size="23" fill="#9aa094" font-weight="740">QUARTER ON QUARTER</text><text x="763" y="402" font-size="85" fill="#f4f6f1" font-weight="770">+14%</text><text x="768" y="504" font-size="28" fill="#9aa094" font-weight="550">vs prior quarter</text><rect x="1142" y="219" width="378" height="352" rx="14" fill="#10150c" stroke="#39452f"/><text x="1173" y="276" font-size="23" fill="#9aa094" font-weight="740">YEAR ON YEAR</text><text x="1170" y="402" font-size="85" fill="#f4f6f1" font-weight="770">+42%</text><text x="1174" y="504" font-size="28" fill="#9aa094" font-weight="550">vs year-earlier quarter</text><rect x="80" y="685" width="1440" height="122" rx="14" fill="#17160e" stroke="#4a3c25"/>
<rect x="81" y="699" width="4" height="94" rx="2" fill="#e8b04a" stroke="none"/>
<text x="112" y="730" font-size="30" fill="#e8b04a" font-weight="750">Gaming is part of the Edge total</text>
<text x="112" y="775" font-size="27" fill="#f4f6f1" font-weight="550">Management cited Blackwell workstations and compute for physical AI as drivers of the quarterly increase.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Q3 FY27 earnings release and call · Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
