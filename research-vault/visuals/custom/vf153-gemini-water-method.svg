<svg role="img" aria-labelledby="chart-title chart-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="chart-title">Google estimates cooling water from energy</title>
<desc id="chart-desc">Serving energy (Wh) and cooling water (mL) per median Gemini Apps text prompt · May 2025</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Google estimates cooling water from energy</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Serving energy (Wh) and cooling water (mL) per median Gemini Apps text prompt · May 2025</text>
<rect x="80" y="230" width="432" height="332" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="108" y="258" width="42" height="4" rx="2" fill="#f4f6f1"/><text x="108" y="302" fill="#9aa094" font-size="22" font-weight="730">SERVING ENERGY</text><text x="108" y="381" fill="#f4f6f1" font-size="62" font-weight="800">0.24 Wh</text><text x="108" y="438" fill="#f4f6f1" font-size="29" font-weight="500">Energy used to serve the</text><text x="108" y="476" fill="#f4f6f1" font-size="29" font-weight="500">median text prompt.</text><rect x="584" y="230" width="432" height="332" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="612" y="258" width="42" height="4" rx="2" fill="#f4f6f1"/><text x="612" y="302" fill="#9aa094" font-size="22" font-weight="730">WATER PER UNIT OF ENERGY</text><text x="612" y="381" fill="#f4f6f1" font-size="51" font-weight="800">Fleet average</text><text x="612" y="438" fill="#f4f6f1" font-size="29" font-weight="500">Prior-year freshwater use</text><text x="612" y="476" fill="#f4f6f1" font-size="29" font-weight="500">per unit of fleet energy.</text><rect x="1088" y="230" width="432" height="332" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="1116" y="258" width="42" height="4" rx="2" fill="#b7f04a"/><text x="1116" y="302" fill="#9aa094" font-size="22" font-weight="730">ESTIMATED COOLING WATER</text><text x="1116" y="381" fill="#b7f04a" font-size="62" font-weight="800">0.26 mL</text><text x="1116" y="438" fill="#f4f6f1" font-size="29" font-weight="500">Calculated direct cooling</text><text x="1116" y="476" fill="#f4f6f1" font-size="29" font-weight="500">water per median prompt.</text><path d="M530 394h38m-11 -10 11 10-11 10" fill="none" stroke="#76b900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1034 394h38m-11 -10 11 10-11 10" fill="none" stroke="#76b900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="640" width="1440" height="142" rx="14" fill="#10150c" stroke="#65502d" stroke-width="2"/><text x="110" y="682" fill="#e8b04a" font-size="22" font-weight="750">MEASUREMENT BOUNDARY</text><text x="110" y="725" fill="#f4f6f1" font-size="26" font-weight="500">This covers direct cooling during serving. A lifecycle estimate uses a broader boundary.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Google Research, Aug 2025</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
