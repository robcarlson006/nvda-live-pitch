<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Regulatory hurdles ended NVIDIA’s Arm deal</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Cash retained and licence duration · deal termination, February 2022</text>
<rect x="80" y="204" width="700" height="421" rx="16" fill="#17160f" stroke="#303d29" stroke-width="2"/><line x1="83" y1="220" x2="83" y2="609" stroke="#e8b04a" stroke-width="6" stroke-linecap="round"/><text x="119" y="271" fill="#e8b04a" font-size="21" font-weight="740" text-anchor="start" letter-spacing="2">CASH PREPAYMENT</text><text x="112" y="438" fill="#e8b04a" font-size="119" font-weight="820" text-anchor="start" letter-spacing="-4">$1.25bn</text><text x="119" y="517" fill="#f4f6f1" font-size="34" font-weight="720" text-anchor="start" letter-spacing="0">SoftBank kept the prepayment</text><text x="119" y="565" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start" letter-spacing="0">Paid under the original purchase agreement</text><rect x="804" y="204" width="716" height="421" rx="16" fill="#111a0e" stroke="#303d29" stroke-width="2"/><line x1="807" y1="220" x2="807" y2="609" stroke="#76b900" stroke-width="6" stroke-linecap="round"/><text x="843" y="271" fill="#b7f04a" font-size="21" font-weight="740" text-anchor="start" letter-spacing="2">ARM LICENCE</text><text x="836" y="438" fill="#b7f04a" font-size="112" font-weight="820" text-anchor="start" letter-spacing="-3">20 years</text><text x="843" y="517" fill="#f4f6f1" font-size="34" font-weight="720" text-anchor="start" letter-spacing="0">NVIDIA retained its licence</text><text x="843" y="565" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start" letter-spacing="0">The proposed acquisition was abandoned</text><rect x="80" y="670" width="1440" height="106" rx="16" fill="#10150c" stroke="#303d29" stroke-width="2"/><line x1="83" y1="686" x2="83" y2="760" stroke="#e8b04a" stroke-width="5" stroke-linecap="round"/><text x="112" y="711" fill="#e8b04a" font-size="27" font-weight="750" text-anchor="start" letter-spacing="0">Why the deal fell through</text><text x="112" y="747" fill="#f4f6f1" font-size="25" font-weight="500" text-anchor="start" letter-spacing="0">The UK opened an in-depth competition and national security inquiry. NVIDIA cited regulatory challenges.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA and SoftBank, Feb 2022 · UK CMA, Nov 2021 and Feb 2022</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
