<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">NVIDIA’s reported emissions are mostly Scope 3</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">NVIDIA greenhouse gas inventory · metric tonnes CO₂e · FY26</text>
<text x="103" y="255" fill="#9aa094" font-size="22" font-weight="750" text-anchor="start">REPORTED SCOPE</text><text x="800" y="255" fill="#9aa094" font-size="22" font-weight="750" text-anchor="start">WHAT IT COVERS</text><text x="1495" y="255" fill="#9aa094" font-size="22" font-weight="750" text-anchor="end">TONNES CO₂e</text><rect x="80" y="280" width="1440" height="91" rx="8" fill="#10150c" stroke="#39452f" stroke-width="2"/><text x="104" y="336" fill="#f4f6f1" font-size="32" font-weight="700" text-anchor="start">Scope 1</text><text x="800" y="336" fill="#9aa094" font-size="25" font-weight="500" text-anchor="start">Direct emissions</text><text x="1495" y="338" fill="#f4f6f1" font-size="42" font-weight="800" text-anchor="end">9,822</text><rect x="80" y="386" width="1440" height="91" rx="8" fill="#10150c" stroke="#39452f" stroke-width="2"/><text x="104" y="442" fill="#f4f6f1" font-size="32" font-weight="700" text-anchor="start">Scope 2 · market-based</text><text x="800" y="442" fill="#9aa094" font-size="25" font-weight="500" text-anchor="start">Purchased energy · contracts and instruments</text><text x="1495" y="444" fill="#f4f6f1" font-size="42" font-weight="800" text-anchor="end">568</text><rect x="80" y="492" width="1440" height="91" rx="8" fill="#10150c" stroke="#39452f" stroke-width="2"/><text x="104" y="548" fill="#f4f6f1" font-size="32" font-weight="700" text-anchor="start">Scope 2 · location-based</text><text x="800" y="548" fill="#9aa094" font-size="25" font-weight="500" text-anchor="start">Purchased energy · local grid mix</text><text x="1495" y="550" fill="#e8b04a" font-size="42" font-weight="800" text-anchor="end">308,891</text><rect x="80" y="598" width="1440" height="91" rx="8" fill="#16200f" stroke="#76b900" stroke-width="2"/><text x="104" y="654" fill="#b7f04a" font-size="32" font-weight="700" text-anchor="start">Scope 3</text><text x="800" y="654" fill="#9aa094" font-size="25" font-weight="500" text-anchor="start">Reported value-chain categories</text><text x="1495" y="656" fill="#b7f04a" font-size="42" font-weight="800" text-anchor="end">10,700,940</text><rect x="80" y="706" width="1440" height="88" rx="8" fill="#10150c" stroke="#39452f" stroke-width="2"/><text x="105" y="748" fill="#9aa094" font-size="25" font-weight="600" text-anchor="start">The Scope 2 figures use alternative accounting methods. Read them separately.</text><text x="105" y="780" fill="#e8b04a" font-size="25" font-weight="600" text-anchor="start">The reported Scope 3 total excludes emissions from customers using sold products.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA FY26 Sustainability Report · fiscal year ended Jan 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
