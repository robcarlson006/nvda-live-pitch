<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>US licensing was active as new rules were discussed</title><desc>US export measures in NVIDIA’s August 2026 filing</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">US licensing was active as new rules were discussed</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">US export measures in NVIDIA’s August 2026 filing</text>
<rect x="80" y="207" width="1440" height="130" rx="12" fill="#10150c" stroke="#39452f"/>
<rect x="80" y="215" width="5" height="114" rx="2" fill="#b7f04a"/>
<text x="112" y="278" fill="#b7f04a" font-size="25" font-weight="750">LICENCES ISSUED</text>
<text x="452" y="259" fill="#f4f6f1" font-size="37" font-weight="800">H200 shipments</text>
<text x="452" y="302" fill="#c9cdc4" font-size="28" font-weight="500">US licences began in February 2026 for specific China customers.</text>
<rect x="80" y="360" width="1440" height="130" rx="12" fill="#10150c" stroke="#39452f"/>
<rect x="80" y="368" width="5" height="114" rx="2" fill="#e8b04a"/>
<text x="112" y="431" fill="#e8b04a" font-size="25" font-weight="750">REPLACEMENT PLAN</text>
<text x="452" y="412" fill="#f4f6f1" font-size="37" font-weight="800">AI Diffusion rule</text>
<text x="452" y="455" fill="#c9cdc4" font-size="28" font-weight="500">The US announced a replacement in May 2025. Its scope remained uncertain.</text>
<rect x="80" y="513" width="1440" height="130" rx="12" fill="#10150c" stroke="#39452f"/>
<rect x="80" y="521" width="5" height="114" rx="2" fill="#e8b04a"/>
<text x="112" y="584" fill="#e8b04a" font-size="25" font-weight="750">BILL UNDER REVIEW</text>
<text x="452" y="565" fill="#f4f6f1" font-size="37" font-weight="800">Remote Access Security Act</text>
<text x="452" y="608" fill="#c9cdc4" font-size="28" font-weight="500">The bill could restrict cloud services to firms with China-headquartered parents.</text>
<rect x="80" y="692" width="1440" height="112" rx="12" fill="#1b190e" stroke="#57472a"/>
<text x="112" y="735" fill="#e8b04a" font-size="23" font-weight="750">STATUS AT THE AUGUST FILING</text>
<text x="112" y="773" fill="#c9cdc4" font-size="27" font-weight="500">Confirm the final rule and effective date before making a current statement.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Q2 FY27 10-Q · Aug 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
