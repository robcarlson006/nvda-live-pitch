<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Water stress reaches facilities and fabs</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">NVIDIA facility withdrawals and Samsung site ratings  ·  FY25 and calendar 2025</text>
<rect x="80" y="220" width="520" height="468" rx="16" fill="#10150e" stroke="#39452f" stroke-width="2"/><text x="116" y="273" fill="#9aa094" font-size="23" font-weight="700" text-anchor="start">NVIDIA FACILITIES  /  FY25</text><text x="116" y="391" fill="#b7f04a" font-size="113" font-weight="800" text-anchor="start">23%</text><text x="116" y="459" fill="#f4f6f1" font-size="28" font-weight="500" text-anchor="start">of facility water withdrawals</text><text x="116" y="499" fill="#f4f6f1" font-size="28" font-weight="500" text-anchor="start">in high or extremely high</text><text x="116" y="539" fill="#f4f6f1" font-size="28" font-weight="500" text-anchor="start">water-stress areas</text><text x="116" y="642" fill="#9aa094" font-size="22" font-weight="500" text-anchor="start">WRI Aqueduct assessment</text><rect x="644" y="220" width="876" height="468" rx="16" fill="#10150e" stroke="#39452f" stroke-width="2"/><text x="680" y="273" fill="#9aa094" font-size="23" font-weight="700" text-anchor="start">SELECTED SAMSUNG SEMICONDUCTOR SITES  /  2025</text><text x="680" y="350" fill="#f4f6f1" font-size="27" font-weight="500" text-anchor="start">Xi’an and Suzhou, China</text><text x="1484" y="350" fill="#e8b04a" font-size="27" font-weight="750" text-anchor="end">Extremely high</text><line x1="680" y1="383" x2="1484" y2="383" stroke="#39452f" stroke-width="2"/><text x="680" y="442" fill="#f4f6f1" font-size="27" font-weight="500" text-anchor="start">Austin and Taylor, US</text><text x="1484" y="442" fill="#f4f6f1" font-size="27" font-weight="750" text-anchor="end">Medium-high</text><line x1="680" y1="475" x2="1484" y2="475" stroke="#39452f" stroke-width="2"/><text x="680" y="534" fill="#f4f6f1" font-size="27" font-weight="500" text-anchor="start">Korean sites in the disclosure</text><text x="1484" y="534" fill="#f4f6f1" font-size="27" font-weight="750" text-anchor="end">Medium-high</text><text x="680" y="642" fill="#9aa094" font-size="22" font-weight="500" text-anchor="start">Samsung’s site ratings cover its own operations.</text><rect x="80" y="730" width="1440" height="76" rx="16" fill="#201a0e" stroke="#66502a" stroke-width="2"/><text x="110" y="777" fill="#e8b04a" font-size="23" font-weight="600" text-anchor="start">NVIDIA’s facility figure excludes manufacturing at suppliers.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Sustainability Report, FY26 and Samsung Sustainability Report, Jun 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
