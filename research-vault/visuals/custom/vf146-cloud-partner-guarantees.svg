<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">NVIDIA backs some cloud partners’ leases</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Land, power and shell guarantees for selected AI cloud partners · July 2026</text>
<rect x="80" y="245" width="694" height="342" rx="16" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="267" width="6" height="298" rx="3" fill="#e8b04a"/><text x="120" y="320" fill="#9aa094" font-size="30" font-weight="700">Maximum gross exposure</text><text x="120" y="459" fill="#e8b04a" font-size="96" font-weight="800">$3.5bn</text><text x="120" y="526" fill="#9aa094" font-size="27" font-weight="500">If covered lease obligations default</text><rect x="826" y="245" width="694" height="342" rx="16" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="826" y="267" width="6" height="298" rx="3" fill="#76b900"/><text x="866" y="320" fill="#9aa094" font-size="30" font-weight="700">Escrow provided by partners</text><text x="866" y="459" fill="#b7f04a" font-size="96" font-weight="800">$712m</text><text x="866" y="526" fill="#9aa094" font-size="27" font-weight="500">Partial protection against potential losses</text><text x="80" y="763" fill="#9aa094" font-size="26" font-weight="500">NVIDIA disclosed the later SB Energy guarantee separately.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA quarterly filing · Aug 2026</text>
