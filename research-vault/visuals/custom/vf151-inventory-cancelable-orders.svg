<text x="80" y="333" font-size="29" fill="#9aa094" font-weight="650">Jan 2026 · fiscal year-end</text><rect x="465" y="291" width="425.65" height="62" rx="7" fill="#39452f"/><text x="910.6462088410029" y="333" font-size="36" fill="#f4f6f1" font-weight="750">$21,403m</text><text x="80" y="471" font-size="29" fill="#f4f6f1" font-weight="650">Oct 2026 · quarter-end</text><rect x="465" y="429" width="790.00" height="62" rx="7" fill="#76b900"/><text x="1275.0" y="471" font-size="36" fill="#b7f04a" font-weight="750">$39,724m</text><rect x="80" y="624" width="1440" height="139" rx="14" fill="#10150c" stroke="#65502d" stroke-width="2"/><text x="108" y="667" font-size="22" fill="#e8b04a" font-weight="750">CUSTOMER CANCELLATION RISK</text><text x="108" y="709" font-size="26" fill="#f4f6f1" font-weight="500">Customers can generally cancel, change or defer commitments at short notice without penalty.</text><text x="108" y="743" font-size="26" fill="#f4f6f1" font-weight="500">The inventory balance measures stock on hand. Potential write-downs remain unquantified.</text>
