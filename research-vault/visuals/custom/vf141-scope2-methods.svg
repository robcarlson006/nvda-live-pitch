none"/><text x="247.83883635327672" y="668" fill="#f4f6f1" font-size="26" font-weight="700" text-anchor="start">568</text><text x="80" y="782" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start">The methods describe the same purchased electricity and should be read separately.</text>
