<svg role="img" aria-labelledby="title description" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="title">Microsoft found paying customers for Copilot</title>
<desc id="description">Paid Copilot seats and Microsoft Cloud gross margin · Microsoft FY2026</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Microsoft found paying customers for Copilot</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Paid Copilot seats and Microsoft Cloud gross margin · Microsoft FY2026</text>
<rect x="80" y="224" width="702" height="454" rx="12" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="112" y="256" width="48" height="4" rx="2" fill="#76b900" stroke="none" stroke-width="2"/><text x="114" y="313" font-size="30" fill="#f4f6f1" font-weight="700" text-anchor="start">Paid Microsoft 365 Copilot seats</text><text x="112" y="459" font-size="96" fill="#b7f04a" font-weight="800" text-anchor="start">30m+</text><text x="114" y="537" font-size="26" fill="#aab2a5" font-weight="500" text-anchor="start">Reported at fiscal year-end</text><text x="114" y="575" font-size="26" fill="#aab2a5" font-weight="500" text-anchor="start">Direct evidence of paid adoption</text><rect x="814" y="224" width="706" height="454" rx="12" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="846" y="256" width="48" height="4" rx="2" fill="#39452f" stroke="none" stroke-width="2"/><text x="848" y="313" font-size="30" fill="#f4f6f1" font-weight="700" text-anchor="start">Microsoft Cloud gross margin</text><text x="846" y="459" font-size="96" fill="#f4f6f1" font-weight="800" text-anchor="start">66%</text><text x="848" y="537" font-size="26" fill="#aab2a5" font-weight="500" text-anchor="start">Blended across cloud services</text><text x="848" y="575" font-size="26" fill="#aab2a5" font-weight="500" text-anchor="start">Microsoft cited AI investment and usage</text><text x="848" y="613" font-size="26" fill="#aab2a5" font-weight="500" text-anchor="start">among the reasons it fell.</text><rect x="80" y="724" width="1440" height="76" rx="12" fill="#19190f" stroke="#413620" stroke-width="2"/><text x="110" y="772" font-size="26" fill="#e8b04a" font-weight="600" text-anchor="start">These figures leave AI investment returns unknown for Microsoft and its customers.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Microsoft FY2026 earnings and annual report, 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
