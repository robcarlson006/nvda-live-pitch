<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>Packaging expansion leaves Taiwan exposure</title><desc>Existing technology and announced packaging plans · November 2026</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Packaging expansion leaves Taiwan exposure</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Existing technology and announced packaging plans · November 2026</text>
<rect x="80" y="207" width="1440" height="130" rx="12" fill="#10150c" stroke="#39452f"/><rect x="80" y="215" width="5" height="114" rx="2" fill="#b7f04a" stroke="none"/><text x="112" y="278" fill="#b7f04a" font-size="25" font-weight="750">SHIPPING · RUBIN</text><text x="452" y="259" fill="#f4f6f1" font-size="37" font-weight="800">Vera Rubin uses TSMC packaging</text><text x="452" y="302" fill="#c9cdc4" font-size="28" font-weight="500">The shipped platform uses TSMC CoWoS advanced packaging.</text><rect x="80" y="360" width="1440" height="130" rx="12" fill="#10150c" stroke="#39452f"/><rect x="80" y="368" width="5" height="114" rx="2" fill="#9aa094" stroke="none"/><text x="112" y="431" fill="#9aa094" font-size="25" font-weight="750">EXPANDING · AMKOR</text><text x="452" y="412" fill="#f4f6f1" font-size="37" font-weight="800">Arizona and South Korea</text><text x="452" y="455" fill="#c9cdc4" font-size="28" font-weight="500">Nearly $3bn in multiyear agreements supports the expansion.</text><rect x="80" y="513" width="1440" height="130" rx="12" fill="#10150c" stroke="#39452f"/><rect x="80" y="521" width="5" height="114" rx="2" fill="#9aa094" stroke="none"/><text x="112" y="584" fill="#9aa094" font-size="25" font-weight="750">EXPANDING · SPIL</text><text x="452" y="565" fill="#f4f6f1" font-size="37" font-weight="800">More capacity in Taiwan</text><text x="452" y="608" fill="#c9cdc4" font-size="28" font-weight="500">The agreement expands Taiwan packaging dedicated to NVIDIA.</text><rect x="80" y="692" width="1440" height="112" rx="12" fill="#1b190e" stroke="#57472a"/><text x="112" y="735" fill="#e8b04a" font-size="23" font-weight="750">REPLACEMENT CAPACITY REMAINS UNQUANTIFIED</text><text x="112" y="773" fill="#c9cdc4" font-size="27" font-weight="500">The announcements give no volume of qualified capacity that could replace Taiwan supply.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Newsroom · Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
