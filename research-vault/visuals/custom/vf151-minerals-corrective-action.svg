<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>Smelters face a deadline to fix audit findings</title><desc>Months from enrolment in the extended corrective action programme</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Smelters face a deadline to fix audit findings</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Months from enrolment in the extended corrective action programme</text>
<rect x="80" y="236" width="690" height="320" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="108" y="262" width="42" height="4" rx="2" fill="#e8b04a"/><text x="108" y="311" font-size="23" fill="#9aa094" font-weight="700">EXTENDED CORRECTIVE ACTION</text><text x="108" y="397" font-size="64" fill="#e8b04a" font-weight="780">12 months</text><text x="108" y="454" font-size="28" fill="#f4f6f1" font-weight="500">From enrolment to close open</text><text x="108" y="491" font-size="28" fill="#f4f6f1" font-weight="500">non-conformances.</text><rect x="802" y="236" width="718" height="320" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="830" y="262" width="42" height="4" rx="2" fill="#f4f6f1"/><text x="830" y="311" font-size="23" fill="#9aa094" font-weight="700">IF THE DEADLINE IS MISSED</text><text x="830" y="397" font-size="55" fill="#f4f6f1" font-weight="780">Final warning</text><text x="830" y="454" font-size="28" fill="#f4f6f1" font-weight="500">Participation in the programme ends</text><text x="830" y="491" font-size="28" fill="#f4f6f1" font-weight="500">after the warning.</text><rect x="80" y="624" width="1440" height="139" rx="14" fill="#10150c" stroke="#65502d" stroke-width="2"/><text x="108" y="667" font-size="22" fill="#e8b04a" font-weight="750">WHAT THE AUDIT CHECKS</text><text x="108" y="709" font-size="26" fill="#f4f6f1" font-weight="500">Independent assessors review sourcing practices and management systems.</text><text x="108" y="743" font-size="26" fill="#f4f6f1" font-weight="500">Material in a finished chip remains unverified by this assessment.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Responsible Minerals Initiative · accessed Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
