<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Stargate UAE is one part of a larger campus</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Announced capacity in megawatts · each smaller project sits within the one above</text>
<text x="80" y="276" fill="#f4f6f1" font-size="30" font-weight="650" text-anchor="start">Wider UAE–U.S. AI Campus</text>
<rect x="680" y="245" width="650.0" height="46" rx="6" fill="#39452f" stroke="none" stroke-width="2"/>
<text x="1348.0" y="278" fill="#f4f6f1" font-size="32" font-weight="750" text-anchor="start">5,000 MW</text>
<text x="80" y="408" fill="#f4f6f1" font-size="30" font-weight="650" text-anchor="start">Stargate UAE cluster within campus</text>
<rect x="680" y="377" width="130.0" height="46" rx="6" fill="#76b900" stroke="none" stroke-width="2"/>
<text x="828.0" y="410" fill="#f4f6f1" font-size="32" font-weight="750" text-anchor="start">1,000 MW</text>
<text x="80" y="540" fill="#f4f6f1" font-size="30" font-weight="650" text-anchor="start">First phase within Stargate UAE</text>
<rect x="680" y="509" width="26.0" height="46" rx="6" fill="#e8b04a" stroke="none" stroke-width="2"/>
<text x="724.0" y="542" fill="#f4f6f1" font-size="32" font-weight="750" text-anchor="start">200 MW</text>
<line x1="80" y1="680" x2="1520" y2="680" stroke="#39452f" stroke-width="2"/>
<text x="80" y="734" fill="#f4f6f1" font-size="30" font-weight="650" text-anchor="start">G42 named NVIDIA as a supplier. The announcement gave no contract value.</text>
<text x="80" y="780" fill="#e8b04a" font-size="27" font-weight="600" text-anchor="start">G42 originally expected the first phase to go live in 2026.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: G42 Stargate UAE announcement · May 2025</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
