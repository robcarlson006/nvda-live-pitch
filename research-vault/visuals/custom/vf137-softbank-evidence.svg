<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">SoftBank deployed NVIDIA and evaluated AMD</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Deployment and evaluation announcements in Japan, 2026</text>
<rect x="80" y="232" width="704" height="350" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="232" width="704" height="5" rx="14" fill="#76b900" stroke="none" stroke-width="2"/><text x="112" y="290" fill="#b7f04a" font-size="22" font-weight="750" text-anchor="start">25 MAY 2026 · NVIDIA</text><text x="112" y="375" fill="#f4f6f1" font-size="54" font-weight="800" text-anchor="start">Deployed</text><text x="112" y="443" fill="#c9cdc4" font-size="28" font-weight="500" text-anchor="start">NVIDIA GB200 NVL72 was in SoftBank’s</text><text x="112" y="485" fill="#c9cdc4" font-size="28" font-weight="500" text-anchor="start">Japan data centres when the beta began.</text><rect x="816" y="232" width="704" height="350" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="816" y="232" width="704" height="5" rx="14" fill="#e8b04a" stroke="none" stroke-width="2"/><text x="848" y="290" fill="#e8b04a" font-size="22" font-weight="750" text-anchor="start">16 FEBRUARY 2026 · AMD</text><text x="848" y="375" fill="#f4f6f1" font-size="54" font-weight="800" text-anchor="start">Joint validation</text><text x="848" y="443" fill="#c9cdc4" font-size="28" font-weight="500" text-anchor="start">SoftBank and AMD began evaluating</text><text x="848" y="485" fill="#c9cdc4" font-size="28" font-weight="500" text-anchor="start">Instinct GPUs for future infrastructure.</text><rect x="80" y="692" width="1440" height="107" rx="14" fill="#191a10" stroke="#54452a" stroke-width="2"/><text x="109" y="734" fill="#e8b04a" font-size="24" font-weight="750" text-anchor="start">FUTURE ORDERS REMAIN OPEN</text><text x="109" y="771" fill="#c9cdc4" font-size="27" font-weight="500" text-anchor="start">The AMD announcement describes the start of an evaluation. SoftBank disclosed no order in that release.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: SoftBank Corp., 16 Feb and 25 May 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
