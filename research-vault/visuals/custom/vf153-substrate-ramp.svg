ill="#e8b04a" font-size="25" font-weight="720">Q1 2028</text><text x="1056" y="542" fill="#f4f6f1" font-size="25" font-weight="500">Plant target: 3× current capacity</text><rect x="80" y="640" width="1440" height="142" rx="14" fill="#10150c" stroke="#65502d" stroke-width="2"/><text x="110" y="682" fill="#e8b04a" font-size="22" font-weight="750">TAIWAN REMAINS PART OF THE EXPANSION</text><text x="110" y="725" fill="#f4f6f1" font-size="26" font-weight="500">NVIDIA announced additional Taiwanese projects alongside capacity in South Korea and Japan.</text>
