<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>Buyer categories can hide customer concentration</title><desc>Preliminary Data Center revenue estimate and indirect customers’ share of total revenue</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Buyer categories can hide customer concentration</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Preliminary Data Center revenue estimate and indirect customers’ share of total revenue</text>
<rect x="80" y="228" width="700" height="332" rx="16" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="108" y="258" width="40" height="4" rx="2" fill="#c9cdc4"/><text x="108" y="302" fill="#9aa094" font-size="26" font-weight="700" text-anchor="start">BLOOMBERG ESTIMATE · Q3 FY27</text><text x="106" y="391" fill="#c9cdc4" font-size="71" font-weight="800" text-anchor="start">$47.474bn</text><text x="108" y="449" fill="#f4f6f1" font-size="28" font-weight="500" text-anchor="start">AI clouds, industrial and enterprise</text><text x="108" y="486" fill="#f4f6f1" font-size="28" font-weight="500" text-anchor="start">reported as one preliminary revenue bucket.</text><rect x="820" y="228" width="700" height="332" rx="16" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="848" y="258" width="40" height="4" rx="2" fill="#e8b04a"/><text x="848" y="302" fill="#9aa094" font-size="26" font-weight="700" text-anchor="start">NVIDIA FILING · Q2 FY27</text><text x="846" y="391" fill="#e8b04a" font-size="71" font-weight="800" text-anchor="start">10% or more</text><text x="848" y="449" fill="#f4f6f1" font-size="28" font-weight="500" text-anchor="start">Share of total revenue for some</text><text x="848" y="486" fill="#f4f6f1" font-size="28" font-weight="500" text-anchor="start">individual indirect customers.</text><rect x="80" y="638" width="1440" height="108" rx="12" fill="#17170e" stroke="#3e3821" stroke-width="2"/><text x="106" y="683" fill="#e8b04a" font-size="23" font-weight="750" text-anchor="start">DISCLOSURE GAP</text><text x="385" y="683" fill="#f4f6f1" font-size="27" font-weight="500" text-anchor="start">The Bloomberg bucket has no split by buyer type. NVIDIA cites sovereign</text><text x="385" y="719" fill="#f4f6f1" font-size="27" font-weight="500" text-anchor="start">demand as a growth driver without disclosing its revenue.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Bloomberg FA · Nov 2026 | NVIDIA Form 10-Q · Aug 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
