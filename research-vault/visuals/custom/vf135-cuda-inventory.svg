<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">NVIDIA reported more than 300 CUDA libraries</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Company-reported inventory by category · 2024 annual review</text>
<rect x="80" y="222" width="464" height="363" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="240" width="5" height="327" rx="2" fill="#76b900"/><text x="108" y="340" fill="#b7f04a" font-size="52" font-weight="800" text-anchor="start">More than 300</text><text x="109" y="463" fill="#f4f6f1" font-size="35" font-weight="700" text-anchor="start">Libraries</text><rect x="568" y="222" width="464" height="363" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><text x="596" y="340" fill="#f4f6f1" font-size="91" font-weight="800" text-anchor="start">600</text><text x="597" y="463" fill="#f4f6f1" font-size="35" font-weight="700" text-anchor="start">AI models</text><rect x="1056" y="222" width="464" height="363" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><text x="1084" y="340" fill="#f4f6f1" font-size="91" font-weight="800" text-anchor="start">3,500</text><text x="1085" y="463" fill="#f4f6f1" font-size="35" font-weight="700" text-anchor="start">GPU-accelerated apps</text><rect x="80" y="667" width="1440" height="128" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="685" width="5" height="92" rx="2" fill="#e8b04a"/><text x="112" y="715" fill="#e8b04a" font-size="31" font-weight="760" text-anchor="start">The library count is a historical lower bound</text><text x="112" y="763" fill="#f4f6f1" font-size="27" font-weight="550" text-anchor="start">Libraries, models and accelerated applications are different categories. Keep their counts separate.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA annual review, 2024</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
