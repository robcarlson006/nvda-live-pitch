<svg role="img" aria-labelledby="chart-title" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="chart-title">UK chip export controls depend on the item and use</title>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">UK chip export controls depend on the item and use</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">China arms embargo and strategic export guidance · November 2026 snapshot</text>
<text x="112" y="225" fill="#9aa094" font-size="21" font-weight="750">CONTROL</text><text x="502" y="225" fill="#9aa094" font-size="21" font-weight="750">WHAT UK GUIDANCE SAYS</text><rect x="80" y="250" width="1440" height="83" rx="14" fill="#10150c" stroke="#39452f"/><rect x="80" y="265" width="5" height="53" rx="2" fill="#39452f"/><text x="112" y="302" fill="#f4f6f1" font-size="30" font-weight="750">Arms embargo</text><text x="502" y="302" fill="#f4f6f1" font-size="29" font-weight="550">Covers certain military items for mainland China, since 1989</text><rect x="80" y="353" width="1440" height="83" rx="14" fill="#10150c" stroke="#39452f"/><rect x="80" y="368" width="5" height="53" rx="2" fill="#76b900"/><text x="112" y="405" fill="#b7f04a" font-size="30" font-weight="750">Item classification</text><text x="502" y="405" fill="#f4f6f1" font-size="29" font-weight="550">UK controls cover listed dual-use goods, software and technology</text><rect x="80" y="456" width="1440" height="83" rx="14" fill="#10150c" stroke="#39452f"/><rect x="80" y="471" width="5" height="53" rx="2" fill="#39452f"/><text x="112" y="508" fill="#f4f6f1" font-size="30" font-weight="750">End-use controls</text><text x="502" y="508" fill="#f4f6f1" font-size="29" font-weight="550">Unlisted items can also require a licence, including for military end use</text><rect x="80" y="559" width="1440" height="83" rx="14" fill="#10150c" stroke="#39452f"/><rect x="80" y="574" width="5" height="53" rx="2" fill="#39452f"/><text x="112" y="611" fill="#f4f6f1" font-size="30" font-weight="750">Licence decisions</text><text x="502" y="611" fill="#f4f6f1" font-size="29" font-weight="550">Applications for mainland China are assessed case by case</text><rect x="80" y="724" width="1440" height="78" rx="14" fill="#1b190e" stroke="#39452f"/><rect x="80" y="739" width="5" height="48" rx="2" fill="#e8b04a"/><text x="112" y="772" fill="#e7ddc4" font-size="26" font-weight="550">A decision for a particular NVIDIA chip requires classification and end-use checks.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: UK Department for Business and Trade · guidance accessed November 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
