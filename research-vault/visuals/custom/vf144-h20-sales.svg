<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>NVIDIA reported no H20 sales to China-based buyers</title>
<desc>Reported H20 sales · US dollars · first half of FY26</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">NVIDIA reported no H20 sales to China-based buyers</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Reported H20 sales · US dollars · first half of FY26</text>
<rect x="80" y="239" width="700" height="344" rx="12" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="251" width="6" height="320" rx="5" fill="#39452f"/><text x="124" y="312" fill="#c9cdc4" font-size="31" font-weight="700" text-anchor="start">Q1 FY26</text><text x="124" y="456" fill="#c9cdc4" font-size="102" font-weight="800" text-anchor="start">$4.6bn</text><text x="124" y="517" fill="#c9cdc4" font-size="27" font-weight="500" text-anchor="start">H20 sales before the licence requirement</text><rect x="820" y="239" width="700" height="344" rx="12" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="820" y="251" width="6" height="320" rx="5" fill="#76b900"/><text x="864" y="312" fill="#b7f04a" font-size="31" font-weight="700" text-anchor="start">Q2 FY26</text><text x="864" y="456" fill="#b7f04a" font-size="102" font-weight="800" text-anchor="start">≈$650m</text><text x="864" y="517" fill="#c9cdc4" font-size="27" font-weight="500" text-anchor="start">Unrestricted H20 sales to one customer</text><text x="864" y="553" fill="#c9cdc4" font-size="27" font-weight="500" text-anchor="start">outside China</text><line x1="80" y1="662" x2="1520" y2="662" stroke="#39452f" stroke-width="2"/><text x="80" y="716" fill="#e8b04a" font-size="29" font-weight="650" text-anchor="start">NVIDIA reported no H20 sales to China-based customers in Q2.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA quarterly results · May and Aug 2025</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
