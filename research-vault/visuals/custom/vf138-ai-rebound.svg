<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>An efficiency scenario can’t measure AI rebound</title><desc>IEA high-efficiency scenario for global data centres · 2035 electricity, TWh</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">An efficiency scenario can’t measure AI rebound</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">IEA high-efficiency scenario for global data centres · 2035 electricity, TWh</text>
<rect x="80" y="224" width="704" height="385" rx="12" fill="#10150c" stroke="#39452f"/><rect x="82" y="226" width="700" height="5" rx="2" fill="#b7f04a" stroke="none"/><text x="114" y="280" fill="#b7f04a" font-size="23" font-weight="750">IEA SCENARIO · 2035</text><text x="114" y="390" fill="#f4f6f1" font-size="56" font-weight="800">About 970 TWh</text><text x="114" y="473" fill="#c9cdc4" font-size="30" font-weight="500">Global data-centre electricity demand</text><text x="114" y="515" fill="#c9cdc4" font-size="30" font-weight="500">with higher efficiency and the same</text><text x="114" y="557" fill="#c9cdc4" font-size="30" font-weight="500">demand for digital services and AI.</text><rect x="816" y="224" width="704" height="385" rx="12" fill="#10150c" stroke="#39452f"/><rect x="818" y="226" width="700" height="5" rx="2" fill="#e8b04a" stroke="none"/><text x="850" y="280" fill="#e8b04a" font-size="23" font-weight="750">EMPIRICAL AI REBOUND RATE</text><text x="850" y="390" fill="#f4f6f1" font-size="56" font-weight="800">Unverified</text><text x="850" y="473" fill="#c9cdc4" font-size="30" font-weight="500">A rebound estimate would measure</text><text x="850" y="515" fill="#c9cdc4" font-size="30" font-weight="500">how much extra usage offsets</text><text x="850" y="557" fill="#c9cdc4" font-size="30" font-weight="500">the energy saved by efficiency.</text><rect x="80" y="692" width="1440" height="112" rx="12" fill="#1b190e" stroke="#57472a"/><text x="112" y="735" fill="#e8b04a" font-size="23" font-weight="750">WHAT TO TRACK</text><text x="112" y="773" fill="#c9cdc4" font-size="27" font-weight="500">Track total electricity use and emissions alongside energy per task.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: IEA Energy and AI, Apr 2025 · Luccioni, Strubell and Crawford, Jun 2025</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
