<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">NVIDIA has board oversight of supplier labour</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Human rights governance and strategic-supplier audit coverage · FY26</text>
<rect x="80" y="231" width="694" height="360" rx="14" fill="#10150c" stroke="#39452f"/>
<rect x="81" y="251" width="4" height="320" rx="2" fill="#b7f04a" stroke="none"/>
<text x="112" y="279" font-size="24" fill="#b7f04a" font-weight="720">BOARD OVERSIGHT</text>
<text x="112" y="349" font-size="42" fill="#f4f6f1" font-weight="780">Governance committee</text>
<text x="112" y="408" font-size="30" fill="#9aa094" font-weight="550">Oversees human rights policy and</text>
<text x="112" y="451" font-size="30" fill="#9aa094" font-weight="550">practices and reports to the full board.</text>
<text x="112" y="494" font-size="30" fill="#9aa094" font-weight="550">It approved the forced labour statement.</text><rect x="800" y="231" width="720" height="360" rx="14" fill="#10150c" stroke="#39452f"/><text x="834" y="280" font-size="24" fill="#9aa094" font-weight="740">STRATEGIC SUPPLIER AUDITS</text><text x="833" y="420" font-size="105" fill="#b7f04a" font-weight="800">45%</text><text x="834" y="491" font-size="30" fill="#9aa094" font-weight="550">Share of strategic suppliers whose</text>
<text x="834" y="534" font-size="30" fill="#9aa094" font-weight="550">VAP audits NVIDIA reviewed in FY26.</text><rect x="80" y="685" width="1440" height="122" rx="14" fill="#17160e" stroke="#4a3c25"/>
<rect x="81" y="699" width="4" height="94" rx="2" fill="#e8b04a" stroke="none"/>
<text x="112" y="730" font-size="30" fill="#e8b04a" font-weight="750">What happened to affected workers?</text>
<text x="112" y="775" font-size="27" fill="#f4f6f1" font-weight="550">NVIDIA reported hiring fees and passport retention. Ask how many workers received full remedy.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA forced labour statement · FY26</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
