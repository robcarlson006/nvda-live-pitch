<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>Use NVIDIA’s reported free cash flow</title><desc>For FY26, cite NVIDIA’s $96,575 million in free cash flow, which deducts $101 million in principal payments.</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Use NVIDIA’s reported free cash flow</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">FY26 annual free cash flow · USD millions</text>
<rect x="80" y="242" width="701" height="282" rx="15" fill="#10150c" stroke="#3c5423" stroke-width="2"/><rect x="80" y="242" width="7" height="282" rx="4" fill="#76b900" stroke="none" stroke-width="2"/><text x="118" y="321" fill="#f4f6f1" font-size="34" font-weight="720" text-anchor="start">NVIDIA</text><text x="118" y="438" fill="#b7f04a" font-size="89" font-weight="810" text-anchor="start">$96,575m</text><rect x="819" y="242" width="701" height="282" rx="15" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="819" y="242" width="7" height="282" rx="4" fill="#64725a" stroke="none" stroke-width="2"/><text x="857" y="321" fill="#f4f6f1" font-size="34" font-weight="720" text-anchor="start">Bloomberg</text><text x="857" y="438" fill="#f4f6f1" font-size="89" font-weight="810" text-anchor="start">$96,676m</text><rect x="80" y="584" width="1440" height="141" rx="12" fill="#18170e" stroke="#4c4229" stroke-width="2"/><text x="113" y="640" fill="#f4f6f1" font-size="30" font-weight="500" text-anchor="start">NVIDIA deducts $101m in principal payments on property, equipment and intangibles.</text><text x="113" y="686" fill="#e8b04a" font-size="28" font-weight="500" text-anchor="start">Bloomberg’s calculation still needs verification.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA FY26 earnings release · Feb 2026 | Bloomberg FA export · Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
