<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Intel’s Gaudi claim measures connectivity</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Vendor I/O comparison and MLPerf workload-test criteria · November 2026 review</text>
<rect x="80" y="213" width="590" height="386" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="231" width="5" height="350" rx="2" fill="#76b900"/><text x="114" y="275" fill="#b7f04a" font-size="25" font-weight="750" text-anchor="start">INTEL SPECIFICATION</text><text x="110" y="414" fill="#b7f04a" font-size="105" font-weight="800" text-anchor="start">+33%</text><text x="114" y="482" fill="#f4f6f1" font-size="29" font-weight="550" text-anchor="start">I/O connectivity per accelerator</text><text x="114" y="529" fill="#f4f6f1" font-size="29" font-weight="550" text-anchor="start">Gaudi 3 versus NVIDIA H100</text><rect x="710" y="213" width="810" height="386" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><text x="744" y="279" fill="#f4f6f1" font-size="37" font-weight="760" text-anchor="start">What a workload comparison needs</text><circle cx="757" cy="356" r="5" fill="#76b900"/><text x="780" y="364" fill="#9aa094" font-size="27" font-weight="550" text-anchor="start">MLPerf Closed results using the same reference model</text><circle cx="757" cy="433" r="5" fill="#76b900"/><text x="780" y="441" fill="#9aa094" font-size="27" font-weight="550" text-anchor="start">The same benchmark scenario</text><circle cx="757" cy="510" r="5" fill="#76b900"/><text x="780" y="518" fill="#9aa094" font-size="27" font-weight="550" text-anchor="start">Comparable system availability</text><rect x="80" y="667" width="1440" height="128" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="685" width="5" height="92" rx="2" fill="#e8b04a"/><text x="112" y="715" fill="#e8b04a" font-size="31" font-weight="760" text-anchor="start">Matched workload result unavailable in the reviewed sources</text><text x="112" y="763" fill="#f4f6f1" font-size="27" font-weight="550" text-anchor="start">Interconnect bandwidth is one system specification. End-to-end throughput needs its own benchmark.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Intel Gaudi 3 specifications, accessed November 2026 · MLCommons, April 2025</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
