<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Google consumed most of the water it withdrew</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Average water consumption as a share of withdrawal · Google data centres · 2025 study</text>

<g transform="translate(395 465)">
  <circle r="192" fill="#10150c" stroke="#39452f" stroke-width="37"/>
  <path d="M0 -192 A192 192 0 1 1 -182.603 -59.331" fill="none" stroke="#76b900" stroke-width="37"/>
  <text y="23" fill="#b7f04a" font-size="106" font-weight="800" text-anchor="middle">80%</text>
  <text y="75" fill="#f4f6f1" font-size="30" font-weight="650" text-anchor="middle">Consumed</text>
</g>
<g transform="translate(760 329)">
  <rect width="760" height="271" rx="18" fill="#10150c" stroke="#39452f" stroke-width="2"/>
  <rect x="37" y="41" width="22" height="22" rx="4" fill="#76b900"/>
  <text x="78" y="61" fill="#f4f6f1" font-size="31" font-weight="750">Consumed</text>
  <text x="78" y="106" fill="#9aa094" font-size="26">Water withdrawn minus water returned.</text>
  <rect x="37" y="156" width="22" height="22" rx="4" fill="#39452f"/>
  <text x="78" y="176" fill="#f4f6f1" font-size="31" font-weight="750">Returned</text>
  <text x="78" y="221" fill="#9aa094" font-size="26">The rest of the water withdrawn.</text>
</g>

<text x="80" y="860" fill="#9aa094" font-size="19">Source: Google Research · August 2025</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
