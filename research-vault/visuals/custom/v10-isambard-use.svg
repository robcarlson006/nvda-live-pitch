<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">UK researchers are using Isambard-AI</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Research projects and users · first year to July 2026</text>
<rect x="80" y="204" width="700" height="411" rx="16" fill="#10150c" stroke="#303d29" stroke-width="2"/><text x="119" y="269" fill="#9aa094" font-size="21" font-weight="740" text-anchor="start" letter-spacing="2">RESEARCH PROJECTS</text><text x="119" y="350" fill="#9aa094" font-size="27" font-weight="750" text-anchor="start" letter-spacing="1">ABOUT</text><text x="107" y="478" fill="#f4f6f1" font-size="130" font-weight="810" text-anchor="start" letter-spacing="-5">1,000</text><text x="119" y="550" fill="#9aa094" font-size="28" font-weight="500" text-anchor="start" letter-spacing="0">Projects supported in the first year</text><rect x="804" y="204" width="716" height="411" rx="16" fill="#111a0e" stroke="#303d29" stroke-width="2"/><line x1="807" y1="222" x2="807" y2="597" stroke="#76b900" stroke-width="6" stroke-linecap="round"/><text x="843" y="269" fill="#b7f04a" font-size="21" font-weight="740" text-anchor="start" letter-spacing="2">USERS</text><text x="843" y="350" fill="#b7f04a" font-size="27" font-weight="750" text-anchor="start" letter-spacing="1">MORE THAN</text><text x="831" y="478" fill="#b7f04a" font-size="130" font-weight="810" text-anchor="start" letter-spacing="-5">4,000</text><text x="843" y="550" fill="#9aa094" font-size="28" font-weight="500" text-anchor="start" letter-spacing="0">Users involved in the first year</text><rect x="80" y="664" width="1440" height="106" rx="16" fill="#10150c" stroke="#303d29" stroke-width="2"/><line x1="83" y1="680" x2="83" y2="754" stroke="#b7f04a" stroke-width="5" stroke-linecap="round"/><text x="112" y="705" fill="#b7f04a" font-size="27" font-weight="750" text-anchor="start" letter-spacing="0">Demand exceeded available access</text><text x="112" y="741" fill="#f4f6f1" font-size="25" font-weight="500" text-anchor="start" letter-spacing="0">Bristol says every call for access was oversubscribed.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: University of Bristol, Jul 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
