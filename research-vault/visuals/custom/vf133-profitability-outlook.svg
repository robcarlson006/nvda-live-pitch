<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">GAAP gross margin (%) and operating expenses (USD billions) · FY27</text>
<rect x="80" y="210" width="705" height="455" fill="#10150c" stroke="#39452f" rx="14"/><text x="110" y="266" font-size="37" fill="#f4f6f1" font-weight="750">GAAP gross margin</text><text x="110" y="336" font-size="22" fill="#9aa094" font-weight="750">Q3 FY27 reported</text><text x="110" y="383" font-size="44" fill="#f4f6f1" font-weight="800">74.8%</text><rect x="110" y="403" width="615" height="13" fill="#22291d" stroke="none" rx="5"/><rect x="110" y="403" width="460.02" height="13" fill="#687362" stroke="none" rx="5"/><text x="110" y="476" font-size="22" fill="#9aa094" font-weight="750">Q4 FY27 guidance</text><text x="110" y="523" font-size="44" fill="#e8b04a" font-weight="800">71–72%</text><rect x="110" y="543" width="615" height="13" fill="#22291d" stroke="none" rx="5"/><rect x="110" y="543" width="436.65" height="13" fill="#e8b04a" stroke="none" rx="5"/><path d="M552.8 536 L552.8 563" stroke="#e8b04a" stroke-width="3"/><rect x="815" y="210" width="705" height="455" fill="#10150c" stroke="#39452f" rx="14"/><text x="845" y="266" font-size="37" fill="#f4f6f1" font-weight="750">GAAP operating expenses</text><text x="845" y="336" font-size="22" fill="#9aa094" font-weight="750">Q3 FY27 reported</text><text x="845" y="383" font-size="44" fill="#f4f6f1" font-weight="800">$9.2bn</text><rect x="845" y="403" width="615" height="13" fill="#22291d" stroke="none" rx="5"/><rect x="845" y="403" width="471.5" height="13" fill="#687362" stroke="none" rx="5"/><text x="845" y="476" font-size="22" fill="#9aa094" font-weight="750">Q4 FY27 guidance</text><text x="845" y="523" font-size="44" fill="#e8b04a" font-weight="800">≈$11bn</text><rect x="845" y="543" width="615" height="13" fill="#22291d" stroke="none" rx="5"/><rect x="845" y="543" width="563.75" height="13" fill="#e8b04a" stroke="none" rx="5"/><rect x="80" y="704" width="1440" height="108" fill="#16160e" stroke="#4a3c25" rx="14"/><rect x="80" y="704" width="5" height="108" fill="#e8b04a" stroke="none" rx="2"/><text x="108" y="743" font-size="28" fill="#e8b04a" font-weight="750">The next quarter includes an extra week and transition costs</text><text x="108" y="783" font-size="27" fill="#f4f6f1" font-weight="550">NVIDIA did not quantify how much of the expense increase will recur.</text>
