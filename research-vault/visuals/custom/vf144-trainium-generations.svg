<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>AWS reports higher throughput for Trainium3</title>
<desc>AWS hardware ratings · multiples of Trainium2 · accessed Nov 2026</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">AWS reports higher throughput for Trainium3</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">AWS hardware ratings · multiples of Trainium2 · accessed Nov 2026</text>
<text x="80" y="335" fill="#f4f6f1" font-size="29" font-weight="650" text-anchor="start">Memory bandwidth</text><rect x="542" y="300" width="663.0" height="56" rx="5" fill="#76b900"/><text x="1217.0" y="339" fill="#b7f04a" font-size="31" font-weight="750" text-anchor="start">1.7×</text><text x="80" y="488" fill="#f4f6f1" font-size="29" font-weight="650" text-anchor="start">MXFP8 compute throughput</text><rect x="542" y="453" width="780" height="56" rx="5" fill="#39452f"/><text x="1334" y="492" fill="#b7f04a" font-size="31" font-weight="750" text-anchor="start">Up to 2×</text><line x1="932" y1="267" x2="932" y2="553" stroke="#c9cdc4" stroke-width="2"/><text x="932" y="243" fill="#c9cdc4" font-size="24" font-weight="650" text-anchor="middle">Trainium2 baseline</text><line x1="80" y1="653" x2="1520" y2="653" stroke="#39452f" stroke-width="2"/><text x="80" y="711" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start">The figures describe hardware. Workload tests would show speed, cost and energy use.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Amazon Web Services, Trainium product page · accessed Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
