<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Rubin’s efficiency claim is workload-specific</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Tokens per megawatt · Vera Rubin NVL72 vs Blackwell GB200 NVL72 · January 2026</text>
<rect x="80" y="225" width="650" height="460" rx="18" fill="#10150c" stroke="#39452f" stroke-width="2" stroke-dasharray=""/><rect x="80" y="225" width="7" height="460" rx="8" fill="#76b900" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="132" y="303" fill="#b7f04a" font-size="23" font-weight="750" text-anchor="start">NVIDIA’S CLAIM</text><text x="126" y="477" fill="#b7f04a" font-size="118" font-weight="800" text-anchor="start">Up to 10×</text><text x="132" y="548" fill="#f4f6f1" font-size="33" font-weight="700" text-anchor="start">as many tokens per megawatt</text><text x="132" y="607" fill="#9aa094" font-size="26" font-weight="550" text-anchor="start">Kimi-K2-Thinking inference workload</text><text x="132" y="645" fill="#9aa094" font-size="26" font-weight="550" text-anchor="start">at comparable user interactivity</text><text x="804" y="296" fill="#f4f6f1" font-size="35" font-weight="750" text-anchor="start">What to ask for in a benchmark</text><path d="M804 345H1519V345" fill="none" stroke="#39452f" stroke-width="2"/><text x="804" y="387" fill="#f4f6f1" font-size="30" font-weight="700" text-anchor="start">Same workload and quality target</text><text x="804" y="425" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start">Match the model, scenario and precision.</text><path d="M804 465H1519V465" fill="none" stroke="#39452f" stroke-width="2"/><text x="804" y="507" fill="#f4f6f1" font-size="30" font-weight="700" text-anchor="start">Whole-system power at the wall</text><text x="804" y="545" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start">Measure it during the performance run.</text><path d="M804 585H1519V585" fill="none" stroke="#39452f" stroke-width="2"/><text x="804" y="627" fill="#e8b04a" font-size="30" font-weight="700" text-anchor="start">Electricity use across all workloads</text><text x="804" y="665" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start">Total demand can rise as use expands.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Technical Blog · 5 Jan 2026 • MLCommons, MLPerf Inference power methodology</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
