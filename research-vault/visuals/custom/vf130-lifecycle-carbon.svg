<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">AI hardware has a manufacturing footprint</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Modelled carbon split for large-scale workloads at Facebook  ·  2021 study</text>
<rect x="80" y="218" width="1440" height="462" rx="16" fill="#10150e" stroke="#39452f" stroke-width="2"/><text x="116" y="271" fill="#9aa094" font-size="23" font-weight="700" text-anchor="start">MODELLED SHARE OF THE CARBON FOOTPRINT</text><rect x="120" y="344" width="1360" height="155" rx="14" fill="#76b900"/><path d="M134 344 H528.0 V499 H134 Q120 499 120 485 V358 Q120 344 134 344Z" fill="#e8b04a"/><text x="324" y="447" fill="#17140d" font-size="65" font-weight="800" text-anchor="middle">~30%</text><text x="1004" y="447" fill="#0b0d0a" font-size="65" font-weight="800" text-anchor="middle">~70%</text><text x="324" y="558" fill="#e8b04a" font-size="32" font-weight="750" text-anchor="middle">Embodied</text><text x="1004" y="558" fill="#b7f04a" font-size="32" font-weight="750" text-anchor="middle">Operational</text><text x="324" y="602" fill="#9aa094" font-size="24" font-weight="500" text-anchor="middle">Hardware footprint proxy</text><text x="1004" y="602" fill="#9aa094" font-size="24" font-weight="500" text-anchor="middle">Location-based electricity</text><rect x="80" y="730" width="1440" height="76" rx="16" fill="#201a0e" stroke="#66502a" stroke-width="2"/><text x="110" y="777" fill="#e8b04a" font-size="23" font-weight="600" text-anchor="start">The split depends on hardware lifetime, utilisation and the local power mix.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Wu et al., Sustainable AI, Nov 2021</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
