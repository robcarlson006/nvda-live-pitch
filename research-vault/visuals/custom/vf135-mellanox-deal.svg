<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Mellanox brought networking into NVIDIA</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Acquisition terms in USD billions · announcement and closing</text>
<rect x="80" y="216" width="700" height="293" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><text x="114" y="276" fill="#9aa094" font-size="26" font-weight="750" text-anchor="start">MARCH 2019 AGREEMENT</text><text x="110" y="398" fill="#f4f6f1" font-size="94" font-weight="800" text-anchor="start">≈$6.9bn</text><text x="114" y="464" fill="#9aa094" font-size="30" font-weight="550" text-anchor="start">Announced enterprise value</text><rect x="820" y="216" width="700" height="293" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="820" y="234" width="5" height="257" rx="2" fill="#76b900"/><text x="854" y="276" fill="#b7f04a" font-size="26" font-weight="750" text-anchor="start">APRIL 2020 CLOSE</text><text x="850" y="398" fill="#b7f04a" font-size="94" font-weight="800" text-anchor="start">$7bn</text><text x="854" y="464" fill="#9aa094" font-size="30" font-weight="550" text-anchor="start">Reported transaction value</text><text x="114" y="580" fill="#f4f6f1" font-size="34" font-weight="760" text-anchor="start">The strategic rationale was to integrate compute and networking.</text><text x="114" y="627" fill="#9aa094" font-size="29" font-weight="550" text-anchor="start">Mellanox supplied InfiniBand and high-speed Ethernet interconnects.</text><rect x="80" y="680" width="1440" height="128" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="698" width="5" height="92" rx="2" fill="#e8b04a"/><text x="112" y="728" fill="#e8b04a" font-size="31" font-weight="760" text-anchor="start">The announcements explain the strategy</text><text x="112" y="776" fill="#f4f6f1" font-size="27" font-weight="550" text-anchor="start">They give deal values and the stated rationale. The return on the deal requires separate evidence.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Newsroom, March 2019 and April 2020</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
