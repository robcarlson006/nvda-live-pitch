<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Capacity plans extend beyond packaging</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">NVIDIA and supplier capacity targets · October 2026 announcement</text>
<rect x="80" y="214" width="1440" height="451" fill="#10150c" stroke="#39452f" rx="14"/><text x="110" y="270" font-size="22" fill="#9aa094" font-weight="750">BOTTLENECK</text><text x="660" y="270" font-size="22" fill="#9aa094" font-weight="750">CAPACITY TARGET</text><text x="1030" y="270" font-size="22" fill="#9aa094" font-weight="750">TARGET WINDOW</text><path d="M110 305 L1485 305" stroke="#39452f" stroke-width="2"/><text x="110" y="360" font-size="36" fill="#f4f6f1" font-weight="700">Package substrates</text><text x="660" y="360" font-size="36" fill="#b7f04a" font-weight="750">2.5× capacity</text><text x="1030" y="360" font-size="33" fill="#9aa094" font-weight="600">Over three years</text><path d="M110 419 L1485 419" stroke="#39452f" stroke-width="2"/><text x="110" y="474" font-size="36" fill="#f4f6f1" font-weight="700">Semiconductor testing</text><text x="660" y="474" font-size="36" fill="#b7f04a" font-weight="750">Double capacity</text><text x="1030" y="474" font-size="33" fill="#9aa094" font-weight="600">Calendar 2026 to 2027</text><path d="M110 533 L1485 533" stroke="#39452f" stroke-width="2"/><text x="110" y="588" font-size="36" fill="#f4f6f1" font-weight="700">Optical engines in Taiwan</text><text x="660" y="588" font-size="36" fill="#b7f04a" font-weight="750">15× capacity</text><text x="1030" y="588" font-size="33" fill="#9aa094" font-weight="600">By mid-2027</text><rect x="80" y="704" width="1440" height="108" fill="#16160e" stroke="#4a3c25" rx="14"/><rect x="80" y="704" width="5" height="108" fill="#e8b04a" stroke="none" rx="2"/><text x="108" y="743" font-size="28" fill="#e8b04a" font-weight="750">Each target covers a different piece of the supply chain</text><text x="108" y="783" font-size="27" fill="#f4f6f1" font-weight="550">The multiples use separate baselines and the added volumes are yet to be verified.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Newsroom · Oct 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
