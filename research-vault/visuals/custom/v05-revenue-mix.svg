<rect x="80" y="276" width="664.32" height="76" rx="10" fill="#76b900" stroke="none"/>
<text x="770.32" y="331" fill="#b7f04a" font-size="46" font-weight="800" text-anchor="start">51.9%</text>
<text x="80" y="442" fill="#f4f6f1" font-size="34" font-weight="750" text-anchor="start">All other sales</text>
<rect x="80" y="460" width="1280" height="76" rx="10" fill="#10150c" stroke="#39452f"/>
<rect x="80" y="460" width="615.68" height="76" rx="10" fill="#546449" stroke="none"/>
<text x="721.68" y="515" fill="#f4f6f1" font-size="46" font-weight="800" text-anchor="start">48.1%</text>
<rect x="80" y="751" width="1440" height="62" rx="10" fill="#10150c" stroke="#39452f"/><text x="108" y="790" fill="#9aa094" font-size="24" font-weight="600" text-anchor="start">The other-sales bucket spans all other NVIDIA revenue, including sales outside Data Center.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Bloomberg FA · Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
