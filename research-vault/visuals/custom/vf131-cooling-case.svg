<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title subtitle" font-family="'Archivo', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="title">Machine learning cut cooling energy at one site</title><desc id="subtitle">Reduction in cooling energy and PUE overhead · Google data centre case study · 2016</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/><rect width="10" height="900" fill="#76b900"/>
<text x="80" y="96" font-size="54" fill="#f4f6f1" font-weight="800" text-anchor="start">Machine learning cut cooling energy at one site</text>
<text x="80" y="151" font-size="28" fill="#aab2a5" font-weight="500" text-anchor="start">Reduction in cooling energy and PUE overhead · Google data centre case study · 2016</text>
<rect x="80" y="244" width="696" height="406" rx="12" fill="#10150c" stroke="#34412c" stroke-width="2"/><rect x="114" y="276" width="48" height="4" rx="2" fill="#76b900" stroke="none" stroke-width="2"/><text x="114" y="332" font-size="29" fill="#f4f6f1" font-weight="700" text-anchor="start">Cooling energy</text><text x="114" y="464" font-size="95" fill="#b7f04a" font-weight="800" text-anchor="start">40% lower</text><text x="114" y="532" font-size="25" fill="#aab2a5" font-weight="500" text-anchor="start">Electricity used by the cooling system</text><rect x="824" y="244" width="696" height="406" rx="12" fill="#10150c" stroke="#34412c" stroke-width="2"/><rect x="858" y="276" width="48" height="4" rx="2" fill="#aab2a5" stroke="none" stroke-width="2"/><text x="858" y="332" font-size="29" fill="#f4f6f1" font-weight="700" text-anchor="start">Power usage overhead</text><text x="858" y="464" font-size="95" fill="#f4f6f1" font-weight="800" text-anchor="start">15% lower</text><text x="858" y="532" font-size="25" fill="#aab2a5" font-weight="500" text-anchor="start">PUE overhead after accounting for losses</text><text x="858" y="570" font-size="25" fill="#aab2a5" font-weight="500" text-anchor="start">and other non-cooling uses</text><rect x="80" y="706" width="1440" height="76" rx="12" fill="#19190f" stroke="#413620" stroke-width="2"/><text x="112" y="755" font-size="25" fill="#e8b04a" font-weight="600" text-anchor="start">Both figures describe one site. Total facility electricity savings were not quantified here.</text>
<line x1="80" y1="824" x2="1520" y2="824" stroke="#34412c" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="863" font-size="20" fill="#aab2a5" font-weight="500" text-anchor="start">Google DeepMind, Jul 2016</text>
<text x="1520" y="863" font-size="18" fill="#aab2a5" font-weight="700" text-anchor="end">NVDA · RESEARCH VAULT</text>
</svg>
