<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">External use of CDP scores needs written consent</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">CDP corporate climate scores · website policy reviewed November 2026</text>

<g fill="#10150c" stroke="#39452f" stroke-width="2">
  <rect x="80" y="232" width="700" height="335" rx="12"/>
  <rect x="820" y="232" width="700" height="335" rx="12"/>
  <rect x="80" y="626" width="1440" height="146" rx="12"/>
</g>
<rect x="820" y="246" width="5" height="307" rx="2" fill="#e8b04a"/>
<g font-size="24" font-weight="750">
  <text x="118" y="301" fill="#9aa094">INTERNAL AND NON-COMMERCIAL</text>
  <text x="858" y="301" fill="#e8b04a">EXTERNAL OR COMMERCIAL</text>
</g>
<g font-size="65" font-weight="800">
  <text x="116" y="418" fill="#f4f6f1">Permitted</text>
  <text x="856" y="418" fill="#e8b04a">Consent required</text>
</g>
<g fill="#f4f6f1" font-size="28" font-weight="550">
  <text x="118" y="493">CDP’s exception covers uses</text>
  <text x="118" y="530">that meet both conditions.</text>
  <text x="858" y="493">Request written permission</text>
  <text x="858" y="530">from CDP before use.</text>
  <text x="118" y="733" font-size="27">The same reuse policy applies to publicly available scores.</text>
</g>
<text x="118" y="685" fill="#b7f04a" font-size="32" font-weight="750">Next public release scheduled for 2 December 2026</text>

<text x="80" y="860" fill="#9aa094" font-size="19">Source: CDP Scores and A Lists and Website Terms, accessed 25 November 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
