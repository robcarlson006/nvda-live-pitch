<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>The EU AI Act applies by role and use</title><desc>European Commission guidance · model and transparency milestones · 2025–2026</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">The EU AI Act applies by role and use</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">European Commission guidance · model and transparency milestones · 2025–2026</text>
<line x1="119" y1="251" x2="119" y2="516" stroke="#39452f" stroke-width="5"/><circle cx="119" cy="255" r="13" fill="#9aa094"/><text x="165" y="265" fill="#9aa094" font-size="46" font-weight="800" text-anchor="start">Aug 2025</text><text x="165" y="324" fill="#f4f6f1" font-size="39" font-weight="750" text-anchor="start">General-purpose AI model rules</text><text x="165" y="373" fill="#f4f6f1" font-size="29" font-weight="500" text-anchor="start">Providers of models posing systemic risks should assess and mitigate them.</text><circle cx="119" cy="486" r="13" fill="#76b900"/><text x="165" y="496" fill="#b7f04a" font-size="46" font-weight="800" text-anchor="start">Aug 2026</text><text x="165" y="555" fill="#f4f6f1" font-size="39" font-weight="750" text-anchor="start">Transparency rules</text><text x="165" y="604" fill="#f4f6f1" font-size="29" font-weight="500" text-anchor="start">Generative AI providers must make generated content identifiable.</text><rect x="80" y="685" width="1440" height="72" rx="12" fill="#17170e" stroke="#3e3821" stroke-width="2"/><text x="106" y="730" fill="#e8b04a" font-size="23" font-weight="750" text-anchor="start">FOR THIS PITCH</text><text x="385" y="730" fill="#f4f6f1" font-size="27" font-weight="500" text-anchor="start">Which duties apply depends on how the system is used and who provides or deploys it.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: European Commission, AI Act guidance · accessed Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
