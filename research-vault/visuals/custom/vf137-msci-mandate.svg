<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">MSCI World has no ESG objective</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Benchmark mandate and NVIDIA index weight, October 2026</text>
