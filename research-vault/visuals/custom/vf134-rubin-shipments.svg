<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">NVIDIA says Rubin entered volume shipments</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Vera Rubin platform · launch guidance and company-reported shipment milestone</text>
<rect x="80" y="238" width="694" height="346" rx="14" fill="#10150c" stroke="#39452f"/>
<rect x="81" y="258" width="4" height="306" rx="2" fill="#9aa094" stroke="none"/>
<text x="112" y="286" font-size="24" fill="#9aa094" font-weight="720">5 JANUARY 2026</text>
<text x="112" y="356" font-size="42" fill="#f4f6f1" font-weight="780">Launch guidance</text>
<text x="112" y="415" font-size="30" fill="#9aa094" font-weight="550">NVIDIA said Rubin was in production</text>
<text x="112" y="458" font-size="30" fill="#9aa094" font-weight="550">and expected products from partners</text>
<text x="112" y="501" font-size="30" fill="#9aa094" font-weight="550">in the second half of the year.</text><rect x="800" y="238" width="720" height="346" rx="14" fill="#10150c" stroke="#39452f"/>
<rect x="801" y="258" width="4" height="306" rx="2" fill="#b7f04a" stroke="none"/>
<text x="832" y="286" font-size="24" fill="#b7f04a" font-weight="720">Q3 FY27</text>
<text x="832" y="356" font-size="42" fill="#f4f6f1" font-weight="780">Volume shipments</text>
<text x="832" y="415" font-size="30" fill="#9aa094" font-weight="550">NVIDIA said Vera Rubin rack systems</text>
<text x="832" y="458" font-size="30" fill="#9aa094" font-weight="550">and Vera CPUs began shipping in</text>
<text x="832" y="501" font-size="30" fill="#9aa094" font-weight="550">volume during the quarter.</text><rect x="80" y="685" width="1440" height="122" rx="14" fill="#17160e" stroke="#4a3c25"/>
<rect x="81" y="699" width="4" height="94" rx="2" fill="#e8b04a" stroke="none"/>
<text x="112" y="730" font-size="30" fill="#e8b04a" font-weight="750">Deployment remains unquantified</text>
<text x="112" y="775" font-size="27" fill="#f4f6f1" font-weight="550">The shipment disclosure gives no count of systems installed at customer sites or paid for.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Newsroom · Jan and Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
