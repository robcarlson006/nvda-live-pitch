<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">AI chip share depends on what gets counted</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Market definitions and submitted systems · evidence reviewed Nov 2026</text>
<rect x="80" y="220" width="1440" height="126" rx="10" fill="#10150d" stroke="#26331d" stroke-width="2"/><text x="113" y="277" fill="#f4f6f1" font-size="31" font-weight="760" text-anchor="start">Merchant GPUs</text><text x="552" y="272" fill="#f4f6f1" font-size="30" font-weight="740" text-anchor="start">GPUs sold commercially</text><text x="552" y="311" fill="#9aa094" font-size="24" font-weight="500" text-anchor="start">Cloud providers’ custom chips can sit outside this count.</text><rect x="80" y="365" width="1440" height="126" rx="10" fill="#10150d" stroke="#76b900" stroke-width="2"/><text x="113" y="422" fill="#b7f04a" font-size="31" font-weight="760" text-anchor="start">All AI accelerators</text><text x="552" y="417" fill="#f4f6f1" font-size="30" font-weight="740" text-anchor="start">GPUs and purpose-built accelerators</text><text x="552" y="456" fill="#9aa094" font-size="24" font-weight="500" text-anchor="start">Ask how in-house chips are counted and whether the share is by revenue or units.</text><rect x="80" y="510" width="1440" height="126" rx="10" fill="#10150d" stroke="#26331d" stroke-width="2"/><text x="113" y="567" fill="#f4f6f1" font-size="31" font-weight="760" text-anchor="start">Benchmark submissions</text><text x="552" y="562" fill="#f4f6f1" font-size="30" font-weight="740" text-anchor="start">153 systems in the MLPerf round</text><text x="552" y="601" fill="#9aa094" font-size="24" font-weight="500" text-anchor="start">The submissions include NVIDIA, AMD and Google hardware.</text><rect x="80" y="741" width="1440" height="70" rx="10" fill="#10150d" stroke="#26331d" stroke-width="2"/><rect x="80" y="741" width="5" height="70" rx="2" fill="#e8b04a"/><text x="111" y="784" fill="#f4f6f1" font-size="25" font-weight="500" text-anchor="start">A current share of all AI accelerators remains unverified.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: MLCommons · MLPerf Training, accessed Nov 2026 | AWS and Meta chip disclosures</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
