<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Avoided emissions belong in a separate disclosure</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Corporate greenhouse gas accounting · NVIDIA FY26 Scope 3 inventory</text>
<rect x="80" y="226" width="694" height="385" rx="14" fill="#10150c" stroke="#39452f"/><rect x="81" y="250" width="4" height="337" rx="2" fill="#76b900" stroke="none"/><text x="115" y="282" font-size="25" fill="#b7f04a" font-weight="750">REPORTED SCOPE 3</text><text x="115" y="406" font-size="76" fill="#f4f6f1" font-weight="800">10.7 million</text><text x="118" y="465" font-size="35" fill="#9aa094" font-weight="600">metric tonnes CO₂e</text><text x="118" y="542" font-size="28" fill="#9aa094" font-weight="550">Bloomberg’s FY26 inventory figure</text><rect x="800" y="226" width="720" height="385" rx="14" fill="#10150c" stroke="#39452f"/>
<rect x="801" y="246" width="4" height="345" rx="2" fill="#9aa094" stroke="none"/>
<text x="832" y="274" font-size="24" fill="#9aa094" font-weight="720">SEPARATE DISCLOSURE</text>
<text x="832" y="344" font-size="42" fill="#f4f6f1" font-weight="780">Avoided emissions</text>
<text x="832" y="403" font-size="30" fill="#9aa094" font-weight="550">An estimate of emissions saved against</text>
<text x="832" y="446" font-size="30" fill="#9aa094" font-weight="550">a comparison scenario, such as using</text>
<text x="832" y="489" font-size="30" fill="#9aa094" font-weight="550">more efficient equipment.</text><rect x="80" y="685" width="1440" height="122" rx="14" fill="#17160e" stroke="#4a3c25"/>
<rect x="81" y="699" width="4" height="94" rx="2" fill="#e8b04a" stroke="none"/>
<text x="112" y="730" font-size="30" fill="#e8b04a" font-weight="750">Keep the inventory total intact</text>
<text x="112" y="775" font-size="27" fill="#f4f6f1" font-weight="550">GHG Protocol requires separate reporting of avoided-emissions claims for sold products.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Bloomberg, NVIDIA FY26 · GHG Protocol Scope 3 guidance, accessed Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
