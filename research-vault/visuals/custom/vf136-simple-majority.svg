<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>Shareholders backed simple-majority voting</title><desc>Nonbinding proposal to replace supermajority rules · shares · June 2026 annual meeting</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Shareholders backed simple-majority voting</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Nonbinding proposal to replace supermajority rules · shares · June 2026 annual meeting</text>
<line x1="365" y1="212" x2="365" y2="609" stroke="#39452f" stroke-width="2"/><text x="338" y="266" fill="#f4f6f1" font-size="30" font-weight="750" text-anchor="end">For</text><rect x="365" y="224" width="819.0000" height="62" rx="2" fill="#76b900"/><text x="1515" y="266" fill="#b7f04a" font-size="36" font-weight="750" text-anchor="end">14,589,671,908</text><text x="338" y="366" fill="#9aa094" font-size="30" font-weight="500" text-anchor="end">Against</text><rect x="365" y="324" width="124.0755" height="62" rx="2" fill="#e8b04a"/><text x="1515" y="366" fill="#f4f6f1" font-size="36" font-weight="750" text-anchor="end">2,210,282,205</text><text x="338" y="466" fill="#9aa094" font-size="30" font-weight="500" text-anchor="end">Abstained</text><rect x="365" y="424" width="3.1849" height="62" rx="2" fill="#6b7661"/><text x="1515" y="466" fill="#f4f6f1" font-size="36" font-weight="750" text-anchor="end">56,735,273</text><text x="338" y="566" fill="#9aa094" font-size="30" font-weight="500" text-anchor="end">Broker non-votes</text><rect x="365" y="524" width="158.8480" height="62" rx="2" fill="#6b7661"/><text x="1515" y="566" fill="#f4f6f1" font-size="36" font-weight="750" text-anchor="end">2,829,718,733</text><rect x="80" y="689" width="1440" height="72" rx="12" fill="#17170e" stroke="#3e3821" stroke-width="2"/><text x="106" y="734" fill="#e8b04a" font-size="23" font-weight="750" text-anchor="start">ADVISORY VOTE</text><text x="385" y="734" fill="#f4f6f1" font-size="27" font-weight="500" text-anchor="start">The proposal was nonbinding. The vote itself did not amend the charter or bylaws.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA SEC filing · June 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
