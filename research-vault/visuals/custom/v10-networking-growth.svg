<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Data Center networking revenue surged</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">NVIDIA reported revenue growth · year on year · FY26</text>
<rect x="80" y="204" width="605" height="424" rx="16" fill="#111a0e" stroke="#303d29" stroke-width="2"/><line x1="83" y1="222" x2="83" y2="610" stroke="#76b900" stroke-width="6" stroke-linecap="round"/><text x="119" y="275" fill="#b7f04a" font-size="21" font-weight="740" text-anchor="start" letter-spacing="2">DATA CENTER NETWORKING</text><text x="111" y="462" fill="#b7f04a" font-size="146" font-weight="830" text-anchor="start" letter-spacing="-6">+142%</text><text x="119" y="536" fill="#f4f6f1" font-size="31" font-weight="680" text-anchor="start" letter-spacing="0">Revenue growth year on year</text><rect x="708" y="204" width="812" height="424" rx="16" fill="#10150c" stroke="#303d29" stroke-width="2"/><text x="746" y="275" fill="#9aa094" font-size="21" font-weight="740" text-anchor="start" letter-spacing="2">WHAT NVIDIA SAID DROVE GROWTH</text><text x="746" y="366" fill="#f4f6f1" font-size="39" font-weight="760" text-anchor="start" letter-spacing="0">NVLink adoption</text><text x="746" y="411" fill="#9aa094" font-size="27" font-weight="500" text-anchor="start" letter-spacing="0">Deployment in NVIDIA GPU systems</text><line x1="746" y1="459" x2="1482" y2="459" stroke="#39452f" stroke-width="2" stroke-linecap="round"/><text x="746" y="524" fill="#f4f6f1" font-size="39" font-weight="760" text-anchor="start" letter-spacing="0">Ethernet and InfiniBand</text><text x="746" y="569" fill="#9aa094" font-size="27" font-weight="500" text-anchor="start" letter-spacing="0">Growth across both platforms</text><rect x="80" y="670" width="1440" height="106" rx="16" fill="#10150c" stroke="#303d29" stroke-width="2"/><line x1="83" y1="686" x2="83" y2="760" stroke="#e8b04a" stroke-width="5" stroke-linecap="round"/><text x="112" y="711" fill="#e8b04a" font-size="27" font-weight="750" text-anchor="start" letter-spacing="0">Watch the reporting scope</text><text x="112" y="747" fill="#f4f6f1" font-size="25" font-weight="500" text-anchor="start" letter-spacing="0">NVIDIA later recast customer-group figures, and the newer networking figure has a different label.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA FY26 10-K, Feb 2026 · Q2 FY27 10-Q, Aug 2026 · earnings call via Google Finance, Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
