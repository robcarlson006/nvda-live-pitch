<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>A supply shock can coincide with weaker demand</title><desc>NVIDIA’s operating risk disclosures and H200 charge · USD bn · first half of FY27</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">A supply shock can coincide with weaker demand</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">NVIDIA’s operating risk disclosures and H200 charge · USD bn · first half of FY27</text>
<rect x="80" y="228" width="695" height="343" rx="16" fill="#10150c" stroke="#39452f" stroke-width="2"/><text x="111" y="291" fill="#9aa094" font-size="26" font-weight="700" text-anchor="start">SUPPLY SHOCK</text><text x="111" y="375" fill="#f4f6f1" font-size="53" font-weight="800" text-anchor="start">Recovery takes time</text><text x="111" y="455" fill="#f4f6f1" font-size="29" font-weight="500" text-anchor="start">Qualifying a replacement foundry or</text><text x="111" y="494" fill="#f4f6f1" font-size="29" font-weight="500" text-anchor="start">contractor can delay volume production.</text><rect x="815" y="228" width="705" height="343" rx="16" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="843" y="258" width="40" height="4" rx="2" fill="#e8b04a"/><text x="843" y="302" fill="#9aa094" font-size="26" font-weight="700" text-anchor="start">DEMAND SHOCK · REPORTED EXAMPLE</text><text x="841" y="391" fill="#e8b04a" font-size="71" font-weight="800" text-anchor="start">$0.4bn</text><text x="843" y="449" fill="#f4f6f1" font-size="28" font-weight="500" text-anchor="start">H200 inventory and purchase-obligation</text><text x="843" y="486" fill="#f4f6f1" font-size="28" font-weight="500" text-anchor="start">charge as H200 demand fell in H1 FY27.</text><rect x="80" y="650" width="1440" height="108" rx="12" fill="#17170e" stroke="#3e3821" stroke-width="2"/><text x="106" y="695" fill="#e8b04a" font-size="23" font-weight="750" text-anchor="start">COMBINED EXPOSURE</text><text x="385" y="695" fill="#f4f6f1" font-size="27" font-weight="500" text-anchor="start">Customers can often delay or cancel orders. The filings do not size</text><text x="385" y="731" fill="#f4f6f1" font-size="27" font-weight="500" text-anchor="start">a simultaneous supply-and-demand shock.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Form 10-K · Feb 2026 | Form 10-Q · Aug 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
