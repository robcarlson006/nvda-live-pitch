<svg role="img" aria-labelledby="chart-title chart-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="chart-title">PwC’s tenure outlasts any lead partner</title>
<desc id="chart-desc">External auditor appointment and lead-partner rotation · NVIDIA proxy and vote, 2026</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">PwC’s tenure outlasts any lead partner</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">External auditor appointment and lead-partner rotation · NVIDIA proxy and vote, 2026</text>
<rect x="80" y="220" width="700" height="352" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="108" y="248" width="42" height="4" rx="2" fill="#b7f04a"/><text x="108" y="292" fill="#9aa094" font-size="22" font-weight="730">AUDIT FIRM</text><text x="108" y="371" fill="#b7f04a" font-size="66" font-weight="800">Since 2004</text><text x="108" y="428" fill="#f4f6f1" font-size="29" font-weight="500">PwC has audited NVIDIA annually, according</text><text x="108" y="466" fill="#f4f6f1" font-size="29" font-weight="500">to the proxy. Shareholders ratified it for FY2027.</text><rect x="812" y="220" width="708" height="352" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="840" y="248" width="42" height="4" rx="2" fill="#f4f6f1"/><text x="840" y="292" fill="#9aa094" font-size="22" font-weight="730">LEAD PARTNER</text><text x="840" y="371" fill="#f4f6f1" font-size="66" font-weight="800">Five years</text><text x="840" y="428" fill="#f4f6f1" font-size="29" font-weight="500">Maximum consecutive term for the</text><text x="840" y="466" fill="#f4f6f1" font-size="29" font-weight="500">lead audit partner at PwC.</text><rect x="80" y="640" width="1440" height="142" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><text x="110" y="682" fill="#b7f04a" font-size="22" font-weight="750">GOVERNANCE QUESTION</text><text x="110" y="725" fill="#f4f6f1" font-size="26" font-weight="500">Ask how the audit committee evaluates the firm’s independence across successive lead partners.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA SEC proxy and shareholder vote filings, May and Jun 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
