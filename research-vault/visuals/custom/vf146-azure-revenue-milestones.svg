<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Azure passed a new revenue milestone</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Microsoft Azure annual revenue milestones · USD billions · FY2025 and FY2026</text>
<rect x="80" y="245" width="694" height="342" rx="16" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="267" width="6" height="298" rx="3" fill="#39452f"/><text x="120" y="320" fill="#9aa094" font-size="31" font-weight="700">FY2025</text><text x="120" y="459" fill="#f4f6f1" font-size="96" font-weight="800">&gt;$75bn</text><text x="120" y="526" fill="#9aa094" font-size="27" font-weight="500">Annual Azure revenue</text><rect x="826" y="245" width="694" height="342" rx="16" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="826" y="267" width="6" height="298" rx="3" fill="#76b900"/><text x="866" y="320" fill="#9aa094" font-size="31" font-weight="700">FY2026</text><text x="866" y="459" fill="#b7f04a" font-size="96" font-weight="800">&gt;$100bn</text><text x="866" y="526" fill="#9aa094" font-size="27" font-weight="500">Annual Azure revenue</text><text x="80" y="763" fill="#9aa094" font-size="26" font-weight="500">Azure revenue covers AI and other cloud workloads.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Microsoft earnings releases · Jul 2025 and Jul 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
