<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">The US overnight rate rose into October</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Effective federal funds rate · monthly average, % · Aug to Oct 2026</text>
<line x1="140" y1="610" x2="1480" y2="610" stroke="#39452f" stroke-width="2" stroke-dasharray="4 8"/><line x1="140" y1="483" x2="1480" y2="483" stroke="#39452f" stroke-width="2" stroke-dasharray="4 8"/><line x1="140" y1="345" x2="1480" y2="345" stroke="#39452f" stroke-width="2" stroke-dasharray="4 8"/><path d="M345,610 L805,483 L1265,345" fill="none" stroke="#76b900" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="345" cy="610" r="11" fill="#f4f6f1"/><text x="345" y="581" fill="#f4f6f1" font-size="42" font-weight="780" text-anchor="middle">3.63%</text><text x="345" y="686" fill="#f4f6f1" font-size="27" font-weight="600" text-anchor="middle">Aug 2026</text><circle cx="805" cy="483" r="11" fill="#f4f6f1"/><text x="805" y="454" fill="#f4f6f1" font-size="42" font-weight="780" text-anchor="middle">3.75%</text><text x="805" y="686" fill="#f4f6f1" font-size="27" font-weight="600" text-anchor="middle">Sep 2026</text><circle cx="1265" cy="345" r="11" fill="#b7f04a"/><text x="1265" y="316" fill="#b7f04a" font-size="42" font-weight="780" text-anchor="middle">3.88%</text><text x="1265" y="686" fill="#f4f6f1" font-size="27" font-weight="600" text-anchor="middle">Oct 2026</text><line x1="80" y1="748" x2="1520" y2="748" stroke="#39452f" stroke-width="2" stroke-dasharray="none"/><text x="80" y="782" fill="#9aa094" font-size="25" font-weight="600" text-anchor="start">This is an overnight rate. Valuing NVIDIA requires a company discount rate.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Federal Reserve via FRED · Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
