<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">NVIDIA adds permanent export oversight</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Board and compliance changes announced in November 2026</text>
<rect x="80" y="218" width="1440" height="146" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="218" width="6" height="146" rx="14" fill="#76b900" stroke="none" stroke-width="2"/><text x="111" y="272" fill="#b7f04a" font-size="23" font-weight="750" text-anchor="start">17 NOVEMBER</text><text x="486" y="273" fill="#f4f6f1" font-size="36" font-weight="750" text-anchor="start">Board forms a standing committee</text><text x="486" y="324" fill="#c9cdc4" font-size="25" font-weight="500" text-anchor="start">Independent directors oversee national security, export compliance and trade risk.</text><rect x="80" y="379" width="1440" height="146" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="379" width="6" height="146" rx="14" fill="#76b900" stroke="none" stroke-width="2"/><text x="111" y="433" fill="#b7f04a" font-size="23" font-weight="750" text-anchor="start">23 NOVEMBER</text><text x="486" y="434" fill="#f4f6f1" font-size="36" font-weight="750" text-anchor="start">Committee seeks specialist advice</text><text x="486" y="485" fill="#c9cdc4" font-size="25" font-weight="500" text-anchor="start">NVIDIA is engaging counsel and searching for a chief compliance officer.</text><rect x="80" y="540" width="1440" height="146" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="540" width="6" height="146" rx="14" fill="#e8b04a" stroke="none" stroke-width="2"/><text x="111" y="594" fill="#e8b04a" font-size="23" font-weight="750" text-anchor="start">23 NOVEMBER</text><text x="486" y="595" fill="#f4f6f1" font-size="36" font-weight="750" text-anchor="start">Independent investigation continues</text><text x="486" y="646" fill="#c9cdc4" font-size="25" font-weight="500" text-anchor="start">NVIDIA says its board committee will see the inquiry through to conclusion.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Newsroom, 17 and 23 Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
