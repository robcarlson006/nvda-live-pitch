<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>The U.S. lost-time case rate stayed flat</title><desc>NVIDIA’s U.S. recordable incident rate fell from 0.11 to 0.07 per 200,000 labor hours, while its lost-time case rate stayed at 0.01.</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">The U.S. lost-time case rate stayed flat</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">NVIDIA U.S. employees · cases per 200,000 labor hours · FY24–FY26</text>
<line x1="168" y1="725" x2="1460" y2="725" stroke="#39452f" stroke-width="2" stroke-dasharray=""/><line x1="250" y1="238" x2="250" y2="725" stroke="#263022" stroke-width="2" stroke-dasharray="5 9"/><text x="250" y="781" fill="#9aa094" font-size="28" font-weight="550" text-anchor="middle">FY24</text><line x1="665" y1="238" x2="665" y2="725" stroke="#263022" stroke-width="2" stroke-dasharray="5 9"/><text x="665" y="781" fill="#9aa094" font-size="28" font-weight="550" text-anchor="middle">FY25</text><line x1="1080" y1="238" x2="1080" y2="725" stroke="#263022" stroke-width="2" stroke-dasharray="5 9"/><text x="1080" y="781" fill="#9aa094" font-size="28" font-weight="550" text-anchor="middle">FY26</text><polyline points="250,287.2 665,406.6 1080,446.4" fill="none" stroke="#97a88a" stroke-width="6" stroke-linecap="round" /><circle cx="250" cy="287.2" r="9" fill="#97a88a" stroke="#0b0d0a" stroke-width="3"/><text x="250" y="261.2" fill="#f4f6f1" font-size="32" font-weight="760" text-anchor="middle">0.11</text><circle cx="665" cy="406.6" r="9" fill="#97a88a" stroke="#0b0d0a" stroke-width="3"/><text x="665" y="380.6" fill="#f4f6f1" font-size="32" font-weight="760" text-anchor="middle">0.08</text><circle cx="1080" cy="446.4" r="9" fill="#97a88a" stroke="#0b0d0a" stroke-width="3"/><text x="1080" y="420.4" fill="#f4f6f1" font-size="32" font-weight="760" text-anchor="middle">0.07</text><text x="1125" y="454.4" fill="#97a88a" font-size="27" font-weight="720" text-anchor="start">OSHA-recordable incidents</text><polyline points="250,685.2 665,685.2 1080,685.2" fill="none" stroke="#b7f04a" stroke-width="6" stroke-linecap="round" /><circle cx="250" cy="685.2" r="9" fill="#b7f04a" stroke="#0b0d0a" stroke-width="3"/><text x="250" y="659.2" fill="#f4f6f1" font-size="32" font-weight="760" text-anchor="middle">0.01</text><circle cx="665" cy="685.2" r="9" fill="#b7f04a" stroke="#0b0d0a" stroke-width="3"/><text x="665" y="659.2" fill="#f4f6f1" font-size="32" font-weight="760" text-anchor="middle">0.01</text><circle cx="1080" cy="685.2" r="9" fill="#b7f04a" stroke="#0b0d0a" stroke-width="3"/><text x="1080" y="659.2" fill="#f4f6f1" font-size="32" font-weight="760" text-anchor="middle">0.01</text><text x="1125" y="693.2" fill="#b7f04a" font-size="27" font-weight="720" text-anchor="start">Lost-time cases</text>
