<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Video energy needs a per-clip measurement</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Electricity measurement for generated video · Google text-serving study as a method example</text>
<rect x="80" y="214" width="1440" height="138" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="232" width="5" height="102" rx="2" fill="#e8b04a"/><text x="112" y="274" fill="#e8b04a" font-size="38" font-weight="770" text-anchor="start">Video clip electricity is unmeasured in our evidence</text><text x="112" y="317" fill="#f4f6f1" font-size="29" font-weight="550" text-anchor="start">A per-clip figure needs a video measurement under documented conditions.</text><text x="112" y="420" fill="#f4f6f1" font-size="30" font-weight="745" text-anchor="start">Define the clip</text><text x="584" y="420" fill="#9aa094" font-size="28" font-weight="550" text-anchor="start">State duration, resolution and generation settings.</text><line x1="112" x2="1488" y1="447" y2="447" stroke="#39452f"/><text x="112" y="505" fill="#f4f6f1" font-size="30" font-weight="745" text-anchor="start">Measure the service</text><text x="584" y="505" fill="#9aa094" font-size="28" font-weight="550" text-anchor="start">Include active hardware, idle capacity and data-centre overhead.</text><line x1="112" x2="1488" y1="532" y2="532" stroke="#39452f"/><text x="112" y="590" fill="#f4f6f1" font-size="30" font-weight="745" text-anchor="start">Report variability</text><text x="584" y="590" fill="#9aa094" font-size="28" font-weight="550" text-anchor="start">State the number of runs and show how consumption varies across clips.</text><line x1="112" x2="1488" y1="617" y2="617" stroke="#39452f"/><rect x="80" y="680" width="1440" height="109" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="698" width="5" height="73" rx="2" fill="#76b900"/><text x="112" y="728" fill="#b7f04a" font-size="37" font-weight="780" text-anchor="start">0.24 Wh</text><text x="316" y="727" fill="#f4f6f1" font-size="28" font-weight="550" text-anchor="start">May 2025 median Gemini text prompt, shown as a measurement example</text><text x="316" y="761" fill="#9aa094" font-size="24" font-weight="550" text-anchor="start">The Google study did not measure video clips.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Google Research, August 2025 · MLCommons power methodology, accessed November 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
