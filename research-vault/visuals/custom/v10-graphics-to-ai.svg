<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">NVIDIA went from graphics to AI</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Selected milestones in NVIDIA’s corporate timeline · 1993–2012</text>
<line x1="102" y1="346" x2="1498" y2="346" stroke="#39452f" stroke-width="3" stroke-linecap="round"/><text x="93" y="303" fill="#9aa094" font-size="67" font-weight="800" text-anchor="start" letter-spacing="-2">1993</text><circle cx="100" cy="346" r="8" fill="#9aa094"/><rect x="80" y="381" width="345" height="302" rx="16" fill="#10150c" stroke="#303d29" stroke-width="2"/><text x="105" y="457" fill="#f4f6f1" font-size="37" font-weight="760" text-anchor="start" letter-spacing="0">Founding</text><text x="105" y="514" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start" letter-spacing="0">A graphics company</text><text x="105" y="550" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start" letter-spacing="0">focused on games</text><text x="105" y="586" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start" letter-spacing="0">and multimedia.</text><text x="458" y="303" fill="#9aa094" font-size="67" font-weight="800" text-anchor="start" letter-spacing="-2">1999</text><circle cx="465" cy="346" r="8" fill="#9aa094"/><rect x="445" y="381" width="345" height="302" rx="16" fill="#10150c" stroke="#303d29" stroke-width="2"/><text x="470" y="457" fill="#f4f6f1" font-size="37" font-weight="760" text-anchor="start" letter-spacing="0">GPU milestone</text><text x="470" y="514" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start" letter-spacing="0">NVIDIA marks the</text><text x="470" y="550" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start" letter-spacing="0">introduction of</text><text x="470" y="586" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start" letter-spacing="0">its GPU.</text><text x="823" y="303" fill="#9aa094" font-size="67" font-weight="800" text-anchor="start" letter-spacing="-2">2006</text><circle cx="830" cy="346" r="8" fill="#9aa094"/><rect x="810" y="381" width="345" height="302" rx="16" fill="#10150c" stroke="#303d29" stroke-width="2"/><text x="835" y="457" fill="#f4f6f1" font-size="37" font-weight="760" text-anchor="start" letter-spacing="0">CUDA</text><text x="835" y="514" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start" letter-spacing="0">GPUs open up to</text><text x="835" y="550" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start" letter-spacing="0">parallel computing</text><text x="835" y="586" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start" letter-spacing="0">for researchers.</text><text x="1188" y="303" fill="#b7f04a" font-size="67" font-weight="800" text-anchor="start" letter-spacing="-2">2012</text><circle cx="1195" cy="346" r="8" fill="#b7f04a"/><rect x="1175" y="381" width="345" height="302" rx="16" fill="#111a0e" stroke="#303d29" stroke-width="2"/><text x="1200" y="457" fill="#f4f6f1" font-size="37" font-weight="760" text-anchor="start" letter-spacing="0">AlexNet</text><text x="1200" y="514" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start" letter-spacing="0">NVIDIA GPUs power</text><text x="1200" y="550" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start" letter-spacing="0">a neural-network</text><text x="1200" y="586" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start" letter-spacing="0">breakthrough.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA corporate timeline, accessed Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
