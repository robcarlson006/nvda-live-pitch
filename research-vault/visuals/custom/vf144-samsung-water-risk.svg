<text x="80" y="290" fill="#f4f6f1" font-size="31" font-weight="700" text-anchor="start">Withdrawal</text><rect x="80" y="314" width="1260.0" height="48" rx="5" fill="#39452f"/><rect x="80" y="314" width="164.3185462319615" height="48" rx="5" fill="#76b900"/><text x="80" y="402" fill="#b7f04a" font-size="25" font-weight="700" text-anchor="start">2,440 at water-risk sites</text><text x="1360" y="349" fill="#c9cdc4" font-size="27" font-weight="700" text-anchor="start">18,710 total</text><text x="80" y="497" fill="#f4f6f1" font-size="31" font-weight="700" text-anchor="start">Consumption</text><rect x="80" y="521" width="236.51095670764298" height="48" rx="5" fill="#39452f"/><rect x="80" y="521" width="37.173703901656864" height="48" rx="5" fill="#76b900"/><text x="80" y="609" fill="#b7f04a" font-size="25" font-weight="700" text-anchor="start">552 at water-risk sites</text><text x="385" y="556" fill="#c9cdc4" font-size="27" font-weight="700" text-anchor="start">3,512 total</text><line x1="80" y1="708" x2="1520" y2="708" stroke="#39452f" stroke-width="2"/><text x="80" y="754" fill="#9aa094" font-size="25" font-weight="500" text-anchor="start">Water-risk sites are in areas rated high or worse for baseline water stress.</text><text x="80" y="793" fill="#9aa094" font-size="25" font-weight="500" text-anchor="start">Figures cover Samsung’s device division only.</text>
