<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">NVIDIA and Broadcom lead on expected margins</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Consensus company-wide operating margin · % · current fiscal year for each company</text>
<line x1="570" y1="232" x2="570" y2="649" stroke="#26331d" stroke-width="2"/><text x="544" y="277.5" fill="#9aa094" font-size="29" font-weight="540" text-anchor="end">Broadcom</text><rect x="570" y="251" width="692.64" height="35" rx="7" fill="#4d6140"/><text x="1283.6399999999999" y="278.5" fill="#f4f6f1" font-size="31" font-weight="780" text-anchor="start">66.94%</text><text x="544" y="363.5" fill="#f4f6f1" font-size="29" font-weight="730" text-anchor="end">NVIDIA</text><rect x="570" y="337" width="678.57" height="38" rx="7" fill="#76b900"/><text x="1269.5700000000002" y="364.5" fill="#b7f04a" font-size="31" font-weight="780" text-anchor="start">65.58%</text><text x="544" y="449.5" fill="#9aa094" font-size="29" font-weight="540" text-anchor="end">TSMC</text><rect x="570" y="423" width="608.73" height="35" rx="7" fill="#4d6140"/><text x="1199.73" y="450.5" fill="#f4f6f1" font-size="31" font-weight="780" text-anchor="start">58.83%</text><text x="544" y="535.5" fill="#9aa094" font-size="29" font-weight="540" text-anchor="end">AMD</text><rect x="570" y="509" width="300.59" height="35" rx="7" fill="#4d6140"/><text x="891.5899999999999" y="536.5" fill="#f4f6f1" font-size="31" font-weight="780" text-anchor="start">29.05%</text><text x="544" y="621.5" fill="#9aa094" font-size="29" font-weight="540" text-anchor="end">Intel</text><rect x="570" y="595" width="155.93" height="35" rx="7" fill="#4d6140"/><text x="746.9300000000001" y="622.5" fill="#f4f6f1" font-size="31" font-weight="780" text-anchor="start">15.07%</text><rect x="80" y="741" width="1440" height="70" rx="10" fill="#10150d" stroke="#26331d" stroke-width="2"/><rect x="80" y="741" width="5" height="70" rx="2" fill="#e8b04a"/><text x="111" y="784" fill="#f4f6f1" font-size="25" font-weight="500" text-anchor="start">The forecast covers each whole company. Chip design, software and foundry services carry different economics.</text>
