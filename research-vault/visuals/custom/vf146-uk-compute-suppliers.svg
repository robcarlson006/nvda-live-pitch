<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">UK public AI compute uses several suppliers</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Selected AI Research Resource systems · hardware and delivery partners · 2026</text>
<rect x="80" y="218" width="1440" height="134" rx="16" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="240" width="6" height="90" rx="3" fill="#76b900"/><text x="120" y="270" fill="#f4f6f1" font-size="36" font-weight="750">Isambard-AI</text><text x="120" y="310" fill="#9aa094" font-size="26" font-weight="500">University of Bristol</text><text x="720" y="270" fill="#b7f04a" font-size="36" font-weight="750">NVIDIA Grace Hopper</text><text x="720" y="310" fill="#9aa094" font-size="26" font-weight="500">5,448 superchips supplied by HPE</text><rect x="80" y="374" width="1440" height="134" rx="16" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="396" width="6" height="90" rx="3" fill="#39452f"/><text x="120" y="426" fill="#f4f6f1" font-size="36" font-weight="750">Dawn</text><text x="120" y="466" fill="#9aa094" font-size="26" font-weight="500">University of Cambridge</text><text x="720" y="426" fill="#f4f6f1" font-size="36" font-weight="750">Intel GPU Max</text><text x="720" y="466" fill="#9aa094" font-size="26" font-weight="500">1,024 GPUs</text><rect x="80" y="530" width="1440" height="134" rx="16" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="552" width="6" height="90" rx="3" fill="#39452f"/><text x="120" y="582" fill="#f4f6f1" font-size="36" font-weight="750">Zenith</text><text x="120" y="622" fill="#9aa094" font-size="26" font-weight="500">University of Cambridge</text><text x="720" y="582" fill="#f4f6f1" font-size="36" font-weight="750">AMD, Dell and StackHPC</text><text x="720" y="622" fill="#9aa094" font-size="26" font-weight="500">Build partners</text><text x="80" y="763" fill="#9aa094" font-size="26" font-weight="500">The systems serve different workloads. Hardware counts alone give no measure of performance or contract value.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: University of Bristol · Jun 2026 | UK Government · accessed Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
