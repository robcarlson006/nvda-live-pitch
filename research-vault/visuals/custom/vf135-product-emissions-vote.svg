<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Shareholders rejected the emissions proposal</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Shares voted for and against the nonbinding report on use of sold products · June 2026</text>
<text x="114" y="305" fill="#f4f6f1" font-size="37" font-weight="760" text-anchor="start">Against</text><rect x="312" y="260" width="850.00" height="65" rx="7" fill="#e5484d"/><text x="1184.0" y="306" fill="#f4f6f1" font-size="35" font-weight="750" text-anchor="start">13,789,742,126</text><text x="114" y="463" fill="#f4f6f1" font-size="37" font-weight="760" text-anchor="start">For</text><rect x="312" y="418" width="181.20" height="65" rx="7" fill="#76b900"/><text x="515.1984618507724" y="464" fill="#f4f6f1" font-size="35" font-weight="750" text-anchor="start">2,939,623,603</text><text x="114" y="578" fill="#9aa094" font-size="27" font-weight="550" text-anchor="start">Abstentions and broker non-votes are excluded from the bars.</text><rect x="80" y="644" width="1440" height="128" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="662" width="5" height="92" rx="2" fill="#e8b04a"/><text x="112" y="692" fill="#e8b04a" font-size="31" font-weight="760" text-anchor="start">NVIDIA’s proxy separately said it planned to expand reporting</text><text x="112" y="740" fill="#f4f6f1" font-size="27" font-weight="550" text-anchor="start">The vote settled the nonbinding proposal. Publication of the emissions data is a separate question.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA SEC filings, May and June 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
