1="567" x2="751" y2="567" stroke="#2a3522" stroke-width="2" stroke-dasharray="none"/><text x="109" y="596" fill="#f4f6f1" font-size="23" font-weight="500" text-anchor="start">Terminal revenue growth</text><text x="109" y="622" fill="#9aa094" font-size="18" font-weight="500" text-anchor="start">Team long-run assumption</text><text x="751" y="604" fill="#b7f04a" font-size="30" font-weight="750" text-anchor="end">3%</text><line x1="109" y1="641" x2="751" y2="641" stroke="#2a3522" stroke-width="2" stroke-dasharray="none"/><text x="109" y="670" fill="#f4f6f1" font-size="23" font-weight="500" text-anchor="start">Growth reaches the terminal rate</text><text x="109" y="696" fill="#9aa094" font-size="18" font-weight="500" text-anchor="start">Team assumption · straight-line fade after FY28</text><text x="751" y="678" fill="#f4f6f1" font-size="30" font-weight="750" text-anchor="end">FY32</text><rect x="820" y="200" width="700" height="542" rx="14" fill="#11160e" stroke="#2a3522"/><text x="849" y="245" fill="#b7f04a" font-size="20" font-weight="750" text-anchor="start">VALUATION INPUTS</text><line x1="849" y1="271" x2="1491" y2="271" stroke="#2a3522" stroke-width="2" stroke-dasharray="none"/><text x="849" y="300" fill="#f4f6f1" font-size="23" font-weight="500" text-anchor="start">Base discount rate (WACC)</text><text x="849" y="326" fill="#9aa094" font-size="18" font-weight="500" text-anchor="start">Damodaran · US semiconductor average · Jan 2026</text><text x="1491" y="308" fill="#b7f04a" font-size="30" font-weight="750" text-anchor="end">10.55%</text><line x1="849" y1="345" x2="1491" y2="345" stroke="#2a3522" stroke-width="2" stroke-dasharray="none"/><text x="849" y="374" fill="#f4f6f1" font-size="23" font-weight="500" text-anchor="start">Higher discount rate</text><text x="849" y="400" fill="#9aa094" font-size="18" font-weight="500" text-anchor="start">Google Finance · model input</text><text x="1491" y="382" fill="#f4f6f1" font-size="30" font-weight="750" text-anchor="end">