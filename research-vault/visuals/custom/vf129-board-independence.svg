<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Independent directors held most seats in June</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Board elected in June 2026 · independence classifications from the May proxy</text>
<text x="80" y="335" fill="#b7f04a" font-size="108" font-weight="800" text-anchor="start">9 of 10</text><text x="80" y="405" fill="#f4f6f1" font-size="34" font-weight="700" text-anchor="start">Directors classed as independent in the proxy</text><rect x="80" y="460" width="127" height="75" fill="#76b900" rx="10"/><rect x="224" y="460" width="127" height="75" fill="#76b900" rx="10"/><rect x="368" y="460" width="127" height="75" fill="#76b900" rx="10"/><rect x="512" y="460" width="127" height="75" fill="#76b900" rx="10"/><rect x="656" y="460" width="127" height="75" fill="#76b900" rx="10"/><rect x="800" y="460" width="127" height="75" fill="#76b900" rx="10"/><rect x="944" y="460" width="127" height="75" fill="#76b900" rx="10"/><rect x="1088" y="460" width="127" height="75" fill="#76b900" rx="10"/><rect x="1232" y="460" width="127" height="75" fill="#76b900" rx="10"/><rect x="1376" y="460" width="127" height="75" fill="#64725b" rx="10"/><rect x="80" y="567" width="20" height="20" fill="#76b900" rx="4"/><text x="113" y="586" fill="#f4f6f1" font-size="25" font-weight="500" text-anchor="start">Independent director</text><rect x="425" y="567" width="20" height="20" fill="#64725b" rx="4"/><text x="458" y="586" fill="#f4f6f1" font-size="25" font-weight="500" text-anchor="start">NVIDIA executive</text><rect x="80" y="654" width="1440" height="104" fill="#10150c" rx="12" stroke="#313b2a" stroke-width="2"/><rect x="80" y="654" width="5" height="104" fill="#b7f04a" rx="2"/><text x="110" y="692" fill="#b7f04a" font-size="23" font-weight="750" text-anchor="start">External auditor</text><text x="110" y="731" fill="#f4f6f1" font-size="27" font-weight="500" text-anchor="start">Shareholders ratified PwC. The proxy says PwC had audited NVIDIA annually since 2004.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA proxy and shareholder vote filing, May–Jun 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
