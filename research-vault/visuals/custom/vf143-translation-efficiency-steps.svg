<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Software and GPUs both improved efficiency</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Facebook language translation study · reported efficiency gain at each step · 2021</text>
<line x1="140" x2="1520" y1="760.0" y2="760.0" stroke="#39452f" stroke-width="2"/><rect x="295.0" y="446.1" width="150.0" height="313.9" rx="6" fill="#39452f"/><text x="370.0" y="430.1" fill="#f4f6f1" font-size="30" font-weight="750" text-anchor="middle">6.7x</text><text x="370.0" y="804.0" fill="#9aa094" font-size="22" text-anchor="middle">Platform caching</text><rect x="747.0" y="278.8" width="166.0" height="489.2" rx="10" fill="url(#glow)"/><rect x="755.0" y="286.8" width="150.0" height="473.2" rx="6" fill="#76b900"/><text x="830.0" y="270.8" fill="#f4f6f1" font-size="30" font-weight="750" text-anchor="middle">10.1x</text><text x="830.0" y="804.0" fill="#9aa094" font-size="22" text-anchor="middle">GPU acceleration</text><rect x="1215.0" y="647.6" width="150.0" height="112.4" rx="6" fill="#39452f"/><text x="1290.0" y="631.6" fill="#f4f6f1" font-size="30" font-weight="750" text-anchor="middle">2.4x</text><text x="1290.0" y="804.0" fill="#9aa094" font-size="22" text-anchor="middle">Lower precision</text><text x="80" y="191" fill="#9aa094" font-size="26" font-weight="500">Each step uses the previous configuration as its baseline.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Wu et al., Sustainable AI · Nov 2021</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
