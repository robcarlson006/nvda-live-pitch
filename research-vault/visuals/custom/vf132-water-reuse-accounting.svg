<svg role="img" aria-labelledby="title description" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="title">Water reuse and consumption track different flows</title>
<desc id="description">Samsung Electronics water disclosures (thousand tonnes) · 2025</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Water reuse and consumption track different flows</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Samsung Electronics water disclosures (thousand tonnes) · 2025</text>
<rect x="80" y="224" width="756" height="454" rx="12" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="112" y="256" width="48" height="4" rx="2" fill="#76b900" stroke="none" stroke-width="2"/><text x="114" y="312" font-size="30" fill="#f4f6f1" font-weight="700" text-anchor="start">Samsung device division</text><text x="114" y="353" font-size="25" fill="#aab2a5" font-weight="500" text-anchor="start">Water flows at its device sites</text><text x="114" y="424" font-size="29" fill="#f4f6f1" font-weight="700" text-anchor="start">Withdrawn</text><text x="800" y="424" font-size="38" fill="#f4f6f1" font-weight="750" text-anchor="end">18,710</text><text x="114" y="494" font-size="29" fill="#f4f6f1" font-weight="700" text-anchor="start">Discharged</text><text x="800" y="494" font-size="38" fill="#f4f6f1" font-weight="750" text-anchor="end">15,198</text><text x="114" y="601" font-size="29" fill="#b7f04a" font-weight="700" text-anchor="start">Consumed</text><text x="800" y="601" font-size="38" fill="#b7f04a" font-weight="750" text-anchor="end">3,512</text><line x1="114" y1="537" x2="802" y2="537" stroke="#39452f" stroke-width="2"/><rect x="868" y="224" width="652" height="454" rx="12" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="900" y="256" width="48" height="4" rx="2" fill="#39452f" stroke="none" stroke-width="2"/><text x="902" y="313" font-size="30" fill="#f4f6f1" font-weight="700" text-anchor="start">Water reused across Samsung</text><text x="900" y="459" font-size="96" fill="#f4f6f1" font-weight="800" text-anchor="start">134,011</text><text x="902" y="537" font-size="26" fill="#aab2a5" font-weight="500" text-anchor="start">Company-wide figure</text><text x="902" y="575" font-size="26" fill="#aab2a5" font-weight="500" text-anchor="start">Counts water put back into use</text><rect x="80" y="724" width="1440" height="76" rx="12" fill="#19190f" stroke="#413620" stroke-width="2"/><text x="110" y="772" font-size="26" fill="#e8b04a" font-weight="600" text-anchor="start">Consumption is withdrawal minus discharge. Reuse is tracked separately.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Samsung Electronics Sustainability Report, Jun 2026 · Li et al., Mar 2025</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
