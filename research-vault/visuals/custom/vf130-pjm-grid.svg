<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Grid forecasts discount uncertain projects</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">PJM regional load outlook  ·  Annual report and forecast methodology</text>
<rect x="80" y="217" width="552" height="465" rx="16" fill="#10150e" stroke="#39452f" stroke-width="2"/><text x="116" y="270" fill="#9aa094" font-size="23" font-weight="700" text-anchor="start">DATA-CENTRE LOAD GROWTH</text><text x="116" y="383" fill="#b7f04a" font-size="73" font-weight="800" text-anchor="start">Up to ~30 GW</text><text x="116" y="446" fill="#f4f6f1" font-size="30" font-weight="500" text-anchor="start">Projected in PJM’s region</text><text x="116" y="486" fill="#9aa094" font-size="30" font-weight="500" text-anchor="start">2025–2030</text><text x="116" y="613" fill="#9aa094" font-size="23" font-weight="500" text-anchor="start">2025 annual report estimate</text><rect x="670" y="217" width="850" height="465" rx="16" fill="#10150e" stroke="#39452f" stroke-width="2"/><text x="706" y="270" fill="#9aa094" font-size="23" font-weight="700" text-anchor="start">HOW PJM TREATS PROJECTS IN ITS 2026 FORECAST</text><text x="708" y="362" fill="#b7f04a" font-size="32" font-weight="750" text-anchor="start">Near term</text><text x="708" y="406" fill="#f4f6f1" font-size="28" font-weight="500" text-anchor="start">Requires firm commitments.</text><line x1="708" y1="452" x2="1482" y2="452" stroke="#39452f" stroke-width="2"/><text x="708" y="515" fill="#e8b04a" font-size="32" font-weight="750" text-anchor="start">Longer term</text><text x="708" y="560" fill="#f4f6f1" font-size="28" font-weight="500" text-anchor="start">PJM discounts uncertain projects.</text><rect x="80" y="730" width="1440" height="76" rx="16" fill="#201a0e" stroke="#66502a" stroke-width="2"/><text x="110" y="777" fill="#e8b04a" font-size="23" font-weight="600" text-anchor="start">PJM lowered its overall load forecast through 2032 after revising several assumptions.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: PJM 2025 annual report and Feb 2026 load forecast</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
