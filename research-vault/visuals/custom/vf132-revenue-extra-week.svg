<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">NVIDIA’s revenue guide includes an extra week</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Quarterly revenue (USD billions) · Q3 actual and Q4 guidance · FY27</text>
<rect x="80" y="224" width="1440" height="454" rx="12" fill="#10150c" stroke="#39452f" stroke-width="2"/><text x="114" y="337" font-size="29" fill="#f4f6f1" font-weight="700" text-anchor="start">Q3 FY27 actual</text><rect x="467" y="294" width="706.4" height="72" rx="5" fill="#617254" stroke="none" stroke-width="2"/><text x="1194.4" y="345" font-size="34" fill="#f4f6f1" font-weight="750" text-anchor="start">$115.8bn</text><text x="114" y="492" font-size="29" fill="#f4f6f1" font-weight="700" text-anchor="start">Q4 FY27 guidance</text><rect x="467" y="449" width="793.0" height="72" rx="5" fill="#76b900" stroke="none" stroke-width="2"/><text x="1281.0" y="500" font-size="34" fill="#b7f04a" font-weight="750" text-anchor="start">$130bn</text><text x="467" y="615" font-size="25" fill="#aab2a5" font-weight="500" text-anchor="start">Company guidance range is ±3% around the midpoint.</text><rect x="80" y="724" width="1440" height="76" rx="12" fill="#19190f" stroke="#413620" stroke-width="2"/><text x="110" y="772" font-size="26" fill="#e8b04a" font-weight="600" text-anchor="start">The extra week in the guided quarter makes the headline growth comparison less informative.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Q3 FY27 earnings release, Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
