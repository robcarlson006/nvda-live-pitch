<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Data centres could take a larger share of U.S. power</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Share of total U.S. electricity use · estimated in 2023, projected for 2028</text>

<g fill="#f4f6f1" font-size="32" font-weight="600">
  <text x="80" y="366">2023 estimate</text>
  <text x="80" y="583">2028 projection</text>
</g>
<path d="M425 354 H1380 M425 571 H1380" fill="none" stroke="#39452f" stroke-width="2"/>
<path d="M425 340 V368 M425 557 V585" fill="none" stroke="#9aa094" stroke-width="2"/>
<circle cx="775.17" cy="354" r="12" fill="#76b900"/>
<text x="775.17" y="307" fill="#b7f04a" font-size="47" font-weight="800" text-anchor="middle">4.4%</text>
<path d="M958.21 571 H1380" fill="none" stroke="#e8b04a" stroke-width="12"/>
<path d="M958.21 554 V588 M1380 554 V588" fill="none" stroke="#e8b04a" stroke-width="3"/>
