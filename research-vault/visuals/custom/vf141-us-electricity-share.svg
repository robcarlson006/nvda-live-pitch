  <text x="1380" y="521">12%</text>
</g>
<text x="80" y="758" fill="#9aa094" font-size="28">The range covers all data centres, including workloads beyond AI.</text>

<text x="80" y="860" fill="#9aa094" font-size="19">Source: Lawrence Berkeley National Laboratory via U.S. Department of Energy · Dec 2024</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
