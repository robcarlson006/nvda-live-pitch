<svg role="img" aria-labelledby="title description" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="title">India’s AI compute programme has several suppliers</title>
<desc id="description">Empanelled GPUs (count) · May 2025 announcement · IndiaAI portal supplier options</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">India’s AI compute programme has several suppliers</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Empanelled GPUs (count) · May 2025 announcement · IndiaAI portal supplier options</text>
<rect x="80" y="224" width="950" height="454" rx="12" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="112" y="256" width="48" height="4" rx="2" fill="#76b900" stroke="none" stroke-width="2"/><text x="114" y="311" font-size="29" fill="#f4f6f1" font-weight="700" text-anchor="start">GPUs approved for the programme</text><text x="114" y="405" font-size="88" fill="#b7f04a" font-weight="800" text-anchor="start">34,333</text><text x="441" y="398" font-size="26" fill="#aab2a5" font-weight="500" text-anchor="start">Total announced in May 2025</text><rect x="114" y="451" width="469.1" height="92" rx="6" fill="#56694c" stroke="none" stroke-width="2"/><rect x="589.1" y="451" width="404.9" height="92" rx="6" fill="#76b900" stroke="none" stroke-width="2"/><text x="114" y="593" font-size="31" fill="#f4f6f1" font-weight="750" text-anchor="start">18,417</text><text x="114" y="633" font-size="25" fill="#aab2a5" font-weight="500" text-anchor="start">Previously approved</text><text x="589.1" y="593" font-size="31" fill="#b7f04a" font-weight="750" text-anchor="start">15,916</text><text x="589.1" y="633" font-size="25" fill="#aab2a5" font-weight="500" text-anchor="start">Additional GPUs announced</text><rect x="1062" y="224" width="458" height="454" rx="12" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="1094" y="256" width="48" height="4" rx="2" fill="#39452f" stroke="none" stroke-width="2"/><text x="1096" y="311" font-size="28" fill="#f4f6f1" font-weight="700" text-anchor="start">Providers list chips from</text><text x="1096" y="384" font-size="32" fill="#b7f04a" font-weight="700" text-anchor="start">NVIDIA</text><text x="1096" y="449" font-size="32" fill="#f4f6f1" font-weight="700" text-anchor="start">AMD</text><text x="1096" y="514" font-size="32" fill="#f4f6f1" font-weight="700" text-anchor="start">Intel</text><text x="1096" y="579" font-size="32" fill="#f4f6f1" font-weight="700" text-anchor="start">AWS</text><rect x="80" y="724" width="1440" height="76" rx="12" fill="#19190f" stroke="#413620" stroke-width="2"/><text x="110" y="772" font-size="26" fill="#e8b04a" font-weight="600" text-anchor="start">The government’s total covers pooled cloud capacity. NVIDIA’s share is unknown.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: Government of India PIB, May 2025 · IndiaAI portal, accessed Nov 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
