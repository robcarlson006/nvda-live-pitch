<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">InfiniBand was common in top supercomputers</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Systems connected by InfiniBand · top 100 on the June 2023 TOP500 list</text>
<rect x="80" y="216" width="1440" height="326" rx="14" fill="#10150c" stroke="#39452f"/><text x="114" y="275" font-size="24" fill="#b7f04a" font-weight="750">CONNECTED BY INFINIBAND</text><text x="112" y="384" font-size="91" fill="#f4f6f1" font-weight="800">63</text><text x="242" y="383" font-size="40" fill="#9aa094" font-weight="610">of 100 systems</text><rect x="116" y="435" width="1320" height="46" rx="7" fill="#283024" stroke="none"/><rect x="116" y="435" width="831.6" height="46" rx="7" fill="#76b900" stroke="none"/><text x="112" y="607" font-size="34" fill="#f4f6f1" font-weight="760">Ethernet competes for AI workloads</text><text x="112" y="650" font-size="27" fill="#9aa094" font-weight="550">Broadcom offers adaptive routing and congestion control. NVIDIA also sells Spectrum Ethernet.</text><rect x="80" y="694" width="1440" height="122" rx="14" fill="#17160e" stroke="#4a3c25"/>
<rect x="81" y="708" width="4" height="94" rx="2" fill="#e8b04a" stroke="none"/>
<text x="112" y="739" font-size="30" fill="#e8b04a" font-weight="750">Current share and energy use need different evidence</text>
<text x="112" y="784" font-size="27" fill="#f4f6f1" font-weight="550">Measure network energy for the same completed workload. Use current market data for share.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: InfiniBand Trade Association, Jun 2023 count · Canonical, Jun 2026 · Broadcom, Nov 2026 snapshot</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
