"750" text-anchor="middle">0.95</text><text x="1254" y="687" fill="#b7f04a" font-size="26" font-weight="750" text-anchor="middle">FY26</text><text x="82" y="775" fill="#c9cdc4" font-size="27" font-weight="500" text-anchor="start">These are upstream categories. Customer use of sold products sits outside the reported inventory.</text>
