<svg role="img" aria-labelledby="chart-title" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="chart-title">Rivals target both training and inference</title>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Rivals target both training and inference</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Selected accelerator workloads · vendor documentation reviewed November 2026</text>
<text x="112" y="225" fill="#9aa094" font-size="21" font-weight="750">ACCELERATOR</text><text x="502" y="225" fill="#9aa094" font-size="21" font-weight="750">WORKLOAD DESCRIBED BY VENDOR</text><rect x="80" y="250" width="1440" height="83" rx="14" fill="#10150c" stroke="#39452f"/><rect x="80" y="265" width="5" height="53" rx="2" fill="#76b900"/><text x="112" y="302" fill="#b7f04a" font-size="30" font-weight="750">AWS Trainium</text><text x="502" y="302" fill="#f4f6f1" font-size="29" font-weight="550">Training and inference at scale</text><rect x="80" y="353" width="1440" height="83" rx="14" fill="#10150c" stroke="#39452f"/><rect x="80" y="368" width="5" height="53" rx="2" fill="#76b900"/><text x="112" y="405" fill="#b7f04a" font-size="30" font-weight="750">Google Ironwood TPU</text><text x="502" y="405" fill="#f4f6f1" font-size="29" font-weight="550">Training, reasoning and inference on its seventh-generation TPU</text><rect x="80" y="456" width="1440" height="83" rx="14" fill="#10150c" stroke="#39452f"/><rect x="80" y="471" width="5" height="53" rx="2" fill="#39452f"/><text x="112" y="508" fill="#f4f6f1" font-size="30" font-weight="750">Intel Gaudi PCIe</text><text x="502" y="508" fill="#f4f6f1" font-size="29" font-weight="550">Large language models and other enterprise AI workloads</text><rect x="80" y="559" width="1440" height="83" rx="14" fill="#10150c" stroke="#39452f"/><rect x="80" y="574" width="5" height="53" rx="2" fill="#39452f"/><text x="112" y="611" fill="#f4f6f1" font-size="30" font-weight="750">Meta MTIA</text><text x="502" y="611" fill="#f4f6f1" font-size="29" font-weight="550">In-house recommendation workloads · first design in 2020</text><rect x="80" y="724" width="1440" height="78" rx="14" fill="#1b190e" stroke="#39452f"/><rect x="80" y="739" width="5" height="48" rx="2" fill="#e8b04a"/><text x="112" y="772" fill="#e7ddc4" font-size="26" font-weight="550">These examples establish where rivals compete. Market share requires separate evidence.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: AWS, Google Cloud, Intel and Meta · accessed November 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
