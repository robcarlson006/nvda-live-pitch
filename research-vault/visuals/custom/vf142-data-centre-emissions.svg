<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">The IEA projects rising data-centre emissions</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Global CO₂ from data-centre electricity use · million tonnes · IEA baseline and 2035 scenarios</text>
<rect x="145" y="658" width="1310" height="2" rx="6" fill="#39452f" stroke="none" stroke-width="2"/><rect x="251" y="519" width="188" height="139" rx="6" fill="#39452f" stroke="none" stroke-width="2"/><text x="345" y="494" fill="#f4f6f1" font-size="47" font-weight="800" text-anchor="middle">180</text><text x="345" y="707" fill="#f4f6f1" font-size="28" font-weight="700" text-anchor="middle">IEA report baseline</text><text x="345" y="745" fill="#9aa094" font-size="23" font-weight="500" text-anchor="middle">Baseline estimate</text><rect x="706" y="426" width="188" height="232" rx="6" fill="#76b900" stroke="none" stroke-width="2"/><text x="800" y="401" fill="#f4f6f1" font-size="47" font-weight="800" text-anchor="middle">300</text><text x="800" y="707" fill="#f4f6f1" font-size="28" font-weight="700" text-anchor="middle">2035 · Base Case</text><text x="800" y="745" fill="#9aa094" font-size="23" font-weight="500" text-anchor="middle">Central scenario</text><rect x="1161" y="272" width="188" height="386" rx="6" fill="#e8b04a" stroke="none" stroke-width="2"/><text x="1255" y="247" fill="#f4f6f1" font-size="47" font-weight="800" text-anchor="middle">Up to 500</text><text x="1255" y="707" fill="#f4f6f1" font-size="28" font-weight="700" text-anchor="middle">2035 · Lift-Off Case</text><text x="1255" y="745" fill="#9aa094" font-size="23" font-weight="500" text-anchor="middle">Higher-growth scenario</text><text x="80" y="800" fill="#9aa094" font-size="23" font-weight="500" text-anchor="start">The estimate covers electricity use across all data centres.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: IEA, Energy and AI · Apr 2025</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
