<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Huang returned while the investigation continued</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Leadership changes and board oversight · November 2026</text>
<path d="M102 252V693" stroke="#39452f" stroke-width="4"/><circle cx="102" cy="252" r="8" fill="#9aa094"/><text x="129" y="260" fill="#9aa094" font-size="24" font-weight="730" text-anchor="start">12 Nov</text><text x="410" y="249" fill="#f4f6f1" font-size="34" font-weight="750" text-anchor="start">Huang resigns and Kress becomes interim CEO</text><text x="410" y="287" fill="#9aa094" font-size="24" font-weight="500" text-anchor="start">Kress retains the CFO role. Harvey Jones becomes board chair.</text><circle cx="102" cy="399" r="8" fill="#9aa094"/><text x="129" y="407" fill="#9aa094" font-size="24" font-weight="730" text-anchor="start">17 Nov</text><text x="410" y="396" fill="#f4f6f1" font-size="34" font-weight="750" text-anchor="start">NVIDIA announces a standing oversight committee</text><text x="410" y="434" fill="#9aa094" font-size="24" font-weight="500" text-anchor="start">Its remit covers national security, export compliance and global trade risk.</text><circle cx="102" cy="546" r="8" fill="#76b900"/><text x="129" y="554" fill="#76b900" font-size="24" font-weight="730" text-anchor="start">22 Nov</text><text x="410" y="543" fill="#f4f6f1" font-size="34" font-weight="750" text-anchor="start">Huang’s reinstatement takes effect</text><text x="410" y="581" fill="#9aa094" font-size="24" font-weight="500" text-anchor="start">NVIDIA’s SEC filing gives this as the effective date.</text><circle cx="102" cy="693" r="8" fill="#e8b04a"/><text x="129" y="701" fill="#e8b04a" font-size="24" font-weight="730" text-anchor="start">23 Nov</text><text x="410" y="690" fill="#f4f6f1" font-size="34" font-weight="750" text-anchor="start">NVIDIA confirms the investigation will continue</text><text x="410" y="728" fill="#9aa094" font-size="24" font-weight="500" text-anchor="start">A committee of independent directors retained independent counsel.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA SEC filings and company announcements, November 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
