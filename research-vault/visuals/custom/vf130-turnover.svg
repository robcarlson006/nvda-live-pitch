<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Staff turnover rose in FY26</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Employee turnover (%)  ·  Global trend and selected US groups</text>
<rect x="80" y="218" width="696" height="458" rx="16" fill="#10150e" stroke="#39452f" stroke-width="2"/><text x="116" y="271" fill="#9aa094" font-size="23" font-weight="700" text-anchor="start">GLOBAL WORKFORCE</text><rect x="824" y="218" width="696" height="458" rx="16" fill="#10150e" stroke="#39452f" stroke-width="2"/><text x="860" y="271" fill="#9aa094" font-size="23" font-weight="700" text-anchor="start">SELECTED US GROUPS  /  FY26</text><text x="116" y="317" fill="#f4f6f1" font-size="25" font-weight="500" text-anchor="start">FY24</text><text x="739" y="317" fill="#f4f6f1" font-size="31" font-weight="750" text-anchor="end">2.7%</text><rect x="116" y="333" width="623" height="22" rx="16" fill="#232b1d" stroke="#232b1d" stroke-width="2"/><rect x="116" y="333" width="240.3" height="22" rx="11" fill="#59664e"/><text x="116" y="424" fill="#f4f6f1" font-size="25" font-weight="500" text-anchor="start">FY25</text><text x="739" y="424" fill="#f4f6f1" font-size="31" font-weight="750" text-anchor="end">2.5%</text><rect x="116" y="440" width="623" height="22" rx="16" fill="#232b1d" stroke="#232b1d" stroke-width="2"/><rect x="116" y="440" width="222.5" height="22" rx="11" fill="#59664e"/><text x="116" y="531" fill="#f4f6f1" font-size="25" font-weight="500" text-anchor="start">FY26</text><text x="739" y="531" fill="#f4f6f1" font-size="31" font-weight="750" text-anchor="end">3.7%</text><rect x="116" y="547" width="623" height="22" rx="16" fill="#232b1d" stroke="#232b1d" stroke-width="2"/><rect x="116" y="547" width="329.3" height="22" rx="11" fill="#76b900"/><text x="860" y="317" fill="#f4f6f1" font-size="25" font-weight="500" text-anchor="start">Black employees (US)</text><text x="1483" y="317" fill="#f4f6f1" font-size="31" font-weight="750" text-anchor="end">6.3%</text><rect x="860" y="333" width="623" height="22" rx="16" fill="#232b1d" stroke="#232b1d" stroke-width="2"/><rect x="860" y="333" width="560.7" height="22" rx="11" fill="#e8b04a"/><text x="860" y="424" fill="#f4f6f1" font-size="25" font-weight="500" text-anchor="start">Hispanic or Latino employees (US)</text><text x="1483" y="424" fill="#f4f6f1" font-size="31" font-weight="750" text-anchor="end">4.4%</text><rect x="860" y="440" width="623" height="22" rx="16" fill="#232b1d" stroke="#232b1d" stroke-width="2"/><rect x="860" y="440" width="391.6" height="22" rx="11" fill="#e8b04a"/><text x="860" y="614" fill="#9aa094" font-size="22" font-weight="500" text-anchor="start">US group rates use each group’s own workforce.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Sustainability Report, FY26</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
