<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">The securities case returned to district court</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Selected court milestones and accounting status disclosed in NVIDIA’s FY26 annual report</text>
<line x1="105" y1="266" x2="1495" y2="266" stroke="#39452f" stroke-width="3" stroke-linecap="round"/><circle cx="106" cy="266" r="7" fill="#9aa094"/><text x="98" y="237" fill="#9aa094" font-size="21" font-weight="740" text-anchor="start" letter-spacing="2">DEC 2024</text><rect x="80" y="304" width="464" height="316" rx="16" fill="#10150c" stroke="#303d29" stroke-width="2"/><text x="111" y="373" fill="#f4f6f1" font-size="38" font-weight="780" text-anchor="start" letter-spacing="0">Supreme Court</text><text x="111" y="421" fill="#f4f6f1" font-size="38" font-weight="780" text-anchor="start" letter-spacing="0">drops review</text><text x="111" y="520" fill="#9aa094" font-size="27" font-weight="500" text-anchor="start" letter-spacing="0">The justices dismissed</text><text x="111" y="558" fill="#9aa094" font-size="27" font-weight="500" text-anchor="start" letter-spacing="0">NVIDIA’s petition.</text><circle cx="589" cy="266" r="7" fill="#b7f04a"/><text x="581" y="237" fill="#b7f04a" font-size="21" font-weight="740" text-anchor="start" letter-spacing="2">FEB 2025</text><rect x="563" y="304" width="464" height="316" rx="16" fill="#10150c" stroke="#303d29" stroke-width="2"/><text x="594" y="373" fill="#f4f6f1" font-size="38" font-weight="780" text-anchor="start" letter-spacing="0">Case returns to</text><text x="594" y="421" fill="#f4f6f1" font-size="38" font-weight="780" text-anchor="start" letter-spacing="0">district court</text><text x="594" y="520" fill="#9aa094" font-size="27" font-weight="500" text-anchor="start" letter-spacing="0">The class action went back</text><text x="594" y="558" fill="#9aa094" font-size="27" font-weight="500" text-anchor="start" letter-spacing="0">for further proceedings.</text><circle cx="1072" cy="266" r="7" fill="#e8b04a"/><text x="1064" y="237" fill="#e8b04a" font-size="21" font-weight="740" text-anchor="start" letter-spacing="2">JAN 2026</text><rect x="1046" y="304" width="464" height="316" rx="16" fill="#10150c" stroke="#303d29" stroke-width="2"/><text x="1077" y="373" fill="#f4f6f1" font-size="38" font-weight="780" text-anchor="start" letter-spacing="0">NVIDIA could not</text><text x="1077" y="421" fill="#f4f6f1" font-size="38" font-weight="780" text-anchor="start" letter-spacing="0">estimate a loss</text><text x="1077" y="520" fill="#9aa094" font-size="27" font-weight="500" text-anchor="start" letter-spacing="0">NVIDIA recorded no liability</text><text x="1077" y="558" fill="#9aa094" font-size="27" font-weight="500" text-anchor="start" letter-spacing="0">for the disclosed proceedings.</text><rect x="80" y="666" width="1440" height="106" rx="16" fill="#10150c" stroke="#303d29" stroke-width="2"/><line x1="83" y1="682" x2="83" y2="756" stroke="#e8b04a" stroke-width="5" stroke-linecap="round"/><text x="112" y="707" fill="#e8b04a" font-size="27" font-weight="750" text-anchor="start" letter-spacing="0">What shareholders alleged</text><text x="112" y="743" fill="#f4f6f1" font-size="25" font-weight="500" text-anchor="start" letter-spacing="0">Shareholders alleged misleading statements about channel inventory and crypto-related GPU demand.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA FY26 annual report, Feb 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
