<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>NVIDIA reports pay ratios close to parity</title><desc>NVIDIA reports global pay of 99.5 to 100 for women versus men, and its reported U.S. comparisons by race and ethnicity also sit close to parity.</desc>
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">NVIDIA reports pay ratios close to parity</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Company-reported pay ratios · pay relative to each comparison group · FY26</text>
<text x="106" y="241" fill="#9aa094" font-size="26" font-weight="650" text-anchor="start">Comparison</text><text x="1050" y="241" fill="#9aa094" font-size="26" font-weight="650" text-anchor="start">Workforce</text><text x="1456" y="241" fill="#9aa094" font-size="26" font-weight="650" text-anchor="end">Reported ratio</text><rect x="80" y="264" width="1440" height="94" rx="9" fill="#141d0e" stroke="#344624" stroke-width="2"/><rect x="80" y="264" width="6" height="94" rx="6" fill="#76b900" stroke="none" stroke-width="2"/><text x="106" y="321" fill="#f4f6f1" font-size="32" font-weight="680" text-anchor="start">Women vs men</text><text x="1050" y="321" fill="#9aa094" font-size="29" font-weight="500" text-anchor="start">Global</text><text x="1456" y="321" fill="#b7f04a" font-size="35" font-weight="750" text-anchor="end">99.5 to 100</text><rect x="80" y="375" width="1440" height="94" rx="9" fill="#10150c" stroke="none" stroke-width="2"/><text x="106" y="432" fill="#f4f6f1" font-size="32" font-weight="680" text-anchor="start">Asian vs White employees</text><text x="1050" y="432" fill="#9aa094" font-size="29" font-weight="500" text-anchor="start">U.S.</text><text x="1456" y="432" fill="#f4f6f1" font-size="35" font-weight="750" text-anchor="end">100.1 to 100</text><rect x="80" y="486" width="1440" height="94" rx="9" fill="#10150c" stroke="none" stroke-width="2"/><text x="106" y="543" fill="#f4f6f1" font-size="32" font-weight="680" text-anchor="start">Black or African American vs White employees</text><text x="1050" y="543" fill="#9aa094" font-size="29" font-weight="500" text-anchor="start">U.S.</text><text x="1456" y="543" fill="#f4f6f1" font-size="35" font-weight="750" text-anchor="end">100 to 100</text><rect x="80" y="597" width="1440" height="94" rx="9" fill="#10150c" stroke="none" stroke-width="2"/><text x="106" y="654" fill="#f4f6f1" font-size="32" font-weight="680" text-anchor="start">Hispanic or Latino vs White employees</text><text x="1050" y="654" fill="#9aa094" font-size="29" font-weight="500" text-anchor="start">U.S.</text><text x="1456" y="654" fill="#f4f6f1" font-size="35" font-weight="750" text-anchor="end">99.3 to 100</text><text x="80" y="771" fill="#9aa094" font-size="28" font-weight="500" text-anchor="start">The ratios leave role-by-role pay and promotion outcomes open.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA FY26 Sustainability Report</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
