<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Bristol reports low power overhead at Isambard-AI</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Power usage effectiveness (PUE) · Total facility electricity divided by IT electricity</text>
<text x="80" y="262" fill="#f4f6f1" font-size="30" font-weight="700" text-anchor="start">Isambard-AI</text>
<rect x="80" y="285" width="626.4000000000001" height="54" fill="#76b900" rx="5" stroke="none"/>
<text x="728.4000000000001" y="325" fill="#f4f6f1" font-size="38" font-weight="780" text-anchor="start">≈1.08</text>
<text x="80" y="449" fill="#f4f6f1" font-size="30" font-weight="700" text-anchor="start">Typical air-cooled supercomputer</text>
<rect x="80" y="472" width="1160.0" height="54" fill="#39452f" rx="5" stroke="none"/>
<text x="1262.0" y="512" fill="#f4f6f1" font-size="38" font-weight="780" text-anchor="start">≈2.0</text>
<line x1="660" x2="660" y1="244" y2="554" stroke="#e8b04a" stroke-width="2" stroke-dasharray="5 7"/>
<text x="660" y="592" fill="#e8b04a" font-size="24" font-weight="600" text-anchor="middle">PUE of 1 means all facility electricity goes to IT</text>
<line x1="80" x2="1520" y1="666" y2="666" stroke="#39452f" stroke-width="2"/>
<text x="80" y="723" fill="#9aa094" font-size="26" font-weight="500" text-anchor="start">Bristol gives an indicative comparison and leaves the averaging period unspecified.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: University of Bristol · June 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
