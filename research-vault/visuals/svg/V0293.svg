<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Archivo', 'Archivo Variable', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><pattern id="core" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="14" height="14" rx="2" fill="#141a10"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0.18"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#0b0d0a"/><rect width="1600" height="900" fill="url(#core)" opacity="0.55"/>
<rect x="0" y="0" width="10" height="900" fill="#76b900"/>
<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">US licences led to few H200 sales in China</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">NVIDIA’s licensed shipments, inventory charge and import tariff · FY27 filing</text>
<rect x="80" y="275" width="462" height="327" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="80" y="275" width="6" height="327" rx="3" fill="#76b900"/><text x="114" y="398" font-size="88" fill="#b7f04a" font-weight="800">&lt;1%</text><text x="114" y="478" font-size="27" fill="#f4f6f1" font-weight="700">Share of Data Center revenue</text><text x="114" y="520" font-size="22" fill="#9aa094" font-weight="500">Licensed shipments · Q2 FY27</text><rect x="569" y="275" width="462" height="327" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="569" y="275" width="6" height="327" rx="3" fill="#e8b04a"/><text x="603" y="398" font-size="88" fill="#e8b04a" font-weight="800">$0.4bn</text><text x="603" y="478" font-size="27" fill="#f4f6f1" font-weight="700">H200 inventory and obligations</text><text x="603" y="520" font-size="22" fill="#9aa094" font-weight="500">Charge booked · first half FY27</text><rect x="1058" y="275" width="462" height="327" rx="14" fill="#10150c" stroke="#39452f" stroke-width="2"/><rect x="1058" y="275" width="6" height="327" rx="3" fill="#e8b04a"/><text x="1092" y="398" font-size="88" fill="#e8b04a" font-weight="800">25%</text><text x="1092" y="478" font-size="27" fill="#f4f6f1" font-weight="700">US tariff on importation</text><text x="1092" y="520" font-size="22" fill="#9aa094" font-weight="500">Applies to licensed H200 shipments</text><line x1="80" x2="1520" y1="691" y2="691" stroke="#39452f" stroke-width="2"/><text x="80" y="739" font-size="26" fill="#9aa094" font-weight="500">NVIDIA said Chinese restrictions limited sales and it could not pass the tariff on to customers.</text>
<text x="80" y="860" fill="#9aa094" font-size="19">Source: NVIDIA Form 10-Q · August 2026</text>
<text x="1560" y="860" fill="#39452f" font-size="19" text-anchor="end" font-weight="700" letter-spacing="2">NVDA · RESEARCH VAULT</text>
</svg>
