<text x="80" y="96" fill="#f4f6f1" font-size="54" font-weight="800" letter-spacing="-0.5">Bristol reports low overhead at Isambard-AI</text>
<text x="80" y="146" fill="#9aa094" font-size="28" font-weight="500">Power usage effectiveness (ratio) and construction emissions reduction (%) · 2025 and 2026</text>
